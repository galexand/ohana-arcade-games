// ============ WEBAUDIO SOUND ENGINE ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSfx(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'beep') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1760, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        const startTime = now + idx * 0.09;
        g.gain.setValueAtTime(0.12, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
        o.start(startTime); o.stop(startTime + 0.25);
      });
    }
  } catch (e) {}
}

// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

// ============ ISOMETRIC PROJECTION ENGINE ============
// World space stays a flat x/y (+z for height) coordinate system exactly like a
// top-down game (see shelves/checkoutZone/player below). Rendering projects that
// world space onto the screen with a classic 2:1 diamond isometric transform.
// Everything else (movement, collisions, proximity checks, AABB checkout) keeps
// operating purely in world coordinates — projection is render-only.
const WORLD_W = 800;      // world x extent (lateral)
const WORLD_D = 800;      // world y extent (depth, larger y = closer to camera/front)
const WORLD_MAX_Z = 190;  // tallest thing in the scene (shelf box + floating aisle sign)
const SHELF_H = 130;      // shelf box height in world units
const CHECKOUT_H = 55;    // checkout POS box height in world units

const iso = { halfW: 20, halfH: 10, zScale: 10, originX: 0, originY: 0 };

function computeIso() {
  const topPad = 108;                          // clears the top bar + in-canvas HUD
  const bottomPad = isTouchDevice ? 150 : 46;   // clears touch D-pad / shelf button
  const sidePad = 18;
  const availW = Math.max(160, W - sidePad * 2);
  const availH = Math.max(140, H - topPad - bottomPad);

  const scaleW = availW / (WORLD_W + WORLD_D);
  const scaleH = availH / ((WORLD_W + WORLD_D) * 0.5 + WORLD_MAX_Z * 0.5);
  // 0.05 is only a degenerate-viewport safety floor (never zero/negative) — the
  // real fit constraint is whichever of scaleW/scaleH is smaller.
  const tile = Math.max(0.05, Math.min(scaleW, scaleH));

  iso.halfW = tile;
  iso.halfH = tile * 0.5;
  iso.zScale = tile * 0.5;

  // Project the world's bounding volume corners (unshifted) to find how big the
  // whole scene is on screen, then derive an origin that centers it.
  const corners = [
    [0, 0, 0], [WORLD_W, 0, 0], [0, WORLD_D, 0], [WORLD_W, WORLD_D, 0],
    [0, 0, WORLD_MAX_Z], [WORLD_W, 0, WORLD_MAX_Z], [0, WORLD_D, WORLD_MAX_Z], [WORLD_W, WORLD_D, WORLD_MAX_Z]
  ];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  corners.forEach(([wx, wy, wz]) => {
    const sx = (wx - wy) * iso.halfW;
    const sy = (wx + wy) * iso.halfH - wz * iso.zScale;
    if (sx < minX) minX = sx; if (sx > maxX) maxX = sx;
    if (sy < minY) minY = sy; if (sy > maxY) maxY = sy;
  });

  iso.originX = W / 2 - (minX + maxX) / 2;
  iso.originY = topPad + (availH - (maxY - minY)) / 2 - minY;
}

function project(wx, wy, wz) {
  return {
    x: (wx - wy) * iso.halfW + iso.originX,
    y: (wx + wy) * iso.halfH - (wz || 0) * iso.zScale + iso.originY
  };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeIso();
}
window.addEventListener('resize', resize);

// Supermarket Aisles & Shelves Definition — world coordinates (x lateral, y depth,
// larger y = closer to camera/front of store). Two long shelf rows run along the

// Touch Control Binds
function bindTouchBtn(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = e => { e.preventDefault(); initAudio(); keys[keyName] = true; };
  const off = e => { e.preventDefault(); keys[keyName] = false; };

function interactWithNearestShelf() {
  const nearShelf = getNearbyShelf();
  if (nearShelf) {
    openShelfModal(nearShelf);
  }
}

// Nearest point on a shelf's AABB footprint to a world point — used both for the
// proximity prompt and for circle/box collision. Distance-to-nearest-edge (rather
// than distance-to-center) works correctly for the long shelf rows so the whole
// length of a shelf is reachable, not just a spot near its middle.
function nearestPointOnRect(px, py, s) {
  const nx = Math.max(s.x, Math.min(px, s.x + s.w));
  const ny = Math.max(s.y, Math.min(py, s.y + s.h));
  return { x: nx, y: ny };
}

function getNearbyShelf() {
  for (const s of shelves) {
    const np = nearestPointOnRect(player.x, player.y, s);
    const dist = Math.hypot(player.x - np.x, player.y - np.y);
    if (dist < 60) return s;
  }
  return null;
}

function circleHitsShelf(cx, cy, r, s) {
  const np = nearestPointOnRect(cx, cy, s);
  const dx = cx - np.x, dy = cy - np.y;
  return (dx * dx + dy * dy) < r * r;
}

function update(dt) {
  if (gameState !== 'PLAY') return;

  // Timer countdown
  if (levelTimer > 0) {
    levelTimer -= dt;
    if (levelTimer <= 0) {
      setGameState('GAME_OVER');
      return;
    }
  }

  // Player Movement & Physics (world coords: x = lateral, y = depth, larger y =
  // toward the camera/front of the store — Up moves away/back, Down moves toward
  // camera, matching the isometric view).
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
  if (dx !== 0) player.facing = dx > 0 ? 1 : -1;

  // World bounds (fixed, independent of screen size/projection)
  const minX = 20, maxX = 780, minY = 20, maxY = 780;

  // Sliding shelf collision: resolve each axis independently so the player never
  // gets stuck against a shelf — it just slides along it.
  let nextX = player.x + dx * player.speed * dt;
  nextX = Math.max(minX, Math.min(maxX, nextX));
  let blockedX = false;
  for (const s of shelves) { if (circleHitsShelf(nextX, player.y, player.r, s)) { blockedX = true; break; } }
  if (!blockedX) player.x = nextX;

  let nextY = player.y + dy * player.speed * dt;
  nextY = Math.max(minY, Math.min(maxY, nextY));
  let blockedY = false;
  for (const s of shelves) { if (circleHitsShelf(player.x, nextY, player.r, s)) { blockedY = true; break; } }
  if (!blockedY) player.y = nextY;

  // Checkout Register Area Check
  if (player.x >= checkoutZone.x && player.x <= checkoutZone.x + checkoutZone.w &&
      player.y >= checkoutZone.y && player.y <= checkoutZone.y + checkoutZone.h) {
    checkOutCart();
  }
}

function checkOutCart() {
  const lvl = LEVELS[currentLevelIdx];
  const req = lvl.targetItems.slice().sort();
  const got = player.cart.slice().sort();

  // Check if all list items are matched
  const isMatch = req.length === got.length && req.every((val, idx) => val === got[idx]);

  if (isMatch) {
    playSfx('beep');
    playSfx('fanfare');
    score += 500 + (levelTimer > 0 ? Math.floor(levelTimer * 10) : 0);

    if (currentLevelIdx + 1 < LEVELS.length) {
      setGameState('LEVEL_CLEAR');
    } else {
      setGameState('VICTORY');
    }
  } else {
    showFeedback('⚠️ SCAN INCOMPLETE: COLLECT ALL LIST ITEMS FIRST!', true);
  }
}

// ============ ISOMETRIC SCENE DRAWING ============

// Hypermarket floor as a grid of iso diamond tiles covering the whole world.
function drawIsoFloor() {
  const tileWorld = 100;
  ctx.save();
  ctx.lineWidth = 1;
  for (let gy = 0; gy < WORLD_D; gy += tileWorld) {
    for (let gx = 0; gx < WORLD_W; gx += tileWorld) {
      const p0 = project(gx, gy, 0);
      const p1 = project(gx + tileWorld, gy, 0);
      const p2 = project(gx + tileWorld, gy + tileWorld, 0);
      const p3 = project(gx, gy + tileWorld, 0);
      const checker = ((gx / tileWorld) + (gy / tileWorld)) % 2 === 0;
      ctx.fillStyle = checker ? '#f1f5f9' : '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
      ctx.stroke();
    }
  }
  ctx.restore();
}

// A shelf drawn as a 3D box (right face + front face + top face), with an aisle
// sign floating above, a price-tag rail on the front, and products standing as
// upright emoji billboards on the top surface.
function drawIsoShelf(s, isNear) {
  const spriteScale = iso.halfW / 20;

  // Ground shadow (slightly offset toward the camera)
  const shOff = 14;
  const sh0 = project(s.x + shOff, s.y + shOff, 0);
  const sh1 = project(s.x + s.w + shOff, s.y + shOff, 0);
  const sh2 = project(s.x + s.w + shOff, s.y + s.h + shOff, 0);
  const sh3 = project(s.x + shOff, s.y + s.h + shOff, 0);
  ctx.fillStyle = 'rgba(8, 15, 30, 0.3)';
  ctx.beginPath();
  ctx.moveTo(sh0.x, sh0.y); ctx.lineTo(sh1.x, sh1.y); ctx.lineTo(sh2.x, sh2.y); ctx.lineTo(sh3.x, sh3.y);
  ctx.closePath(); ctx.fill();

  // Right face (facing +x)
  const r0 = project(s.x + s.w, s.y, 0);
  const r1 = project(s.x + s.w, s.y + s.h, 0);
  const r2 = project(s.x + s.w, s.y + s.h, SHELF_H);
  const r3 = project(s.x + s.w, s.y, SHELF_H);
  ctx.fillStyle = '#152238';
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(r0.x, r0.y); ctx.lineTo(r1.x, r1.y); ctx.lineTo(r2.x, r2.y); ctx.lineTo(r3.x, r3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Front face (facing +y, toward the camera)
  const f0 = project(s.x, s.y + s.h, 0);
  const f1 = project(s.x + s.w, s.y + s.h, 0);
  const f2 = project(s.x + s.w, s.y + s.h, SHELF_H);
  const f3 = project(s.x, s.y + s.h, SHELF_H);
  const frontGrad = ctx.createLinearGradient(f0.x, f0.y, f3.x, f3.y);
  frontGrad.addColorStop(0, '#1e293b');
  frontGrad.addColorStop(1, '#334155');
  ctx.fillStyle = frontGrad;
  ctx.beginPath();
  ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.lineTo(f2.x, f2.y); ctx.lineTo(f3.x, f3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Yellow price-tag rail strip along the bottom of the front face
  const pr0 = project(s.x, s.y + s.h, 0);
  const pr1 = project(s.x + s.w, s.y + s.h, 0);
  const pr2 = project(s.x + s.w, s.y + s.h, 18);
  const pr3 = project(s.x, s.y + s.h, 18);
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.moveTo(pr0.x, pr0.y); ctx.lineTo(pr1.x, pr1.y); ctx.lineTo(pr2.x, pr2.y); ctx.lineTo(pr3.x, pr3.y);
  ctx.closePath(); ctx.fill();

  // Top face
  const t0 = project(s.x, s.y, SHELF_H);
  const t1 = project(s.x + s.w, s.y, SHELF_H);
  const t2 = project(s.x + s.w, s.y + s.h, SHELF_H);
  const t3 = project(s.x, s.y + s.h, SHELF_H);
  const topGrad = ctx.createLinearGradient(t0.x, t0.y, t2.x, t2.y);
  topGrad.addColorStop(0, '#94a3b8');
  topGrad.addColorStop(1, '#cbd5e1');
  ctx.fillStyle = topGrad;
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Price rail text (screen-space billboard). Font tracks the iso scale so it
  // shrinks on small viewports; if it still overflows the shelf's front edge,
  // shrink it further to fit inside the rail.
  const railFont = Math.max(6, Math.min(11, iso.halfW * 27));
  const railText = '🏷️ LIDL & KAUFLAND SPECIAL';
  const railMaxW = Math.hypot(pr1.x - pr0.x, pr1.y - pr0.y) * 0.92;
  ctx.font = `${railFont}px monospace`;
  const railW = ctx.measureText(railText).width;
  if (railW > railMaxW) ctx.font = `${Math.max(5, railFont * railMaxW / railW)}px monospace`;
  ctx.fillStyle = '#1e293b';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const railMid = project(s.x + s.w / 2, s.y + s.h, 9);
  ctx.fillText(railText, railMid.x, railMid.y);

  // Products standing on the top surface, spread along the shelf's length
  s.items.forEach((itemId, idx) => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const frac = (idx + 0.5) / s.items.length;
    const iy = s.y + 30 + frac * (s.h - 60);
    const ix = s.x + (idx % 2 === 0 ? s.w * 0.34 : s.w * 0.66);

    const shadowP = project(ix, iy, SHELF_H);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(shadowP.x, shadowP.y + 3, 9 * spriteScale, 4 * spriteScale, 0, 0, Math.PI * 2);
    ctx.fill();

    const iconP = project(ix, iy, SHELF_H + 18);
    ctx.font = `${Math.max(10, Math.round(18 * spriteScale))}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(prod.icon, iconP.x, iconP.y);
  });

  // Overhead aisle category sign, floating above the shelf's center as a
  // hanging pill. Font tracks the iso scale (so it shrinks on small viewports),
  // the pill is sized from the font, and the two rows' signs are staggered in
  // height (left row higher, right row lower) so they never collide when the
  // store is squeezed onto a narrow portrait screen.
  const signFont = Math.max(7, Math.min(15, iso.halfW * 34));
  const signZ = SHELF_H + (s.x < WORLD_W / 2 ? 66 : 40);
  const signAnchor = project(s.x + s.w / 2, s.y + s.h / 2, signZ);
  ctx.font = `bold ${signFont}px -apple-system, sans-serif`;
  const tw = ctx.measureText(s.name).width;
  const signPadX = signFont * 0.7;
  const signH = signFont * 1.7;
  ctx.fillStyle = 'rgba(2, 132, 199, 0.92)';
  ctx.beginPath();
  ctx.roundRect(signAnchor.x - tw / 2 - signPadX, signAnchor.y - signH / 2, tw + signPadX * 2, signH, 6);
  ctx.fill();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s.name, signAnchor.x, signAnchor.y);

  // Proximity highlight outline around the top face
  if (isNear) {
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
    ctx.closePath(); ctx.stroke();
  }
}

// Checkout POS drawn as a compact 3D box with a scanner light and label.
function drawIsoCheckout(cz) {
  const spriteScale = iso.halfW / 20;

  const shOff = 10;
  const sh0 = project(cz.x + shOff, cz.y + shOff, 0);
  const sh1 = project(cz.x + cz.w + shOff, cz.y + shOff, 0);
  const sh2 = project(cz.x + cz.w + shOff, cz.y + cz.h + shOff, 0);
  const sh3 = project(cz.x + shOff, cz.y + cz.h + shOff, 0);
  ctx.fillStyle = 'rgba(8, 15, 30, 0.3)';
  ctx.beginPath();
  ctx.moveTo(sh0.x, sh0.y); ctx.lineTo(sh1.x, sh1.y); ctx.lineTo(sh2.x, sh2.y); ctx.lineTo(sh3.x, sh3.y);
  ctx.closePath(); ctx.fill();

  const r0 = project(cz.x + cz.w, cz.y, 0);
  const r1 = project(cz.x + cz.w, cz.y + cz.h, 0);
  const r2 = project(cz.x + cz.w, cz.y + cz.h, CHECKOUT_H);
  const r3 = project(cz.x + cz.w, cz.y, CHECKOUT_H);
  ctx.fillStyle = '#0f2418';
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(r0.x, r0.y); ctx.lineTo(r1.x, r1.y); ctx.lineTo(r2.x, r2.y); ctx.lineTo(r3.x, r3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  const f0 = project(cz.x, cz.y + cz.h, 0);
  const f1 = project(cz.x + cz.w, cz.y + cz.h, 0);
  const f2 = project(cz.x + cz.w, cz.y + cz.h, CHECKOUT_H);
  const f3 = project(cz.x, cz.y + cz.h, CHECKOUT_H);
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.moveTo(f0.x, f0.y); ctx.lineTo(f1.x, f1.y); ctx.lineTo(f2.x, f2.y); ctx.lineTo(f3.x, f3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  const t0 = project(cz.x, cz.y, CHECKOUT_H);
  const t1 = project(cz.x + cz.w, cz.y, CHECKOUT_H);
  const t2 = project(cz.x + cz.w, cz.y + cz.h, CHECKOUT_H);
  const t3 = project(cz.x, cz.y + cz.h, CHECKOUT_H);
  ctx.fillStyle = '#134e2f';
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(t0.x, t0.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.lineTo(t3.x, t3.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Scanner laser light glowing on the conveyor top
  const laserA = project(cz.x + cz.w * 0.15, cz.y + cz.h * 0.5, CHECKOUT_H + 1);
  const laserB = project(cz.x + cz.w * 0.85, cz.y + cz.h * 0.5, CHECKOUT_H + 1);
  ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
  ctx.lineWidth = Math.max(2, 4 * spriteScale);
  ctx.beginPath(); ctx.moveTo(laserA.x, laserA.y); ctx.lineTo(laserB.x, laserB.y); ctx.stroke();

  // Label sign — same iso-scaled hanging pill as the aisle signs.
  const labelFont = Math.max(7, Math.min(15, iso.halfW * 34));
  const labelAnchor = project(cz.x + cz.w / 2, cz.y + cz.h / 2, CHECKOUT_H + 40);
  ctx.font = `bold ${labelFont}px -apple-system, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = '💳 POS CHECKOUT';
  const tw = ctx.measureText(label).width;
  const labelPadX = labelFont * 0.7;
  const labelH = labelFont * 1.7;
  ctx.fillStyle = 'rgba(34, 197, 94, 0.92)';
  ctx.beginPath();
  ctx.roundRect(labelAnchor.x - tw / 2 - labelPadX, labelAnchor.y - labelH / 2, tw + labelPadX * 2, labelH, 6);
  ctx.fill();
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, labelAnchor.x, labelAnchor.y);
}

// Player (shopper + cart) drawn as a small isometric billboard sprite standing
// on its projected ground point, with a soft shadow ellipse and a left/right
// flip based on the last horizontal movement direction.
function drawIsoPlayer() {
  const spriteScale = iso.halfW * 2.4;
  const base = project(player.x, player.y, 0);

  // Ground shadow under grandfather & cart
  ctx.fillStyle = 'rgba(8, 15, 30, 0.4)';
  ctx.beginPath();
  ctx.ellipse(base.x, base.y + 4, 26 * spriteScale, 12 * spriteScale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(base.x, base.y - 28 * spriteScale);
  ctx.scale(spriteScale * (player.facing || 1), spriteScale);

  // -------------------------------------------------------------
  // 1. SWIVEL WHEELS & CHROME FRAME OF LARGE SHOPPING CART
  // -------------------------------------------------------------
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(-22, -44, 7, 7);
  ctx.fillRect(15, -44, 7, 7);
  ctx.fillRect(-22, -12, 7, 7);
  ctx.fillRect(15, -12, 7, 7);

  // Chrome Wire Mesh Cart Basket (Larger 46x30px)
  const cartGrad = ctx.createLinearGradient(-23, -42, 23, -12);
  cartGrad.addColorStop(0, '#cbd5e1');
  cartGrad.addColorStop(0.4, '#ffffff');
  cartGrad.addColorStop(1, '#94a3b8');
  ctx.fillStyle = cartGrad;
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.roundRect(-23, -42, 46, 30, 5);
  ctx.fill(); ctx.stroke();

  // Cart Wire Mesh Grid Lines
  ctx.strokeStyle = 'rgba(71, 85, 105, 0.45)';
  ctx.lineWidth = 1;
  for (let gx = -16; gx <= 16; gx += 8) {
    ctx.beginPath(); ctx.moveTo(gx, -42); ctx.lineTo(gx, -12); ctx.stroke();
  }
  for (let gy = -36; gy <= -16; gy += 7) {
    ctx.beginPath(); ctx.moveTo(-23, gy); ctx.lineTo(23, gy); ctx.stroke();
  }

  // Red Plastic Cart Handle Bar
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.roundRect(-20, -7, 40, 6, 3);
  ctx.fill();

  // -------------------------------------------------------------
  // 2. VISIBLE STACKED PRODUCTS INSIDE THE CART BASKET
  // -------------------------------------------------------------
  player.cart.forEach((itemId, idx) => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (prod) {
      const itemX = -14 + (idx % 4) * 9.5;
      const itemY = -34 + Math.floor(idx / 4) * 10;

      // Drop shadow behind product in cart
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.beginPath(); ctx.ellipse(itemX, itemY + 5, 6, 3, 0, 0, Math.PI * 2); ctx.fill();

      // Product Icon
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(prod.icon, itemX, itemY);
    }
  });

  // -------------------------------------------------------------
  // 3. GRANDFATHER CHARACTER ("Bunic cu părul alb")
  // -------------------------------------------------------------
  // Walking Legs under sweater
  ctx.fillStyle = '#334155'; // Dark blue denim pants
  ctx.fillRect(-10, 22, 7, 14);
  ctx.fillRect(3, 22, 7, 14);
  // Brown Shoes
  ctx.fillStyle = '#78350f';
  ctx.fillRect(-12, 34, 9, 5);
  ctx.fillRect(3, 34, 9, 5);

  // Arms extending to hold the handlebar
  ctx.strokeStyle = '#0284c7'; // Blue cardigan sleeve
  ctx.lineWidth = 6.5;
  ctx.lineCap = 'round';

  ctx.beginPath(); ctx.moveTo(-12, 12); ctx.lineTo(-15, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, 12); ctx.lineTo(15, -4); ctx.stroke();

  // Hands on Handlebar
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath(); ctx.arc(-15, -4, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, -4, 4, 0, Math.PI * 2); ctx.fill();

  // Torso / Knit Cardigan Sweater
  ctx.fillStyle = '#0284c7'; // Cozy blue cardigan
  ctx.beginPath();
  ctx.ellipse(0, 15, 20, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#0369a1'; ctx.lineWidth = 1.5; ctx.stroke();

  // White Shirt Collar
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-5, 6); ctx.lineTo(0, 12); ctx.lineTo(5, 6); ctx.closePath();
  ctx.fill();

  // GRANDFATHER HEAD & WHITE HAIR / BEARD
  // Head shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 16, 12, 12, 0, 0, Math.PI * 2); ctx.fill();

  // Skin Tone Face & Ears
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath(); ctx.arc(0, 12, 11, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 12, 3, 0, Math.PI * 2); ctx.fill(); // Left ear
  ctx.beginPath(); ctx.arc(11, 12, 3, 0, Math.PI * 2); ctx.fill();  // Right ear

  // White Hair (Fluffy top & sides)
  ctx.fillStyle = '#f8fafc'; // Pure white hair
  ctx.beginPath(); ctx.arc(0, 7, 12, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
  ctx.beginPath(); ctx.arc(-9, 10, 5, 0, Math.PI * 2); ctx.fill(); // Left hair tuft
  ctx.beginPath(); ctx.arc(9, 10, 5, 0, Math.PI * 2); ctx.fill();  // Right hair tuft

  // White Beard & Mustache
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(0, 17, 7, 0, Math.PI); ctx.fill(); // Beard
  ctx.beginPath(); ctx.roundRect(-7, 14, 14, 4, 2); ctx.fill(); // Mustache

  // Glasses 👓 (Grandpa Reading Eyeglasses)
  ctx.strokeStyle = '#d97706'; // Gold frame
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-4, 11, 3.5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(4, 11, 3.5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-0.5, 11); ctx.lineTo(0.5, 11); ctx.stroke(); // Bridge

  ctx.restore();
}

function renderSupermarket() {
  const lvl = LEVELS[currentLevelIdx];
  computeIso();

  // Dark backdrop behind the whole iso scene (canvas outside the floor diamond)
  ctx.fillStyle = '#0b1426';
  ctx.fillRect(0, 50, W, H - 50);

  drawIsoFloor();

  // Depth-sort shelves + checkout + player (painter's algorithm) so nearer
  // entities correctly overlap farther ones in the projected view.
  const nearShelf = getNearbyShelf();
  const entities = [];
  shelves.forEach(s => entities.push({ type: 'shelf', data: s, depth: (s.x + s.w) + (s.y + s.h) }));
  entities.push({ type: 'checkout', data: checkoutZone, depth: (checkoutZone.x + checkoutZone.w) + (checkoutZone.y + checkoutZone.h) });
  entities.push({ type: 'player', data: player, depth: player.x + player.y });
  entities.sort((a, b) => a.depth - b.depth);

  entities.forEach(e => {
    if (e.type === 'shelf') drawIsoShelf(e.data, e.data === nearShelf);
    else if (e.type === 'checkout') drawIsoCheckout(e.data);
    else drawIsoPlayer();
  });

  // Proximity hint text floats above the player's head
  if (nearShelf) {
    const headPt = project(player.x, player.y, 60);
    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('grabHint'), headPt.x, headPt.y - 12);
  }

  // Resource HUD Bar (Y = 50..92)
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 50, W, 42);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.strokeRect(0, 50, W, 42);

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const cartCount = player.cart.length;
  const reqCount = lvl.targetItems.length;
  const timeText = levelTimer > 0 ? `  ·  ⏱ ${Math.ceil(levelTimer)}s` : '';

  ctx.fillText(`🛒 LEVEL ${currentLevelIdx + 1}: ${lvl.name}  ·  📋 CART: ${cartCount}/${reqCount}${timeText}  ·  ⭐ SCORE: ${score}`, W / 2 + 100, 71);
}

function drawMenuBtn(x, y, w, h, text, onClick) {
  ctx.save();
  ctx.fillStyle = '#22c55e';
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 12);
  ctx.fill(); ctx.stroke();

  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
  ctx.restore();

  if (menuClick && stateCooldown <= 0) {
    if (menuClick.x >= x - w/2 && menuClick.x <= x + w/2 && menuClick.y >= y - h/2 && menuClick.y <= y + h/2) {
      playSfx('pop');
      menuClick = null;
      stateCooldown = 0.35;
      onClick();
    }
  }
}

function drawModalCard(title, sub, buttons) {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);

  const cardW = Math.min(W * 0.9, 420);
  const cardH = 260;
  const cardX = (W - cardW) / 2;
  const cardY = (H - cardH) / 2;

  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.roundRect(cardX, cardY, cardW, cardH, 20);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, cardY + 45);

  ctx.fillStyle = '#cbd5e1';
  ctx.font = '14px sans-serif';
  ctx.fillText(sub, W / 2, cardY + 85);

  buttons.forEach((btn, idx) => {
    drawMenuBtn(W / 2, cardY + 140 + idx * 52, 240, 44, btn.label, btn.action);
  });

  ctx.restore();
}

// ============ SHELF INSPECTION MODAL ============
function openShelfModal(shelf) {
  activeShelf = shelf;
  document.getElementById('shelfTitle').innerText = shelf.name;
  
  const container = document.getElementById('shelfItemsGrid');
  let html = '';

  shelf.items.forEach(itemId => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const inCartCount = player.cart.filter(id => id === itemId).length;
    const nameStr = LANG === 'ro' ? prod.nameRo : prod.name;

    html += `
      <div class="item-card">
        <div class="item-icon">${prod.icon}</div>
        <div class="item-name">${nameStr}</div>
        <div class="item-price">${prod.price}</div>
        <button class="item-action-btn" onclick="toggleCartItem('${prod.id}')">
          ${t('putInCart')}
        </button>
        ${inCartCount > 0 ? `
          <button class="item-action-btn put-back" onclick="removeCartItem('${prod.id}')">
            ${t('putBack')} (${inCartCount})
          </button>
        ` : ''}
      </div>
    `;
  });

  container.innerHTML = html;
  document.getElementById('shelfModal').style.display = 'flex';
  setGameState('SHELF_VIEW');
}

window.toggleCartItem = function(itemId) {
  const lvl = LEVELS[currentLevelIdx];
  const isRequired = lvl.targetItems.includes(itemId);

  if (isRequired) {
    player.cart.push(itemId);
    score += 150;
    playSfx('pop');
    showFeedback(t('itemAdded'));
  } else {
    playSfx('wrong');
    score = Math.max(0, score - 50);
    showFeedback(t('notOnList'), true);
  }

  updatePaperShoppingListUI();
  if (activeShelf) openShelfModal(activeShelf);
};

window.removeCartItem = function(itemId) {
  const idx = player.cart.indexOf(itemId);
  if (idx !== -1) {
    player.cart.splice(idx, 1);
    playSfx('pop');
    updatePaperShoppingListUI();
    if (activeShelf) openShelfModal(activeShelf);
  }
};

document.getElementById('shelfCloseBtn').addEventListener('click', () => {
  document.getElementById('shelfModal').style.display = 'none';
  setGameState('PLAY');
});

// ============ LEADERBOARD ENGINE ============
function loadLeaderboard() {
  try {
    const saved = localStorage.getItem('supermarketLeaderboard');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return [];
}

function saveLeaderboard(board) {
  try {
    localStorage.setItem('supermarketLeaderboard', JSON.stringify(board));
  } catch (e) {}
}

function openLeaderboardModal() {
  const board = loadLeaderboard();
  const listEl = document.getElementById('lbList');
  document.getElementById('lbTitle').innerText = t('topScores');

  if (!board.length) {
    listEl.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">${t('noScoresYet')}</div>`;
  } else {
    let html = '';
    board.slice(0, 10).forEach((entry, idx) => {
      const rankBadge = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
      html += `
        <div class="lb-row">
          <span class="lb-rank">${rankBadge}</span>
          <span class="lb-name">${entry.name}</span>
          <span class="lb-score">${entry.score}</span>
        </div>
      `;
    });
    listEl.innerHTML = html;
  }
  document.getElementById('leaderboardModal').style.display = 'flex';
}

document.getElementById('lbCloseBtn').addEventListener('click', () => {
  document.getElementById('leaderboardModal').style.display = 'none';
});

function openNamePromptModal() {
  document.getElementById('namePromptModal').style.display = 'flex';
}

document.getElementById('saveScoreBtn').addEventListener('click', () => {
  const name = (document.getElementById('p1NameInput').value.trim() || 'Lilo').slice(0, 12);
  const board = loadLeaderboard();
  board.push({ name, score });
  board.sort((a, b) => b.score - a.score);
  saveLeaderboard(board.slice(0, 10));

  document.getElementById('namePromptModal').style.display = 'none';
  openLeaderboardModal();
});

// ============ MAIN GAME LOOP ============
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (pendingState !== null) {
    gameState = pendingState;
    pendingState = null;
  }

  if (stateCooldown > 0) stateCooldown -= dt;
  if (feedbackTimer > 0) feedbackTimer -= dt;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

</script>

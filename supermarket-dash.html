<style>

  html, body {

  canvas { display: block; width: 100%; height: 100%; }

  /* Top Control Header Bar */

    position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 25;
    background: rgba(9, 18, 34, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.15);

  #homeLink {
    color: #fff; text-decoration: none; font-weight: 800; font-size: 14px;
    background: rgba(255, 255, 255, 0.12); padding: 7px 14px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2); transition: transform 0.1s ease;
  }
  #homeLink:active { transform: scale(0.95); }

  .langToggle {
    display: flex; background: rgba(0, 0, 0, 0.5); border-radius: 999px; padding: 3px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .langToggle button {
    border: none; background: transparent; color: #a9c7eb; font-weight: 800; font-size: 13px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: background 0.15s ease;
  }
  .langToggle button.active { background: #2ecc71; color: #fff; }

  /* Persistent Real Paper Shopping List Notepad (Top Left Overlay) */
  #paperShoppingList {
    position: fixed; top: 102px; left: 14px; z-index: 20;
    width: 210px; max-height: calc(100vh - 180px); overflow-y: auto;
    background: #fff9e6; color: #1e293b;
    border: 2px solid #d4a359; border-radius: 12px; padding: 12px 14px;

    font-size: 14px; font-weight: 900; color: #9a3412; text-transform: uppercase;

    font-size: 13px; font-weight: 700; color: #334155;

  .dpad-row { display: flex; gap: 10px; }
  #touchAction { right: 16px; flex-direction: column; align-items: flex-end; }
  .tbtn {

    color: #fff; font-size: 22px; font-weight: 900;

// ============ WEBAUDIO SOUND ENGINE ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSfx(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'beep') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1760, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        const startTime = now + idx * 0.09;
        g.gain.setValueAtTime(0.12, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
        o.start(startTime); o.stop(startTime + 0.25);
      });
    }
  } catch (e) {}
}

const canvas = document.getElementById('game');

let W = 0, H = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

  document.getElementById('paperShoppingList').style.display = 'flex';
}

function updatePaperShoppingListUI() {
  const lvl = LEVELS[currentLevelIdx];
  const container = document.getElementById('paperItems');
  const progressEl = document.getElementById('paperProgress');

  if (!lvl || !container) return;

  let collectedCount = 0;
  let html = '';

  lvl.targetItems.forEach(itemId => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const isCollected = player.cart.includes(itemId);
    if (isCollected) collectedCount++;

    const nameStr = LANG === 'ro' ? prod.nameRo : prod.name;
    html += `
      <div class="paper-item ${isCollected ? 'checked' : ''}">
        <span><span class="check-box">${isCollected ? '☑' : '☐'}</span> ${prod.icon} ${nameStr}</span>
      </div>
    `;
  });

  container.innerHTML = html;
  progressEl.innerText = `${collectedCount}/${lvl.targetItems.length}`;
}

function showFeedback(msg, isWarning = false) {
  feedbackMsg = msg;
  feedbackTimer = 2.2;
}

function setGameState(newState) {
  pendingState = newState;
  stateCooldown = 0.35;
  if (newState !== 'PLAY') {
    document.getElementById('paperShoppingList').style.display = 'none';
  } else {
    document.getElementById('paperShoppingList').style.display = 'flex';
  }
}

// ============ GAME LOGIC & CONTROLS ============
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (gameState === 'PLAY') setGameState('PAUSED');
    else if (gameState === 'PAUSED') setGameState('PLAY');
  } else if (e.code === 'Space') {
    if (gameState === 'PLAY') interactWithNearestShelf();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch Control Binds
function bindTouchBtn(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = e => { e.preventDefault(); initAudio(); keys[keyName] = true; };
  const off = e => { e.preventDefault(); keys[keyName] = false; };
  el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
}
bindTouchBtn('btnUp', 'ArrowUp');
bindTouchBtn('btnDown', 'ArrowDown');
bindTouchBtn('btnLeft', 'ArrowLeft');
bindTouchBtn('btnRight', 'ArrowRight');

document.getElementById('btnGrab').addEventListener('click', () => interactWithNearestShelf());

function interactWithNearestShelf() {
  const nearShelf = getNearbyShelf();
  if (nearShelf) {
    openShelfModal(nearShelf);
  }
}

function getNearbyShelf() {
  for (const s of shelves) {
    const cx = s.x + s.w / 2;
    const cy = s.y + s.h / 2;
    const dist = Math.hypot(player.x - cx, player.y - cy);
    if (dist < 90) return s;
  }
  return null;
}

function update(dt) {
  if (gameState !== 'PLAY') return;

  // Timer countdown
  if (levelTimer > 0) {
    levelTimer -= dt;
    if (levelTimer <= 0) {
      setGameState('GAME_OVER');
      return;
    }
  }

  // Player Movement & Physics
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

  if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

  const nextX = player.x + dx * player.speed * dt;
  const nextY = player.y + dy * player.speed * dt;

  // Bounds & Shelf Collision Detection
  const minX = 40, maxX = W - 40, minY = 100, maxY = H - 60;
  if (nextX >= minX && nextX <= maxX) player.x = nextX;
  if (nextY >= minY && nextY <= maxY) player.y = nextY;

  // Checkout Register Area Check
  if (player.x >= checkoutZone.x && player.x <= checkoutZone.x + checkoutZone.w &&
      player.y >= checkoutZone.y && player.y <= checkoutZone.y + checkoutZone.h) {
    checkOutCart();
  }
}

function checkOutCart() {
  const lvl = LEVELS[currentLevelIdx];
  const req = lvl.targetItems.slice().sort();
  const got = player.cart.slice().sort();

  // Check if all list items are matched
  const isMatch = req.length === got.length && req.every((val, idx) => val === got[idx]);

  if (isMatch) {
    playSfx('beep');
    playSfx('fanfare');
    score += 500 + (levelTimer > 0 ? Math.floor(levelTimer * 10) : 0);

    if (currentLevelIdx + 1 < LEVELS.length) {
      setGameState('LEVEL_CLEAR');
    } else {
      setGameState('VICTORY');
    }
  } else {
    showFeedback('⚠️ SCAN INCOMPLETE: COLLECT ALL LIST ITEMS FIRST!', true);
  }
}

// ============ RENDER ENGINE ============
let menuClick = null;
canvas.addEventListener('click', e => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  menuClick = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});

function render() {
  ctx.clearRect(0, 0, W, H);
  updateTouchVisibility();

  if (gameState === 'TITLE') {
    renderTitle();
  } else if (gameState === 'PLAY' || gameState === 'PAUSED' || gameState === 'LEVEL_CLEAR' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
    renderSupermarket();

    if (gameState === 'PAUSED') {
      drawModalCard(t('paused'), t('pausedHint'), [
        { label: t('resume'), action: () => setGameState('PLAY') },
        { label: t('restart'), action: () => initSupermarketLevel(currentLevelIdx) },
        { label: t('menu'), action: () => setGameState('TITLE') }
      ]);
    } else if (gameState === 'LEVEL_CLEAR') {
      drawModalCard(t('levelClear'), `Score: ${score}`, [
        { label: t('nextLevel'), action: () => {
          currentLevelIdx++;
          initSupermarketLevel(currentLevelIdx);
          setGameState('PLAY');
        }}
      ]);
    } else if (gameState === 'GAME_OVER') {
      drawModalCard(t('gameOver'), 'Item list incomplete!', [
        { label: t('tryAgain'), action: () => {
          initSupermarketLevel(currentLevelIdx);
          setGameState('PLAY');
        }}
      ]);
    } else if (gameState === 'VICTORY') {
      drawModalCard(t('victory'), `Final Score: ${score}`, [
        { label: 'SAVE SCORE 🏆', action: () => openNamePromptModal() }
      ]);
    }
  }

  // Feedback Notification Floater
  if (feedbackTimer > 0 && feedbackMsg) {
    ctx.save();
    ctx.font = 'bold 15px -apple-system, sans-serif';
    const mw = ctx.measureText(feedbackMsg).width;
    ctx.fillStyle = feedbackMsg.includes('⚠️') ? 'rgba(239, 68, 68, 0.95)' : 'rgba(34, 197, 94, 0.95)';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(W / 2 - mw / 2 - 16, 104, mw + 32, 34, 17);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(feedbackMsg, W / 2, 121);
    ctx.restore();
  }
}

function renderTitle() {
  ctx.fillStyle = '#091222';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 36px -apple-system, sans-serif';
  ctx.fillText(t('title'), W / 2, 110);

  ctx.fillStyle = '#a9c7eb';
  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.fillText(t('sub'), W / 2, 150);

  drawMenuBtn(W / 2, 230, 260, 52, t('start'), () => {
    currentLevelIdx = 0;
    score = 0;
    initSupermarketLevel(0);
    setGameState('PLAY');
  });

  drawMenuBtn(W / 2, 300, 260, 48, t('topScores'), () => {
    openLeaderboardModal();
  });

  ctx.restore();
}

function renderSupermarket() {
  const lvl = LEVELS[currentLevelIdx];

  // Polished Marble Hypermarket Floor Tiles
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(0, 50, W, H - 50);

  // Tile Grid Lines
  ctx.strokeStyle = 'rgba(203, 213, 225, 0.6)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 50; y < H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Draw Aisle Category Banners & Realistic Multi-Tier Shelves
  shelves.forEach(s => {
    // Shelf Base & Shadow
    ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
    ctx.fillRect(s.x + 6, s.y + 6, s.w, s.h);

    // Shelf Wooden/Metallic Frame
    ctx.fillStyle = '#334155';
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(s.x, s.y, s.w, s.h, 8);
    ctx.fill(); ctx.stroke();

    // Category Header Sign
    ctx.fillStyle = '#0284c7';
    ctx.fillRect(s.x, s.y, s.w, 18);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.name, s.x + s.w / 2, s.y + 9);

    // Products sitting on shelf tier
    s.items.forEach((itemId, idx) => {
      const prod = PRODUCTS.find(p => p.id === itemId);
      if (prod) {
        ctx.font = '18px sans-serif';
        ctx.fillText(prod.icon, s.x + 22 + idx * 36, s.y + 36);
      }
    });
  });

  // Highlight Nearby Proximity Shelf
  const nearShelf = getNearbyShelf();
  if (nearShelf) {
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 3;
    ctx.strokeRect(nearShelf.x - 4, nearShelf.y - 4, nearShelf.w + 8, nearShelf.h + 8);

    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t('grabHint'), player.x, player.y - 34);
  }

  // Draw Checkout POS Conveyor Belt & Rubber Texture
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(checkoutZone.x, checkoutZone.y, checkoutZone.w, checkoutZone.h);
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 3;
  ctx.strokeRect(checkoutZone.x, checkoutZone.y, checkoutZone.w, checkoutZone.h);

  // Scanner Laser Light
  ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
  ctx.fillRect(checkoutZone.x + 10, checkoutZone.y + 10, checkoutZone.w - 20, 8);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('💳 POS CHECKOUT', checkoutZone.x + checkoutZone.w / 2, checkoutZone.y + checkoutZone.h / 2 + 6);

  // Draw Player Character & Metallic Grid Shopping Cart (Top-Down View)
  ctx.save();
  ctx.translate(player.x, player.y);

  // Cart Mesh Grid
  ctx.fillStyle = '#94a3b8';
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  ctx.fillRect(-16, -30, 32, 22);
  ctx.strokeRect(-16, -30, 32, 22);

  // Collected Items inside cart grid
  player.cart.slice(0, 4).forEach((itemId, idx) => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (prod) {
      ctx.font = '12px sans-serif';
      ctx.fillText(prod.icon, -10 + (idx % 2) * 14, -22 + Math.floor(idx / 2) * 10);
    }
  });

  // Player Body Circle
  ctx.fillStyle = '#0284c7';
  ctx.beginPath();
  ctx.arc(0, 0, player.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();

  // Resource HUD Bar (Y = 50..92)
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 50, W, 42);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.strokeRect(0, 50, W, 42);

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const cartCount = player.cart.length;
  const reqCount = lvl.targetItems.length;
  const timeText = levelTimer > 0 ? `  ·  ⏱ ${Math.ceil(levelTimer)}s` : '';

  ctx.fillText(`🛒 LEVEL ${currentLevelIdx + 1}: ${lvl.name}  ·  📋 CART: ${cartCount}/${reqCount}${timeText}  ·  ⭐ SCORE: ${score}`, W / 2 + 100, 71);
}

function drawMenuBtn(x, y, w, h, text, onClick) {
  ctx.save();
  ctx.fillStyle = '#22c55e';
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 12);
  ctx.fill(); ctx.stroke();

  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
  ctx.restore();

  if (menuClick && stateCooldown <= 0) {
    if (menuClick.x >= x - w/2 && menuClick.x <= x + w/2 && menuClick.y >= y - h/2 && menuClick.y <= y + h/2) {
      playSfx('pop');
      menuClick = null;
      stateCooldown = 0.35;
      onClick();
    }
  }
}

function drawModalCard(title, sub, buttons) {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);

  const cardW = Math.min(W * 0.9, 420);
  const cardH = 260;
  const cardX = (W - cardW) / 2;
  const cardY = (H - cardH) / 2;

  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.roundRect(cardX, cardY, cardW, cardH, 20);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, cardY + 45);

  ctx.fillStyle = '#cbd5e1';
  ctx.font = '14px sans-serif';
  ctx.fillText(sub, W / 2, cardY + 85);

  buttons.forEach((btn, idx) => {
    drawMenuBtn(W / 2, cardY + 140 + idx * 52, 240, 44, btn.label, btn.action);
  });

  ctx.restore();
}

// ============ SHELF INSPECTION MODAL ============
function openShelfModal(shelf) {
  activeShelf = shelf;
  document.getElementById('shelfTitle').innerText = shelf.name;
  
  const container = document.getElementById('shelfItemsGrid');
  let html = '';

  shelf.items.forEach(itemId => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const inCartCount = player.cart.filter(id => id === itemId).length;
    const nameStr = LANG === 'ro' ? prod.nameRo : prod.name;

    html += `
      <div class="item-card">
        <div class="item-icon">${prod.icon}</div>
        <div class="item-name">${nameStr}</div>
        <div class="item-price">${prod.price}</div>
        <button class="item-action-btn" onclick="toggleCartItem('${prod.id}')">
          ${t('putInCart')}
        </button>
        ${inCartCount > 0 ? `
          <button class="item-action-btn put-back" onclick="removeCartItem('${prod.id}')">
            ${t('putBack')} (${inCartCount})
          </button>
        ` : ''}
      </div>
    `;
  });

  container.innerHTML = html;
  document.getElementById('shelfModal').style.display = 'flex';
  setGameState('SHELF_VIEW');
}

window.toggleCartItem = function(itemId) {
  const lvl = LEVELS[currentLevelIdx];
  const isRequired = lvl.targetItems.includes(itemId);

  if (isRequired) {
    player.cart.push(itemId);
    score += 150;
    playSfx('pop');
    showFeedback(t('itemAdded'));
  } else {
    playSfx('wrong');
    score = Math.max(0, score - 50);
    showFeedback(t('notOnList'), true);
  }

  updatePaperShoppingListUI();
  if (activeShelf) openShelfModal(activeShelf);
};

window.removeCartItem = function(itemId) {
  const idx = player.cart.indexOf(itemId);
  if (idx !== -1) {
    player.cart.splice(idx, 1);
    playSfx('pop');
    updatePaperShoppingListUI();
    if (activeShelf) openShelfModal(activeShelf);
  }
};

document.getElementById('shelfCloseBtn').addEventListener('click', () => {
  document.getElementById('shelfModal').style.display = 'none';
  setGameState('PLAY');
});

// ============ LEADERBOARD ENGINE ============
function loadLeaderboard() {
  try {
    const saved = localStorage.getItem('supermarketLeaderboard');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return [];
}

function saveLeaderboard(board) {
  try {
    localStorage.setItem('supermarketLeaderboard', JSON.stringify(board));
  } catch (e) {}
}

function openLeaderboardModal() {
  const board = loadLeaderboard();
  const listEl = document.getElementById('lbList');
  document.getElementById('lbTitle').innerText = t('topScores');

  if (!board.length) {
    listEl.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">${t('noScoresYet')}</div>`;
  } else {
    let html = '';
    board.slice(0, 10).forEach((entry, idx) => {
      const rankBadge = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
      html += `
        <div class="lb-row">
          <span class="lb-rank">${rankBadge}</span>
          <span class="lb-name">${entry.name}</span>
          <span class="lb-score">${entry.score}</span>
        </div>
      `;
    });
    listEl.innerHTML = html;
  }
  document.getElementById('leaderboardModal').style.display = 'flex';
}

document.getElementById('lbCloseBtn').addEventListener('click', () => {
  document.getElementById('leaderboardModal').style.display = 'none';
});

function openNamePromptModal() {
  document.getElementById('namePromptModal').style.display = 'flex';
}

document.getElementById('saveScoreBtn').addEventListener('click', () => {
  const name = (document.getElementById('p1NameInput').value.trim() || 'Lilo').slice(0, 12);
  const board = loadLeaderboard();
  board.push({ name, score });
  board.sort((a, b) => b.score - a.score);
  saveLeaderboard(board.slice(0, 10));

  document.getElementById('namePromptModal').style.display = 'none';
  openLeaderboardModal();
});

// ============ MAIN GAME LOOP ============
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (pendingState !== null) {
    gameState = pendingState;
    pendingState = null;
  }

  if (stateCooldown > 0) stateCooldown -= dt;
  if (feedbackTimer > 0) feedbackTimer -= dt;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

</script>

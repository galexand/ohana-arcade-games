let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!audioCtx) return;
  type = type || 'square'; vol = vol || 0.07; slide = slide || 0;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

// ============ PROJECTION (behind-the-ball 3D platformer) ============
// A minimal pseudo-3D pinhole camera: the camera sits behind and above the
// ball, always looking straight down the +Z axis (no yaw/roll), so every
// world point (wx, wy, wz) is projected via its offset from the camera.
const FOCAL = 340;
const HORIZON_FRAC = 0.34;

function project(ox, oy, d) {
  const scale = FOCAL / Math.max(1, d);
  return {
    x: W / 2 + ox * scale,
    y: H * HORIZON_FRAC + oy * scale,
    scale,
  };
}
// projWorld: project a world-space point relative to the current camera.
function projWorld(wx, wy, wz) {
  const d = wz - camera.z;
  const ox = wx - camera.x;
  const oy = camera.y - wy; // camera is above the ground, so ground offsets are positive (down-screen)
  return project(ox, oy, d);
}

// ============ PHYSICS TUNING ============
const BALL_R = 20;
const GRAVITY = 0.85;
const JUMP_VY = 17.5; // slightly boosted so the biggest ordinary gaps stay clearable at full speed
const MAX_SPEED = 6.0;
const MOVE_EASE = 0.18;
const COYOTE_FRAMES = 10;
const JUMP_BUFFER_FRAMES = 10;
const LAND_TOL = 6;
const FOOT_TOL = 24; // forgiving footprint margin so near-edge landings still count
const CAM_BACK = 190;   // camera trails this far behind the ball in Z
const CAM_HEIGHT = 150; // camera eye sits this far above the ball
const CAM_EASE_XZ = 0.14;
const CAM_EASE_Y = 0.08;
// ramps / launch pads / tumbling
const SLOPE_ACCEL = 0.4;       // forward speed gained per frame per unit of downhill slope
const SLOPE_SIDE_ACCEL = 0.22; // gentle sideways drift on banked platforms
const BOOST_DECAY = 0.965;     // per-frame decay of a launch-pad's extra kick
const TUMBLE_BASE = 0.16;      // rad/frame somersault rate for a normal jump
const TUMBLE_PER_EXTRA_VY = 0.016; // extra rad/frame per unit of vy above a normal jump (bigger launches flip faster)

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// ============ LEVEL GENERATION ============
// Each level is a winding path of floating rectangular platforms along +Z,
// separated by gaps the ball must jump across. Rings float over/near the
// gaps (bonus, non-fatal); turquoise checkpoint squares sit on platform tops.
function themeFor(n) {
  const t = ['space', 'sky', 'neon', 'sunset'];
  return t[Math.floor((n - 1) / 5) % t.length];
}

function levelConfig(n) {
  const diff = (n - 1) / 19; // 0..1
  const name = tr('level') + n;
  const theme = themeFor(n);
  let seed = n * 7919 + 13;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 1000) / 1000; }

  const platCount = 9 + Math.floor(diff * 5); // 9..14 platforms after the start pad
  const movingChance = n >= 8 ? 0.25 + diff * 0.25 : 0;
  const heightsOn = diff > 0.15;
  const wanderOn = diff > 0.2;
  const rampsOn = n >= 2;      // gentle ramps from level ~2-3
  const launchOn = n >= 4;     // launch pads from level ~4-5

  const platforms = [];
  platforms.push({ x: 0, z: 0, hx: 130, hz: 140, h: 0, moving: null, slopeZ: 0, slopeX: 0, launch: null, start: true });
  let x = 0, z = 0, h = 0;
  let prevLaunch = false, prevSlopeZ = 0;

  for (let i = 0; i < platCount; i++) {
    const hx = clamp(lerp(100, 58, diff) + (rnd() - 0.5) * 20, 45, 130);
    const hz = clamp(lerp(90, 58, diff) + (rnd() - 0.5) * 20, 45, 130);

    // base gaps are noticeably bigger than before, and grow with difficulty
    let gapMin = lerp(55, 120, diff);
    let gapMax = lerp(95, 240, diff);
    if (prevSlopeZ < -0.3) { gapMin += 25; gapMax += 45; } // a steep down-ramp gives extra reach
    if (prevLaunch) { gapMin = lerp(230, 340, diff); gapMax = lerp(280, 430, diff); } // launch pads fling across BIG gaps

    const gap = gapMin + rnd() * (gapMax - gapMin);
    const prev = platforms[platforms.length - 1];
    z = prev.z + prev.hz + gap + hz;
    if (heightsOn && i > 0 && rnd() < 0.5 && !prevLaunch) {
      const step = (rnd() < 0.5 ? -1 : 1) * lerp(20, 55, diff) * (0.5 + rnd() * 0.5);
      h = clamp(h + step, -90, 150);
    }
    if (prevLaunch) {
      // the far side of a launch also sits higher up, since the boost flings the ball up too
      h = clamp(h + lerp(50, 150, diff) * (0.5 + rnd() * 0.5), -90, 260);
    }
    if (wanderOn) x = clamp(x + (rnd() * 2 - 1) * lerp(25, 100, diff), -190, 190);

    let moving = null;
    if (movingChance && i > 1 && !prevLaunch && rnd() < movingChance) {
      moving = {
        axis: rnd() < 0.5 ? 'x' : 'z',
        amp: 35 + rnd() * 45,
        spd: 0.018 + rnd() * 0.018,
        phase: rnd() * 6.28,
        baseX: x, baseZ: z,
      };
    }

    // sloped ramps (rise/run along Z, occasional gentle bank along X)
    let slopeZ = 0, slopeX = 0;
    if (rampsOn && !moving && !prevLaunch && i > 0 && i < platCount - 1 && rnd() < clamp(0.18 + diff * 0.3, 0, 0.5)) {
      const steep = n >= 10 && rnd() < 0.4;
      slopeZ = (rnd() < 0.5 ? -1 : 1) * (steep ? lerp(0.35, 0.62, diff) : lerp(0.12, 0.32, diff));
      if (rnd() < 0.3) slopeX = (rnd() < 0.5 ? -1 : 1) * lerp(0.05, 0.16, diff);
    }

    // launch pads: a glowing boost pad that flings the ball into a big airborne tumble
    let launch = null;
    const launchChance = launchOn ? clamp(0.12 + diff * 0.22, 0, 0.4) : 0;
    if (!prevLaunch && !slopeZ && !moving && launchChance && i > 1 && i < platCount - 1 && rnd() < launchChance) {
      launch = { vy: lerp(24, 34, diff) + rnd() * 4, vzBoost: lerp(4, 7.5, diff), vxBoost: 0 };
    }

    platforms.push({ x, z, hx, hz, h, moving, slopeZ, slopeX, launch, start: false });
    prevLaunch = !!launch;
    prevSlopeZ = slopeZ;
  }

  const last = platforms[platforms.length - 1];
  const goal = { x: last.x, z: last.z, h: last.h };

  // rings: mostly bridging the gaps (a natural arc across), some bonus rings over platforms
  const rings = [];
  for (let i = 0; i < platforms.length - 1; i++) {
    const a = platforms[i], b = platforms[i + 1];
    if (rnd() < 0.78) {
      const midZ = (a.z + a.hz + (b.z - b.hz)) / 2;
      const midX = (a.x + b.x) / 2 + (rnd() * 2 - 1) * 18;
      const midH = Math.max(a.h, b.h) + 65 + rnd() * 35;
      rings.push({ x: midX, y: midH, z: midZ, r: 44 - diff * 8, passed: false });
    }
  }
  for (let i = 2; i < platforms.length; i += 3) {
    if (rnd() < 0.35) {
      const p = platforms[i];
      rings.push({ x: p.x + (rnd() * 2 - 1) * p.hx * 0.4, y: p.h + 95, z: p.z, r: 40, passed: false });
    }
  }

  // checkpoints: start + roughly every 4 platforms
  const checkpoints = [{ x: 0, z: 0, h: 0, hit: false, size: 62 }];
  for (let i = 4; i < platforms.length; i += 4) {
    const p = platforms[i];
    checkpoints.push({ x: p.x, z: p.z, h: p.h, hit: false, size: 62 });
  }

  let minH = 0;
  for (const p of platforms) if (p.h < minH) minH = p.h;
  const deathY = minH - 320;

  return { n, name, theme, platforms, rings, checkpoints, goal, ringCount: rings.length, deathY };
}

// ============ SKINS ============
// Each skin is drawn procedurally; unlockLevel = level that must be beaten to unlock it (1 = free from start)
const SKINS = [
  { id: 'classic', unlockLevel: 1, draw: drawSkinClassic },
  { id: 'beach', unlockLevel: 2, draw: drawSkinBeach },
  { id: 'soccer', unlockLevel: 4, draw: drawSkinSoccer },
  { id: 'watermelon', unlockLevel: 6, draw: drawSkinWatermelon },
  { id: 'planet', unlockLevel: 9, draw: drawSkinPlanet },
  { id: 'galaxy', unlockLevel: 12, draw: drawSkinGalaxy },
  { id: 'gold', unlockLevel: 16, draw: drawSkinGold },
  { id: 'stitch', unlockLevel: 20, draw: drawSkinStitch },
];

function drawBallBase(r, baseColor, spin) {
  const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r);
  grad.addColorStop(0, lighten(baseColor, 0.5));
  grad.addColorStop(0.6, baseColor);
  grad.addColorStop(1, darken(baseColor, 0.35));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
}
function lighten(hex, amt) { return mix(hex, '#ffffff', amt); }
function darken(hex, amt) { return mix(hex, '#000000', amt); }
function mix(a, b, t) {
  const pa = hexToRgb(a), pb = hexToRgb(b);
  const r = Math.round(pa.r + (pb.r - pa.r) * t);
  const g = Math.round(pa.g + (pb.g - pa.g) * t);
  const bl = Math.round(pa.b + (pb.b - pa.b) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function hexToRgb(h) {
  h = h.replace('#', '');
  return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
}
function ballHighlight(r) {
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-r * 0.32, -r * 0.38, r * 0.22, r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
}

function drawSkinClassic(r, spin) {
  drawBallBase(r, '#3a8bef', spin);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1.5, r * 0.06);
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.9, r, 0, 0, Math.PI * 2);
    ctx.save(); ctx.rotate(spin + i * 1.05); ctx.beginPath();
    ctx.ellipse(0, 0, r * Math.abs(Math.cos(i)) * 0.85 + r * 0.15, r, 0, 0, Math.PI * 2);
    ctx.stroke(); ctx.restore();
  }
  ballHighlight(r);
}
function drawSkinBeach(r, spin) {
  drawBallBase(r, '#f4f4f4', spin);
  const colors = ['#ff4d4d', '#ffd23f', '#3aa1ff'];
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = colors[i % 3];
    ctx.save(); ctx.rotate(spin + i * Math.PI / 3);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, -0.26, 0.26); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ballHighlight(r);
}
function drawSkinSoccer(r, spin) {
  drawBallBase(r, '#f0f0f0', spin);
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#222';
  for (let i = 0; i < 5; i++) {
    const ang = spin + i * (Math.PI * 2 / 5);
    const px = Math.cos(ang) * r * 0.42, py = Math.sin(ang) * r * 0.42;
    drawPentagon(px, py, r * 0.24, ang);
  }
  drawPentagon(0, 0, r * 0.22, spin);
  ctx.restore();
  ballHighlight(r);
}
function drawPentagon(cx, cy, rr, rot) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rot + i * (Math.PI * 2 / 5) - Math.PI / 2;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
function drawSkinWatermelon(r, spin) {
  drawBallBase(r, '#39c15a', spin);
  ctx.strokeStyle = 'rgba(20,80,30,0.55)'; ctx.lineWidth = Math.max(1.5, r * 0.09);
  for (let i = 0; i < 7; i++) {
    ctx.save(); ctx.rotate(spin + i * 0.45);
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.2, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ballHighlight(r);
}
function drawSkinPlanet(r, spin) {
  drawBallBase(r, '#d99a4e', spin);
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(120,60,20,0.35)'; ctx.lineWidth = r * 0.14;
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-r, i * r * 0.4); ctx.lineTo(r, i * r * 0.4 + 4); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.rotate(0.5);
  ctx.strokeStyle = '#e8c98a'; ctx.lineWidth = Math.max(2, r * 0.14);
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.6, r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  ballHighlight(r);
}
function drawSkinGalaxy(r, spin) {
  drawBallBase(r, '#241448', spin);
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  let seed = 99;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (let i = 0; i < 22; i++) {
    const a = rnd() * Math.PI * 2 + spin * 0.3;
    const rr = rnd() * r;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + rnd() * 0.7) + ')';
    ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr, 1.6, 1.6);
  }
  ctx.restore();
  ballHighlight(r);
}
function drawSkinGold(r, spin) {
  drawBallBase(r, '#f4c93e', spin);
  ctx.strokeStyle = 'rgba(255,255,220,0.6)'; ctx.lineWidth = Math.max(1.5, r * 0.05);
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.rotate(spin + i * 1.05);
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.9, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  ballHighlight(r);
}
function drawSkinStitch(r, spin) {
  drawBallBase(r, '#3a72d0', spin);
  ctx.save(); ctx.rotate(spin * 0.15);
  // simple face
  ctx.fillStyle = '#e9f4ff';
  ctx.beginPath(); ctx.ellipse(-r * 0.28, -r * 0.05, r * 0.22, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.28, -r * 0.05, r * 0.22, r * 0.26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-r * 0.28, r * 0.02, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.28, r * 0.02, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a3a8f';
  ctx.beginPath(); ctx.ellipse(0, r * 0.28, r * 0.16, r * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ballHighlight(r);
}

// ============ THEMES ============
const THEMES = {
  space:  { sky: ['#07051c', '#1a1240', '#2c1a56'], platform: '#372a6b', platformTop: '#4d3a94', line: '#7dfcff', stars: true, accent: '#8f6bff' },
  sky:    { sky: ['#2b6fb0', '#7ec7e8', '#dff3ff'], platform: '#2c5f8c', platformTop: '#3a7fc0', line: '#ffffff', stars: false, accent: '#ffe066' },
  neon:   { sky: ['#0a0a12', '#1a0a2a', '#2a0a3a'], platform: '#3a1450', platformTop: '#521c70', line: '#ff2fd0', stars: true, accent: '#2fffe0' },
  sunset: { sky: ['#3a1050', '#a3396b', '#f0975a'], platform: '#6a2a4a', platformTop: '#8a3a5e', line: '#ffd27a', stars: false, accent: '#ff7a5c' },
};

// ============ PROGRESS (localStorage) ============
const UNLOCK_KEY = 'superRingsUnlocked';
const SKIN_KEY = 'superRingsSkin';
const SKIN_UNLOCK_KEY = 'superRingsSkinsUnlocked';
function getUnlocked() {
  try { return clamp(parseInt(localStorage.getItem(UNLOCK_KEY) || '1', 10) || 1, 1, 20); } catch (e) { return 1; }
}
function setUnlocked(n) {
  try { if (n > getUnlocked()) localStorage.setItem(UNLOCK_KEY, String(n)); } catch (e) {}
}
function getStars(n) {
  try { return parseInt(localStorage.getItem('superRingsStars' + n) || '0', 10) || 0; } catch (e) { return 0; }
}
function setStars(n, stars) {
  try { if (stars > getStars(n)) localStorage.setItem('superRingsStars' + n, String(stars)); } catch (e) {}
}
function getEquippedSkin() {
  try { return localStorage.getItem(SKIN_KEY) || 'classic'; } catch (e) { return 'classic'; }
}
function setEquippedSkin(id) {
  try { localStorage.setItem(SKIN_KEY, id); } catch (e) {}
}
function getUnlockedSkins() {
  try {
    const raw = localStorage.getItem(SKIN_UNLOCK_KEY);
    return raw ? JSON.parse(raw) : ['classic'];
  } catch (e) { return ['classic']; }
}
function syncSkinUnlocks() {
  const unlockedLevel = getUnlocked();
  const have = getUnlockedSkins();
  let changed = false;
  for (const s of SKINS) {
    if (s.unlockLevel <= unlockedLevel && have.indexOf(s.id) < 0) { have.push(s.id); changed = true; }
  }
  if (changed) { try { localStorage.setItem(SKIN_UNLOCK_KEY, JSON.stringify(have)); } catch (e) {} }
  return have;
}

// ============ GAME STATE ============
const state = { mode: 'title', levelIdx: 0, msg: '', msgT: 0, stars: 0, newSkinUnlocked: null };
const player = {
  x: 0, y: BALL_R, z: 0,
  vx: 0, vy: 0, vz: 0,
  boostVx: 0, boostVz: 0,   // extra momentum from launch pads / ramps, decays over time
  tumble: 0, tumbleRate: 0, // whole-ball somersault rotation while airborne
  hearts: 3, invuln: 0,
  squash: 0, spin: 0,
  grounded: true, groundPlatform: null, framesSinceGrounded: 0, jumpBuffer: 0,
  checkpoint: { x: 0, z: 0, h: 0 },
};
const camera = { x: 0, y: CAM_HEIGHT, z: -CAM_BACK };
let level = null, theme = THEMES.space;
let ringsPassedCount = 0, ringsTotal = 0;
let parts = [], flashT = 0, shakeT = 0, respawnT = 0, levelT = 0;
let unlockedSkins = syncSkinUnlocks();
let skinPickerFrom = 'title'; // where to return after picking

function newLevelRuntimeState() {
  ringsPassedCount = 0;
  ringsTotal = level.ringCount;
  parts = []; flashT = 0; shakeT = 0; respawnT = 0; levelT = 0;
}

function snapCameraToPlayer() {
  camera.x = player.x;
  camera.z = player.z - CAM_BACK;
  camera.y = player.y + CAM_HEIGHT;
}

function startLevel(idx) {
  level = levelConfig(idx + 1);
  theme = THEMES[level.theme];
  level.platforms = level.platforms.map(p => Object.assign({}, p, p.moving ? { moving: Object.assign({}, p.moving) } : {}));
  level.rings = level.rings.map(r => Object.assign({}, r, { passed: false }));
  level.checkpoints = level.checkpoints.map(c => Object.assign({}, c, { hit: false }));
  level.checkpoints[0].hit = true;
  player.x = 0; player.z = 0; player.y = BALL_R;
  player.vx = 0; player.vy = 0; player.vz = 0;
  player.boostVx = 0; player.boostVz = 0; player.tumble = 0; player.tumbleRate = 0;
  player.hearts = 3; player.invuln = 40; player.squash = 0; player.spin = 0;
  player.grounded = true; player.groundPlatform = level.platforms[0]; player.framesSinceGrounded = 0; player.jumpBuffer = 0;
  player.checkpoint = { x: 0, z: 0, h: 0 };
  snapCameraToPlayer();
  state.levelIdx = idx;
  state.mode = 'play';
  state.msg = ''; state.msgT = 0;
  newLevelRuntimeState();
}

// ============ INPUT ============
let dragging = false, dragId = null, dragStartX = 0, dragStartY = 0;
let dragDX = 0, dragDY = 0;
let jumpTouchId = null;
const keys = {};
let jumpQueuedInput = false;

function jumpButtonBounds() {
  const r = 42 * K;
  return { cx: W - r - 22, cy: H - r - 26 - (window.__safeBottom || 0), r: r * 1.25 };
}
function inJumpButton(x, y) {
  const b = jumpButtonBounds();
  const dx = x - b.cx, dy = y - b.cy;
  return dx * dx + dy * dy <= b.r * b.r;
}

function queueJump() {
  jumpQueuedInput = true;
}

function onPointerDown(x, y, id) {
  initAudio();
  if (state.mode === 'title') {
    state.mode = 'levelselect';
    return;
  }
  if (state.mode === 'levelselect') { handleLevelSelectTap(x, y); return; }
  if (state.mode === 'skins') { handleSkinTap(x, y); return; }
  if (state.mode === 'levelcomplete') { state.mode = 'levelselect'; return; }
  if (state.mode === 'champion') { state.mode = 'levelselect'; return; }
  if (state.mode === 'play') {
    if (inJumpButton(x, y)) { jumpTouchId = id; queueJump(); return; }
    dragging = true; dragId = id;
    dragStartX = x; dragStartY = y; dragDX = 0; dragDY = 0;
  }
}
function onPointerMove(x, y, id) {
  if (state.mode !== 'play' || !dragging || id !== dragId) return;
  dragDX = x - dragStartX; dragDY = y - dragStartY;
}
function onPointerUp(id) {
  if (id === dragId) { dragging = false; dragId = null; dragDX = 0; dragDY = 0; }
  if (id === jumpTouchId) jumpTouchId = null;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onPointerDown(t.clientX, t.clientY, t.identifier);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onPointerMove(t.clientX, t.clientY, t.identifier);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) onPointerUp(t.identifier);
}, { passive: false });
canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) onPointerUp(t.identifier);
});
canvas.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY, 'mouse'));
canvas.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY, 'mouse'));
window.addEventListener('mouseup', e => onPointerUp('mouse'));

window.addEventListener('keydown', e => {
  initAudio();
  if (!keys[e.code]) {
    if (e.code === 'Space') queueJump();
  }
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (state.mode === 'title' && (e.code === 'Enter' || e.code === 'Space')) state.mode = 'levelselect';
  else if (state.mode === 'levelcomplete' && (e.code === 'Enter' || e.code === 'Space')) state.mode = 'levelselect';
  else if (state.mode === 'champion' && (e.code === 'Enter' || e.code === 'Space')) state.mode = 'levelselect';
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function handleLevelSelectTap(x, y) {
  if (y < H * 0.13) { state.mode = 'title'; return; }
  // skins button, top-right
  if (y < H * 0.13 + 46 * K && x > W - 140 * K) { skinPickerFrom = 'levelselect'; state.mode = 'skins'; return; }
  const unlocked = getUnlocked();
  const cols = W > 700 ? 5 : (W > 460 ? 4 : 3);
  const cw = Math.min(120, (W - 60) / cols);
  const ch = cw;
  const gx = (W - cw * cols - 14 * (cols - 1)) / 2;
  const gy = H * 0.24;
  for (let i = 0; i < 20; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gx + col * (cw + 14);
    const cy = gy + row * (ch + 14);
    if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) {
      if (i + 1 <= unlocked) startLevel(i);
      return;
    }
  }
}

function handleSkinTap(x, y) {
  if (y < H * 0.13) { state.mode = skinPickerFrom; return; }
  const cols = W > 700 ? 4 : 2;
  const cw = Math.min(150, (W - 60) / cols);
  const ch = cw * 1.05;
  const gx = (W - cw * cols - 16 * (cols - 1)) / 2;
  const gy = H * 0.24;
  const have = unlockedSkins;
  for (let i = 0; i < SKINS.length; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gx + col * (cw + 16);
    const cy = gy + row * (ch + 16);
    if (x >= cx && x <= cx + cw && y >= cy && y <= cy + ch) {
      if (have.indexOf(SKINS[i].id) >= 0) { setEquippedSkin(SKINS[i].id); sfx.tick(); }
      return;
    }
  }
}

// ============ UPDATE ============
const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;

function updateParticles() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
    if (p.life <= 0) parts.splice(i, 1);
  }
}
function burst(sx, sy, color, n) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x: sx, y: sy,
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 5 - 1,
      life: 26 + Math.random() * 20,
      color,
    });
  }
}

function desiredVelocity() {
  let dvx = 0, dvz = 0;
  if (dragging) {
    dvx = clamp(dragDX * 0.06, -1, 1) * MAX_SPEED;
    dvz = clamp(-dragDY * 0.06, -1, 1) * MAX_SPEED;
  } else {
    const left = keys.ArrowLeft || keys.KeyA;
    const right = keys.ArrowRight || keys.KeyD;
    const fwd = keys.ArrowUp || keys.KeyW;
    const back = keys.ArrowDown || keys.KeyS;
    if (left) dvx -= MAX_SPEED;
    if (right) dvx += MAX_SPEED;
    if (fwd) dvz += MAX_SPEED;
    if (back) dvz -= MAX_SPEED;
  }
  return { dvx, dvz };
}

function footprintContains(p, x, z, tol) {
  return x > p.x - p.hx - tol && x < p.x + p.hx + tol && z > p.z - p.hz - tol && z < p.z + p.hz + tol;
}

// height of a platform's (possibly sloped) top surface directly under (x, z)
function platformTopAt(p, x, z) {
  let top = p.h;
  if (p.slopeZ) top += p.slopeZ * (z - p.z);
  if (p.slopeX) top += p.slopeX * (x - p.x);
  return top;
}

function updateMovingPlatforms() {
  for (const p of level.platforms) {
    if (!p.moving) { p.prevX = p.x; p.prevZ = p.z; continue; }
    p.prevX = p.x; p.prevZ = p.z;
    const off = Math.sin(levelT * p.moving.spd + p.moving.phase) * p.moving.amp;
    if (p.moving.axis === 'x') p.x = p.moving.baseX + off;
    else p.z = p.moving.baseZ + off;
  }
}

// send the ball airborne with a given upward speed, and kick off a somersault
// scaled to how big the jump/launch is (bigger launches flip faster)
function becomeAirborne(vy) {
  player.vy = vy;
  player.grounded = false;
  player.groundPlatform = null;
  player.framesSinceGrounded = COYOTE_FRAMES + 1;
  player.squash = 1;
  player.tumbleRate = TUMBLE_BASE + Math.max(0, vy - JUMP_VY) * TUMBLE_PER_EXTRA_VY;
}

function tryJump() {
  const canJump = player.grounded || player.framesSinceGrounded <= COYOTE_FRAMES;
  if (canJump) {
    becomeAirborne(JUMP_VY);
    player.jumpBuffer = 0;
    sfx.jump();
  } else {
    player.jumpBuffer = JUMP_BUFFER_FRAMES;
  }
}

function loseHeartAndRespawn() {
  player.hearts--;
  if (player.hearts <= 0) player.hearts = 3; // kid-friendly: never a hard game over
  respawnT = 40;
  player.invuln = 70;
  flashT = 10; shakeT = 14;
  sfx.fall();
  const cp = player.checkpoint;
  player.x = cp.x; player.z = cp.z; player.y = cp.h + BALL_R;
  player.vx = 0; player.vy = 0; player.vz = 0;
  player.boostVx = 0; player.boostVz = 0; player.tumble = 0; player.tumbleRate = 0;
  player.grounded = true; player.framesSinceGrounded = 0;
  // find the platform under the checkpoint so it carries the ball if it's moving
  player.groundPlatform = null;
  for (const p of level.platforms) {
    if (footprintContains(p, cp.x, cp.z, FOOT_TOL)) { player.groundPlatform = p; break; }
  }
  snapCameraToPlayer();
  sfx.respawn();
  state.msg = tr('respawning'); state.msgT = 90;
}

function update() {
  updateParticles();
  if (flashT > 0) flashT--;
  if (shakeT > 0) shakeT--;
  if (state.msgT > 0) state.msgT--;

  if (state.mode !== 'play') { jumpQueuedInput = false; return; }

  levelT++;
  if (player.squash > 0) player.squash -= 0.05;

  if (jumpQueuedInput) { tryJump(); jumpQueuedInput = false; }
  if (player.jumpBuffer > 0) {
    player.jumpBuffer--;
    if (player.grounded || player.framesSinceGrounded <= COYOTE_FRAMES) tryJump();
  }

  if (respawnT > 0) { respawnT--; updateCamera(); return; }
  if (player.invuln > 0) player.invuln--;

  updateMovingPlatforms();

  // carry the ball along with the platform it stands on
  if (player.grounded && player.groundPlatform && player.groundPlatform.moving) {
    player.x += player.groundPlatform.x - player.groundPlatform.prevX;
    player.z += player.groundPlatform.z - player.groundPlatform.prevZ;
  }

  const { dvx, dvz } = desiredVelocity();
  player.vx += (dvx - player.vx) * MOVE_EASE;
  player.vz += (dvz - player.vz) * MOVE_EASE;
  // rolling down a slope gains a little speed; rolling up one slows down gently
  if (player.grounded && player.groundPlatform) {
    const gp = player.groundPlatform;
    if (gp.slopeZ) player.boostVz -= gp.slopeZ * SLOPE_ACCEL;
    if (gp.slopeX) player.boostVx -= gp.slopeX * SLOPE_SIDE_ACCEL;
  }
  player.x += player.vx + player.boostVx;
  player.z += player.vz + player.boostVz;
  player.boostVx *= BOOST_DECAY;
  player.boostVz *= BOOST_DECAY;
  player.spin += 0.05 + Math.hypot(player.vx, player.vz) * 0.02;

  if (!player.grounded) {
    player.vy -= GRAVITY;
    player.y += player.vy;
    player.tumble += player.tumbleRate;
  } else {
    player.vy = 0;
  }

  // collision: find a platform under the ball to land on (using its local, possibly sloped, top height)
  let landed = null, landedTop = 0;
  for (const p of level.platforms) {
    if (!footprintContains(p, player.x, player.z, FOOT_TOL)) continue;
    if (player.vy > 0.5) continue; // moving upward through/near a platform: no landing
    const top = platformTopAt(p, player.x, player.z);
    if (player.y - BALL_R <= top + LAND_TOL) {
      if (!landed || top > landedTop) { landed = p; landedTop = top; }
    }
  }
  if (landed) {
    const wasAirborne = !player.grounded;
    player.y = landedTop + BALL_R;
    player.vy = 0;
    player.grounded = true;
    player.groundPlatform = landed;
    player.framesSinceGrounded = 0;
    player.boostVx = 0; player.boostVz = 0;
    if (wasAirborne) { player.squash = 1; player.tumble = 0; player.tumbleRate = 0; sfx.land(); }
    // launch pads fling the ball right back into the air with a big boost
    if (landed.launch) {
      const L = landed.launch;
      becomeAirborne(L.vy);
      player.boostVz += L.vzBoost;
      player.boostVx += L.vxBoost || 0;
      sfx.launch();
      const lp = projWorld(player.x, player.y, player.z);
      burst(lp.x, lp.y, '#ff9d3c', 20);
    }
  } else {
    player.grounded = false;
    player.groundPlatform = null;
    player.framesSinceGrounded++;
  }

  // fall off the world -> lose a heart, respawn at last checkpoint
  if (player.y < level.deathY) {
    loseHeartAndRespawn();
    updateCamera();
    return;
  }

  // checkpoints: roll over the turquoise square while grounded
  if (player.grounded) {
    for (const c of level.checkpoints) {
      if (c.hit) continue;
      if (Math.abs(player.x - c.x) < c.size * 0.7 + BALL_R && Math.abs(player.z - c.z) < c.size * 0.7 + BALL_R) {
        c.hit = true;
        player.checkpoint = { x: c.x, z: c.z, h: c.h };
        sfx.checkpoint();
        state.msg = tr('checkpointHit'); state.msgT = 60;
        const p = projWorld(c.x, c.h + 4, c.z);
        burst(p.x, p.y, theme.accent, 14);
      }
    }
  }

  // rings: jump through them (bonus, non-fatal)
  for (const r of level.rings) {
    if (r.passed) continue;
    const dx = player.x - r.x, dz = player.z - r.z;
    const distXZ = Math.hypot(dx, dz);
    if (distXZ < r.r * 0.75 && Math.abs(player.y - r.y) < r.r * 0.7) {
      r.passed = true;
      ringsPassedCount++;
      sfx.ringPass();
      const p = projWorld(r.x, r.y, r.z);
      burst(p.x, p.y, theme.accent, 16);
    }
  }

  // goal
  if (player.grounded) {
    const g = level.goal;
    if (Math.hypot(player.x - g.x, player.z - g.z) < 90) completeLevel();
  }

  updateCamera();
}

function updateCamera() {
  camera.x += (player.x - camera.x) * CAM_EASE_XZ;
  camera.z += ((player.z - CAM_BACK) - camera.z) * CAM_EASE_XZ;
  camera.y += ((player.y + CAM_HEIGHT) - camera.y) * CAM_EASE_Y;
}

function completeLevel() {
  const missed = level.ringCount - ringsPassedCount;
  const heartsLeft = player.hearts;
  let stars = 1;
  if (missed === 0 && heartsLeft === 3) stars = 3;
  else if (heartsLeft >= 2) stars = 2;
  state.stars = stars;
  setStars(state.levelIdx + 1, stars);
  const lvlNum = state.levelIdx + 1;
  const wasUnlocked = getUnlocked();
  if (lvlNum === wasUnlocked && lvlNum < 20) setUnlocked(lvlNum + 1);
  const before = unlockedSkins.slice();
  unlockedSkins = syncSkinUnlocks();
  state.newSkinUnlocked = null;
  for (const s of SKINS) {
    if (before.indexOf(s.id) < 0 && unlockedSkins.indexOf(s.id) >= 0) { state.newSkinUnlocked = s.id; break; }
  }
  if (lvlNum >= 20) {
    state.mode = 'champion';
    sfx.champion();
    for (let i = 0; i < 100; i++) parts.push({
      x: Math.random() * W, y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2.5,
      life: 140 + Math.random() * 100,
      color: ['#ff6b8a', '#ffe066', '#7dff8a', '#7adcff', '#c77dff'][i % 5],
    });
  } else {
    state.mode = 'levelcomplete';
    sfx.levelDone();
    if (state.newSkinUnlocked) sfx.unlock();
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250;
  acc += dt;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
}

// ============ RENDER: BACKGROUND ============
function drawBackground(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.sky[0]);
  grad.addColorStop(0.5, theme.sky[1]);
  grad.addColorStop(1, theme.sky[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (theme.stars) {
    let seed = 5;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < 90; i++) {
      const sx = rnd() * W;
      const sy = rnd() * H * HORIZON_FRAC;
      const tw = 0.3 + 0.7 * Math.abs(Math.sin(t / 500 + i));
      ctx.fillStyle = 'rgba(255,255,255,' + tw + ')';
      ctx.fillRect(sx, sy, 2, 2);
    }
  }
}

function drawHorizonGlow() {
  const horizonY = H * HORIZON_FRAC;
  const grad = ctx.createLinearGradient(0, horizonY - 40, 0, horizonY + 40);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.5, theme.line + '33');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, horizonY - 40, W, 80);
}

// ============ RENDER: PLATFORMS ============
const PLATFORM_THICKNESS = 46;

function drawPlatform(p) {
  const nearZ = p.z - p.hz, farZ = p.z + p.hz;
  if (farZ - camera.z < -60 || nearZ - camera.z > 2600) return;
  const xL = p.x - p.hx, xR = p.x + p.hx;
  // per-corner top height so sloped (ramp) platforms read as visibly tilted slabs
  const topNL = platformTopAt(p, xL, nearZ), topNR = platformTopAt(p, xR, nearZ);
  const topFL = platformTopAt(p, xL, farZ), topFR = platformTopAt(p, xR, farZ);

  const tl = projWorld(xL, topNL, nearZ);
  const tr = projWorld(xR, topNR, nearZ);
  const tlF = projWorld(xL, topFL, farZ);
  const trF = projWorld(xR, topFR, farZ);
  const bl = projWorld(xL, topNL - PLATFORM_THICKNESS, nearZ);
  const br = projWorld(xR, topNR - PLATFORM_THICKNESS, nearZ);

  const isRamp = !!(p.slopeZ || p.slopeX);
  const topFill = p.launch ? '#ffb23c' : (isRamp ? lighten(theme.platformTop, 0.14) : theme.platformTop);
  const sideFill = p.launch ? '#c97324' : theme.platform;

  // front (near) side face, gives the slab some depth
  ctx.save();
  ctx.fillStyle = sideFill;
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // top face
  ctx.save();
  ctx.fillStyle = topFill;
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(trF.x, trF.y); ctx.lineTo(tlF.x, tlF.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = p.launch ? '#fff2c2' : theme.line; ctx.globalAlpha = 0.4; ctx.lineWidth = Math.max(1, 2 * tl.scale);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // launch pads glow and show a stack of upward chevrons pointing the way
  if (p.launch) {
    const cw = projWorld(p.x, p.h + 2, p.z);
    if (cw.scale > 0.05) {
      ctx.save();
      ctx.translate(cw.x, cw.y);
      ctx.scale(1, 0.5);
      ctx.shadowColor = '#ffb23c'; ctx.shadowBlur = Math.max(4, 12 * cw.scale);
      ctx.strokeStyle = '#fff2c2';
      ctx.lineWidth = Math.max(2, 4 * cw.scale);
      ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        const yy = k * 26 * cw.scale;
        ctx.beginPath();
        ctx.moveTo(-20 * cw.scale, yy + 12 * cw.scale);
        ctx.lineTo(0, yy - 8 * cw.scale);
        ctx.lineTo(20 * cw.scale, yy + 12 * cw.scale);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawCheckpointPad(c) {
  const d = c.z - camera.z;
  if (d < -60 || d > 2600) return;
  const cx = projWorld(c.x, c.h + 1.5, c.z);
  const s = c.size * cx.scale;
  if (s < 1.5) return;
  ctx.save();
  ctx.translate(cx.x, cx.y);
  ctx.scale(1, 0.42); // flatten onto the ground plane
  const color = c.hit ? '#3ad6c4' : '#40e0d0';
  ctx.shadowColor = color; ctx.shadowBlur = Math.max(3, s * 0.3);
  ctx.fillStyle = c.hit ? 'rgba(64,224,208,0.55)' : 'rgba(64,224,208,0.32)';
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, s * 0.08);
  ctx.beginPath(); ctx.rect(-s / 2, -s / 2, s, s); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawRing(r) {
  const d = r.z - camera.z;
  if (d < -100 || d > 2700) return;
  const p = projWorld(r.x, r.y, r.z);
  const rr = r.r * p.scale;
  if (rr < 1.2) return;
  const color = r.passed ? '#5cff8a' : theme.accent;

  // back arc
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, rr * 0.22);
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr * 0.92, 0, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  // glow ring
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = Math.max(4, rr * 0.5);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2, rr * 0.16);
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr * 0.92, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawGoal() {
  const g = level.goal;
  const d = g.z - camera.z;
  if (d < -100 || d > 3200) return;
  const p = projWorld(g.x, g.h + 110, g.z);
  const rr = 130 * p.scale;
  if (rr < 1.5) return;
  ctx.save();
  ctx.shadowColor = '#ffe066'; ctx.shadowBlur = Math.max(6, rr * 0.4);
  const grad = ctx.createRadialGradient(p.x, p.y, rr * 0.3, p.x, p.y, rr);
  grad.addColorStop(0, 'rgba(255,230,102,0.5)');
  grad.addColorStop(1, 'rgba(255,230,102,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = Math.max(2, rr * 0.1);
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ============ RENDER: PLAYER BALL ============
function drawPlayer() {
  const p = projWorld(player.x, player.y, player.z);
  const r = 34 * p.scale * (1 - player.squash * 0.35);
  const rY = r * (1 + player.squash * 0.35);

  // shadow on the ground below the ball (fades out the higher it is)
  const groundH = player.groundPlatform ? platformTopAt(player.groundPlatform, player.x, player.z) : (level ? level.goal.h : 0);
  const shadowP = projWorld(player.x, groundH, player.z);
  const heightAbove = Math.max(0, player.y - BALL_R - groundH);
  ctx.save();
  ctx.globalAlpha = clamp(0.35 - heightAbove * 0.0015, 0.06, 0.35);
  ctx.fillStyle = '#000';
  const shR = r * (1 - Math.min(0.5, heightAbove * 0.002));
  ctx.beginPath();
  ctx.ellipse(shadowP.x, shadowP.y, shR * 1.1, shR * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(1, rY / r);
  ctx.rotate(player.tumble); // exaggerated whole-ball somersault while airborne (bigger jumps/launches flip faster)
  const skin = SKINS.find(s => s.id === getEquippedSkin()) || SKINS[0];
  const flashing = player.invuln > 0 && Math.floor(player.invuln / 6) % 2 === 0;
  if (flashing) ctx.globalAlpha = 0.55;
  skin.draw(r, player.spin);
  ctx.restore();
}

// ============ RENDER: PARTICLES / OVERLAY ============
function drawParticles() {
  for (const pt of parts) {
    ctx.globalAlpha = Math.max(0, pt.life / 40);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawJumpButton() {
  const b = jumpButtonBounds();
  ctx.save();
  ctx.globalAlpha = jumpTouchId !== null ? 0.9 : 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold ' + (34 * K) + 'px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⬆', b.cx, b.cy + 2);
  ctx.restore();
}

function drawHUD() {
  // hearts
  ctx.save();
  ctx.font = (26 * K) + 'px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for (let i = 0; i < 3; i++) {
    ctx.fillText(i < player.hearts ? '❤️' : '🖤', 14 + i * 32 * K, 14);
  }
  ctx.restore();

  // level name top-center
  ctx.save();
  ctx.font = 'bold ' + (18 * K) + 'px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  const label = level.name;
  const tw = ctx.measureText(label).width;
  const nameY = 44 + (window.__safeTop || 0); // sit below the centered "← Games" home link
  ctx.fillRect(W / 2 - tw / 2 - 12, nameY - 2, tw + 24, 28 * K);
  ctx.fillStyle = '#fff';
  ctx.fillText(label, W / 2, nameY);
  ctx.restore();

  // ring progress top-right
  ctx.save();
  ctx.font = (16 * K) + 'px -apple-system, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillText('💍 ' + ringsPassedCount + '/' + ringsTotal, W - 14, 16);
  ctx.restore();

  drawJumpButton();

  if (state.msgT > 0) {
    ctx.save();
    const a = Math.min(1, state.msgT / 20);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + (24 * K) + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText(state.msg, W / 2, H * 0.22);
    ctx.fillStyle = '#ffe066';
    ctx.fillText(state.msg, W / 2, H * 0.22);
    ctx.restore();
  }
}

// ============ RENDER: MENUS ============
function drawTitle() {
  drawBackground(performance.now());
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (38 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('title'), W / 2, H * 0.24);
  ctx.font = (17 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('hint'), W / 2, H * 0.33);
  ctx.font = (14 * K) + 'px -apple-system, sans-serif';
  wrapText(tr('controlsHint'), W / 2, H * 0.39, W * 0.82, 20 * K);

  // demo ball
  const bob = Math.sin(performance.now() / 400) * 10;
  ctx.save();
  ctx.translate(W / 2, H * 0.6 + bob);
  const skin = SKINS.find(s => s.id === getEquippedSkin()) || SKINS[0];
  skin.draw(60 * K, performance.now() / 300);
  ctx.restore();

  ctx.font = 'bold ' + (22 * K) + 'px -apple-system, sans-serif';
  ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 500));
  ctx.fillStyle = '#ffe066';
  ctx.fillText(tr('tapStart'), W / 2, H * 0.8);
  ctx.restore();
}

function wrapText(text, cx, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  ctx.save();
  ctx.fillStyle = '#fff';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i * lineH);
  ctx.restore();
}

function drawLevelSelect() {
  drawBackground(performance.now());
  ctx.save();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (22 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('levels'), W / 2, H * 0.06);
  ctx.font = (16 * K) + 'px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(tr('back'), 14, H * 0.05);

  // skins button
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe066';
  ctx.font = 'bold ' + (16 * K) + 'px -apple-system, sans-serif';
  ctx.fillText('🎨 ' + tr('skins'), W - 14, H * 0.05);
  ctx.restore();

  const unlocked = getUnlocked();
  const cols = W > 700 ? 5 : (W > 460 ? 4 : 3);
  const cw = Math.min(120, (W - 60) / cols);
  const ch = cw;
  const gx = (W - cw * cols - 14 * (cols - 1)) / 2;
  const gy = H * 0.24;
  for (let i = 0; i < 20; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gx + col * (cw + 14);
    const cy = gy + row * (ch + 14);
    const isUnlocked = i + 1 <= unlocked;
    ctx.save();
    ctx.fillStyle = isUnlocked ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.3)';
    ctx.strokeStyle = isUnlocked ? '#ffe066' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx, cy, cw, ch, 10); else ctx.rect(cx, cy, cw, ch);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (isUnlocked) {
      ctx.font = 'bold ' + (22 * K) + 'px -apple-system, sans-serif';
      ctx.fillText(String(i + 1), cx + cw / 2, cy + ch * 0.4);
      const stars = getStars(i + 1);
      ctx.font = (13 * K) + 'px -apple-system, sans-serif';
      ctx.fillText('⭐'.repeat(stars) + '☆'.repeat(3 - stars), cx + cw / 2, cy + ch * 0.72);
    } else {
      ctx.font = (22 * K) + 'px -apple-system, sans-serif';
      ctx.fillText('🔒', cx + cw / 2, cy + ch * 0.5);
    }
    ctx.restore();
  }
}

function drawSkinsScreen() {
  drawBackground(performance.now());
  ctx.save();
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + (22 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('skinPicker'), W / 2, H * 0.06);
  ctx.textAlign = 'left'; ctx.font = (16 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('back'), 14, H * 0.05);
  ctx.restore();

  const cols = W > 700 ? 4 : 2;
  const cw = Math.min(150, (W - 60) / cols);
  const ch = cw * 1.05;
  const gx = (W - cw * cols - 16 * (cols - 1)) / 2;
  const gy = H * 0.24;
  const have = unlockedSkins;
  const equipped = getEquippedSkin();
  for (let i = 0; i < SKINS.length; i++) {
    const s = SKINS[i];
    const col = i % cols, row = Math.floor(i / cols);
    const cx = gx + col * (cw + 16);
    const cy = gy + row * (ch + 16);
    const unlocked = have.indexOf(s.id) >= 0;
    ctx.save();
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.35)';
    ctx.strokeStyle = s.id === equipped ? '#5cff8a' : (unlocked ? '#ffe066' : 'rgba(255,255,255,0.2)');
    ctx.lineWidth = s.id === equipped ? 3 : 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx, cy, cw, ch, 10); else ctx.rect(cx, cy, cw, ch);
    ctx.fill(); ctx.stroke();
    ctx.save();
    ctx.translate(cx + cw / 2, cy + ch * 0.4);
    if (!unlocked) ctx.globalAlpha = 0.35;
    s.draw(cw * 0.26, performance.now() / 300 + i);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = (13 * K) + 'px -apple-system, sans-serif';
    ctx.fillText(tr('skinNames')[i], cx + cw / 2, cy + ch * 0.78);
    if (!unlocked) {
      ctx.fillStyle = '#ffe066';
      ctx.font = (11 * K) + 'px -apple-system, sans-serif';
      ctx.fillText('🔒 ' + tr('unlockAt')(s.unlockLevel), cx + cw / 2, cy + ch * 0.92);
    } else if (s.id === equipped) {
      ctx.fillStyle = '#5cff8a';
      ctx.font = 'bold ' + (11 * K) + 'px -apple-system, sans-serif';
      ctx.fillText(tr('equipped'), cx + cw / 2, cy + ch * 0.92);
    }
    ctx.restore();
  }
}

function drawLevelComplete() {
  drawBackground(performance.now());
  drawParticles();
  ctx.save();
  ctx.textAlign = 'center'; ctx.fillStyle = '#5cff8a';
  ctx.font = 'bold ' + (30 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('levelComplete'), W / 2, H * 0.32);
  ctx.fillStyle = '#ffe066';
  ctx.font = (24 * K) + 'px -apple-system, sans-serif';
  ctx.fillText('⭐'.repeat(state.stars) + '☆'.repeat(3 - state.stars), W / 2, H * 0.42);
  if (state.newSkinUnlocked) {
    ctx.fillStyle = '#fff';
    ctx.font = (18 * K) + 'px -apple-system, sans-serif';
    ctx.fillText('🎉 ' + tr('skins') + ': ' + tr('skinNames')[SKINS.findIndex(s => s.id === state.newSkinUnlocked)], W / 2, H * 0.5);
  }
  ctx.fillStyle = '#fff';
  ctx.font = (16 * K) + 'px -apple-system, sans-serif';
  ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 500));
  ctx.fillText(tr('tapContinue'), W / 2, H * 0.62);
  ctx.restore();
}

function drawChampion() {
  drawBackground(performance.now());
  drawParticles();
  ctx.save();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe066';
  ctx.font = 'bold ' + (30 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('champion'), W / 2, H * 0.32);
  ctx.fillStyle = '#fff';
  ctx.font = (18 * K) + 'px -apple-system, sans-serif';
  ctx.fillText(tr('conquered'), W / 2, H * 0.42);
  ctx.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 500));
  ctx.fillText(tr('tapMenu'), W / 2, H * 0.62);
  ctx.restore();
}

// ============ RENDER: MAIN ============
function render() {
  ctx.save();
  if (shakeT > 0) {
    ctx.translate((Math.random() - 0.5) * shakeT * 0.6, (Math.random() - 0.5) * shakeT * 0.6);
  }

  if (state.mode === 'title') drawTitle();
  else if (state.mode === 'levelselect') drawLevelSelect();
  else if (state.mode === 'skins') drawSkinsScreen();
  else if (state.mode === 'levelcomplete') drawLevelComplete();
  else if (state.mode === 'champion') drawChampion();
  else if (state.mode === 'play') {
    drawBackground(performance.now());
    drawHorizonGlow();

    // painter's order: far to near among platforms, checkpoints, rings, goal & the ball
    const drawables = [];
    drawables.push({ z: level.goal.z, fn: drawGoal });
    for (const p of level.platforms) drawables.push({ z: p.z + p.hz, fn: () => drawPlatform(p) });
    for (const c of level.checkpoints) drawables.push({ z: c.z, fn: () => drawCheckpointPad(c) });
    for (const r of level.rings) drawables.push({ z: r.z, fn: () => drawRing(r) });
    drawables.push({ z: player.z, fn: drawPlayer });
    drawables.sort((a, b) => b.z - a.z);
    for (const d of drawables) d.fn();

    drawParticles();
    drawHUD();
  }

  ctx.restore();

  if (flashT > 0) {
    ctx.save();
    ctx.globalAlpha = (flashT / 10) * 0.35;
    ctx.fillStyle = '#ff5c5c';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

requestAnimationFrame(loop);
</script>
</body>
</html>

      ctx.beginPath(); ctx.ellipse(0, -r * 0.14, r * 0.32, r * 0.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // beady red eyes
      ctx.fillStyle = '#d8283c';
      ctx.beginPath(); ctx.arc(-r * 0.13, -r * 0.16, r * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.13, -r * 0.16, r * 0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a0810';
      ctx.beginPath(); ctx.arc(-r * 0.13, -r * 0.16, r * 0.02, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.13, -r * 0.16, r * 0.02, 0, Math.PI * 2); ctx.fill();
      // prominent buck teeth
      ctx.fillStyle = '#fdfdf6';
      ctx.fillRect(-r * 0.07, r * 0.0, r * 0.06, r * 0.1);
      ctx.fillRect(r * 0.01, r * 0.0, r * 0.06, r * 0.1);
      ctx.strokeStyle = '#c9c9cf'; ctx.lineWidth = Math.max(1, r * 0.015);
      ctx.strokeRect(-r * 0.07, r * 0.0, r * 0.06, r * 0.1);
      ctx.strokeRect(r * 0.01, r * 0.0, r * 0.06, r * 0.1);
      // sneering brow
      ctx.strokeStyle = '#7a7a85'; ctx.lineWidth = Math.max(1, r * 0.04);
      ctx.beginPath(); ctx.moveTo(-r * 0.22, -r * 0.28); ctx.lineTo(-r * 0.05, -r * 0.22);
      ctx.moveTo(r * 0.22, -r * 0.3); ctx.lineTo(r * 0.08, -r * 0.2); ctx.stroke();
      break;
    }
    case 'leroy': {
      const RED = '#c94038', DRED = '#7e241f';
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.ellipse(0, r * 0.62, r * 0.72, r * 0.48, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // angular, sharply swept-back ears (meaner than Stitch/Angel)
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(s * r * 0.4, -r * 0.4); ctx.rotate(s * 1.5);
        ctx.fillStyle = RED;
        ctx.beginPath(); ctx.ellipse(0, -r * 0.3, r * 0.12, r * 0.34, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();

      ctx.beginPath(); ctx.ellipse(0, -r * 0.14, r * 0.42, r * 0.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // darker red marking stripe near the eyes

      ctx.beginPath(); ctx.ellipse(-r * 0.22, -r * 0.28, r * 0.14, r * 0.05, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.22, -r * 0.28, r * 0.14, r * 0.05, 0.3, 0, Math.PI * 2); ctx.fill();
      // black angular eyes (not white ovals) + heavy brows
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(-r * 0.15, -r * 0.14, r * 0.08, r * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.15, -r * 0.14, r * 0.08, r * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = DRED; ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.beginPath(); ctx.moveTo(-r * 0.28, -r * 0.24); ctx.lineTo(-r * 0.06, -r * 0.16);
      ctx.moveTo(r * 0.28, -r * 0.24); ctx.lineTo(r * 0.06, -r * 0.16); ctx.stroke();
      // mean, angular scowl
      ctx.beginPath(); ctx.moveTo(-r * 0.16, r * 0.06); ctx.lineTo(0, r * 0.0); ctx.lineTo(r * 0.16, r * 0.06); ctx.stroke();
      break;
    }
    case 'reuben': {
      const GOLD = '#e0b13e', DGOLD = '#a67c20';
      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.ellipse(0, r * 0.62, r * 0.76, r * 0.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // short, droopy relaxed ears
      for (const s of [-1, 1]) {
        ctx.save(); ctx.translate(s * r * 0.38, -r * 0.36); ctx.rotate(s * 0.85);
        ctx.fillStyle = GOLD;
        ctx.beginPath(); ctx.ellipse(0, -r * 0.16, r * 0.14, r * 0.22, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      // chubby face

      ctx.beginPath(); ctx.ellipse(0, -r * 0.08, r * 0.48, r * 0.42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // droopy lazy half-lidded eyes

      ctx.beginPath(); ctx.ellipse(r * 0.18, -r * 0.1, r * 0.11, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = DGOLD;
      ctx.beginPath(); ctx.ellipse(-r * 0.18, -r * 0.14, r * 0.12, r * 0.06, 0, Math.PI, Math.PI * 2); ctx.fill(); // droopy lid
      ctx.beginPath(); ctx.ellipse(r * 0.18, -r * 0.14, r * 0.12, r * 0.06, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2b2013';
      ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.08, r * 0.045, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.18, -r * 0.08, r * 0.045, 0, Math.PI * 2); ctx.fill();
      // relaxed grin
      ctx.strokeStyle = DGOLD; ctx.lineWidth = Math.max(1, r * 0.045);
      ctx.beginPath(); ctx.arc(0, r * 0.06, r * 0.14, 0.3, Math.PI - 0.3); ctx.stroke();
      // small sandwich motif at the shoulder
      ctx.fillStyle = '#e8c98a';
      roundRect(r * 0.44, r * 0.44, r * 0.28, r * 0.14, r * 0.04); ctx.fill();
      ctx.fillStyle = '#7fae4a';
      ctx.fillRect(r * 0.46, r * 0.49, r * 0.24, r * 0.04);
      ctx.strokeStyle = DGOLD; ctx.lineWidth = Math.max(1, r * 0.02);

      ctx.fillStyle = '#94a3b8';

    }
  }
  ctx.restore();
  // crisp rim to frame the bust against the card
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.97, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// draws an original code-drawn faction crest — Heroes-style shield framing with an
// emblem in the faction's colours (no traced or copyrighted assets)
function drawShieldPath(r) {
  ctx.beginPath();
  ctx.moveTo(-r * 0.86, -r * 0.5);
  ctx.quadraticCurveTo(-r * 0.86, -r * 1.02, 0, -r * 1.02);
  ctx.quadraticCurveTo(r * 0.86, -r * 1.02, r * 0.86, -r * 0.5);
  ctx.quadraticCurveTo(r * 0.86, r * 0.32, 0, r * 1.02);
  ctx.quadraticCurveTo(-r * 0.86, r * 0.32, -r * 0.86, -r * 0.5);
  ctx.closePath();
}
function drawFactionCrest(fac, cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  const primary = fac.primary, secondary = fac.secondary;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  drawShieldPath(r); ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.09);
  ctx.strokeStyle = primary;
  drawShieldPath(r * 0.94); ctx.stroke();
  ctx.save();
  drawShieldPath(r * 0.88);
  ctx.clip();
  switch (fac.id) {
    case 'ohana': {
      // hibiscus flower + surfboard motif
      ctx.save(); ctx.translate(r * 0.42, 0); ctx.rotate(-0.15);
      ctx.fillStyle = secondary;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.14, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = primary; ctx.lineWidth = Math.max(1, r * 0.03);
      ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.lineTo(0, r * 0.5); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.translate(-r * 0.16, -r * 0.02);
      ctx.fillStyle = primary;
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2 - Math.PI / 2;
        ctx.save(); ctx.rotate(a);
        ctx.beginPath(); ctx.ellipse(0, -r * 0.32, r * 0.16, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = secondary;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      break;
    }
    case 'federation': {
      // starship insignia: swept delta with a porthole
      ctx.fillStyle = primary;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.68); ctx.lineTo(r * 0.58, r * 0.5); ctx.lineTo(0, r * 0.22); ctx.lineTo(-r * 0.58, r * 0.5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = secondary; ctx.lineWidth = Math.max(1, r * 0.04); ctx.stroke();
      ctx.fillStyle = secondary;
      ctx.beginPath(); ctx.arc(0, -r * 0.12, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = primary;
      ctx.beginPath(); ctx.arc(0, -r * 0.12, r * 0.13, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'experiments': {
      // DNA helix + experiment pod motif
      ctx.strokeStyle = primary; ctx.lineWidth = Math.max(1, r * 0.08); ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = -5; i <= 5; i++) ctx.lineTo(Math.sin(i * 0.6) * r * 0.3, i * r * 0.11);
      ctx.stroke();
      ctx.beginPath();
      for (let i = -5; i <= 5; i++) ctx.lineTo(-Math.sin(i * 0.6) * r * 0.3, i * r * 0.11);
      ctx.strokeStyle = secondary; ctx.stroke();
      ctx.fillStyle = secondary;
      for (let i = -4; i <= 4; i += 2) {
        ctx.beginPath(); ctx.arc(Math.sin(i * 0.6) * r * 0.3, i * r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = primary;
      for (let i = -4; i <= 4; i += 2) {
        ctx.beginPath(); ctx.arc(-Math.sin(i * 0.6) * r * 0.3, i * r * 0.11, r * 0.06, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'hamsterviel': {
      // cog ring around a small snarling hamster-skull face
      ctx.strokeStyle = secondary; ctx.lineWidth = Math.max(1, r * 0.1);
      ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = secondary;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        ctx.save(); ctx.rotate(a);
        ctx.fillRect(-r * 0.05, -r * 0.78, r * 0.1, r * 0.18);
        ctx.restore();
      }
      ctx.fillStyle = '#f4f4f6';
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.36, r * 0.34, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = primary;
      ctx.beginPath(); ctx.arc(-r * 0.14, -r * 0.06, r * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.14, -r * 0.06, r * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fdfdf6';
      ctx.fillRect(-r * 0.08, r * 0.08, r * 0.07, r * 0.14);
      ctx.fillRect(r * 0.01, r * 0.08, r * 0.07, r * 0.14);
      break;
    }
  }
  ctx.restore();
  ctx.restore();
}

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
}
function drawIslandBackdrop() {
  ctx.save();
  const g = ctx.createRadialGradient(W / 2, H * 0.4, 20, W / 2, H * 0.4, W * 0.7);
  g.addColorStop(0, '#2f7fc7'); g.addColorStop(1, '#0d2138');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ============================================================
// CAMPAIGN — STAGE 2
// ============================================================
// Data model summary (see report to George for the long version):
//  - CAMPAIGN_KEY in localStorage holds { unlocked:[bool x5], completed:[bool x5], carry:{...}|null }
//    — this is the ONLY campaign state that survives a reload; a mission in progress does not
//    (mid-duel saves still use SAVE_KEY and are untouched by any of this).
//  - `carry` is the HOMM2-style hand-off between missions: the primary hero's level/xp/attributes/
//    skills/spells/artifacts, plus up to one creature stack (capped) that follows them into the
//    next mission, plus a small cumulative resource stipend for every mission already completed.
//  - `game.objective` is the live, per-mission goal: { type, progress, target, ... } — see
//    checkMissionOutcome() for the five types and missionObjectiveHudText() for the HUD text.
//  - Player 0 is always the human; player 1 is always the campaign AI (isAIPlayer()). This reuses
//    the existing 2-owner engine as-is: "several enemy heroes" / "all enemy castles" just means
//    player 1 owns more than one hero/castle — no new owner slots were needed.

const CAMPAIGN_KEY = 'heroesOhanaCampaign';
function defaultCampaignProgress() {
  return { unlocked: [true, false, false, false, false], completed: [false, false, false, false, false], carry: null };
}
function loadCampaignProgress() {
  try {
    const raw = localStorage.getItem(CAMPAIGN_KEY);
    if (!raw) return defaultCampaignProgress();
    return Object.assign(defaultCampaignProgress(), JSON.parse(raw));
  } catch (e) { return defaultCampaignProgress(); }
}
function saveCampaignProgress(cp) {
  try { localStorage.setItem(CAMPAIGN_KEY, JSON.stringify(cp)); } catch (e) {}
}
let campaignProgress = loadCampaignProgress();

// ---- static mission definitions (story/objective text + setup parameters) ----
const MISSIONS = [
  { id: 0, nameKey: 'mission1Name', objKey: 'mission1Obj', storyKey: 'mission1Story', seed: 910001,
    aiFaction: 'federation', aiCastles: 1, aiHeroes: 1, monsterMul: 0.35, aiTownHallLevel: 1,
    objectiveType: 'captureCastle' },
  { id: 1, nameKey: 'mission2Name', objKey: 'mission2Obj', storyKey: 'mission2Story', seed: 910002,
    aiFaction: 'experiments', aiCastles: 1, aiHeroes: 1, monsterMul: 0.7, aiTownHallLevel: 1,
    objectiveType: 'collectN', podCount: 6 },
  { id: 2, nameKey: 'mission3Name', objKey: 'mission3Obj', storyKey: 'mission3Story', seed: 910003,
    aiFaction: 'federation', aiCastles: 1, aiHeroes: 1, monsterMul: 0.5, aiTownHallLevel: 2,
    objectiveType: 'surviveN', surviveTurns: 10, waveInterval: 2 },
  { id: 3, nameKey: 'mission4Name', objKey: 'mission4Obj', storyKey: 'mission4Story', seed: 910004,

    objectiveType: 'defeatAllHeroes', lairInterval: 3 },
  { id: 4, nameKey: 'mission5Name', objKey: 'mission5Obj', storyKey: 'mission5Story', seed: 910005,
    aiFaction: 'hamsterviel', aiCastles: 3, aiHeroes: 2, monsterMul: 1, aiTownHallLevel: 2,
    aiDwellings: [1, 2], objectiveType: 'captureAllCastles' },
];

const START_BONUSES = ['resources', 'creatures', 'artifact'];

function applyStartBonus(hero, player, bonusId, mission) {
  if (bonusId === 'resources') {
    player.resources.gold += 2500; player.resources.wood += 10; player.resources.ore += 10;
  } else if (bonusId === 'creatures') {
    if (!addToArmy(hero, hero.factionId, 2, 6, false)) player.resources.gold += 1200; // army full: fall back to gold
  } else if (bonusId === 'artifact') {
    const art = ARTIFACT_DEFS[mission.id % ARTIFACT_DEFS.length];
    if (!hero.artifacts.includes(art.id)) { hero.artifacts.push(art.id); hero[art.attr] += art.amount; }
  }
}

// carries the primary hero's growth (level/xp/attributes/skills/spells/artifacts) and up to
// one creature stack (capped at 8 units) into the next mission; also grants a small cumulative
// resource stipend for every mission already completed (documented rule, kept simple on purpose)
function buildCarrySnapshot(hero, completedCount) {
  const bestStack = hero.army.filter(s => s).sort((a, b) => creatureRef(b).tier - creatureRef(a).tier)[0];
  return {
    level: hero.level, xp: hero.xp,
    attack: hero.attack, defense: hero.defense, spellPower: hero.spellPower, knowledge: hero.knowledge,
    skills: JSON.parse(JSON.stringify(hero.skills)), spells: hero.spells.slice(), artifacts: hero.artifacts.slice(),
    stack: bestStack ? { factionId: bestStack.factionId, tier: bestStack.tier, count: Math.min(8, bestStack.count), upgraded: bestStack.upgraded } : null,
    completedCount: completedCount,
  };
}
function applyCarryOver(hero, player) {
  const c = campaignProgress.carry;
  if (!c) return;
  hero.level = Math.max(hero.level, c.level); hero.xp = Math.max(hero.xp, c.xp);
  hero.attack = Math.max(hero.attack, c.attack); hero.defense = Math.max(hero.defense, c.defense);
  hero.spellPower = Math.max(hero.spellPower, c.spellPower); hero.knowledge = Math.max(hero.knowledge, c.knowledge);
  for (const s of c.skills) if (!hero.skills.some(hs => hs.id === s.id)) hero.skills.push(s);
  for (const sp of c.spells) if (!hero.spells.includes(sp)) hero.spells.push(sp);
  for (const a of c.artifacts) if (!hero.artifacts.includes(a)) hero.artifacts.push(a);
  if (c.stack && armyFreeSlot(hero)) addToArmy(hero, c.stack.factionId, c.stack.tier, c.stack.count, c.stack.upgraded);
  const stipend = (c.completedCount || 0) * 500;
  if (player) { player.resources.gold += stipend; player.resources.wood += (c.completedCount || 0) * 2; }
}

// ============ MISSION SETUP ============
function setupMission(missionIdx, bonusId) {
  const m = MISSIONS[missionIdx];
  nextId = 1;
  game.mode = 'campaign';
  game.campaignMissionIdx = missionIdx;
  game.terrain = generateMap(m.seed);
  game.objects = [];
  game.players = [makePlayer(0, 'ohana'), makePlayer(1, m.aiFaction)];
  game.players[0].fog = makeFogGrid();
  game.players[1].fog = makeFogGrid();
  game.turn = { playerIdx: 0, day: 1, week: 1 };
  game.victor = null;
  game.combat = null;
  game.selectedHeroId = null;

  // always start the human on the map's largest landmass — never on one of
  // generateMap's rare single-tile disconnected specks (see largestLandComponent)
  const mainland = largestLandComponent();
  const p0 = pickLandTileFromSet(mainland, 'grass');
  const castle0src = makeCastle('ohana', 'Home Castle', p0.x, p0.y, 0);
  game.objects.push(Object.assign({ kind: OBJ.CASTLE }, castle0src));
  game.players[0].castles.push(castle0src.id);
  const heroSpot0 = findAdjacentFreeTile(p0.x, p0.y) || p0;
  const heroDef0 = factionById('ohana').heroes[0];
  const hero0 = makeHero('ohana', heroDef0, heroSpot0.x, heroSpot0.y, 0);
  hero0.army[0] = makeCreatureStack('ohana', 1, 10);
  hero0.army[1] = makeCreatureStack('ohana', 2, 4);
  applyCarryOver(hero0, game.players[0]);
  hero0.movePtsMax = heroMovePtsMax(hero0); hero0.movePts = hero0.movePtsMax;
  hero0.spellPtsMax = heroSpellPtsMax(hero0); hero0.spellPts = hero0.spellPtsMax;
  game.players[0].heroes.push(hero0);
  game.cameraByPlayer[0] = { x: p0.x, y: p0.y };

  const aiCastleSpots = pickDistantLandSpots([p0], m.aiCastles, 12);
  const aiCastleObjs = [];
  aiCastleSpots.forEach((s, i) => {
    const c = makeCastle(m.aiFaction, 'Enemy Castle ' + (i + 1), s.x, s.y, 1);
    for (let lvl = 1; lvl <= (m.aiTownHallLevel || 1); lvl++) c.buildings.townHall = lvl;
    if (m.aiDwellings) m.aiDwellings.forEach(tier => { c.buildings['dwelling' + tier] = 1; c.dwellingCounts[tier] = factionById(m.aiFaction).creatures[tier - 1].growth; });
    const obj = Object.assign({ kind: OBJ.CASTLE }, c);
    game.objects.push(obj);
    game.players[1].castles.push(c.id);
    aiCastleObjs.push(obj);
  });
  game.players[1].resources = startingResources();
  game.players[1].resources.gold += m.aiTownHallLevel * 1500;

  for (let i = 0; i < (m.aiHeroes || 1); i++) {
    const cs = aiCastleSpots[i % aiCastleSpots.length];
    const hs = findAdjacentFreeTile(cs.x, cs.y) || cs;
    const facDef = factionById(m.aiFaction);
    const hd = facDef.heroes[(i + 1) % facDef.heroes.length];
    const h = makeHero(m.aiFaction, hd, hs.x, hs.y, 1);
    h.army[0] = makeCreatureStack(m.aiFaction, 1, 5 + missionIdx * 2);
    h.army[1] = makeCreatureStack(m.aiFaction, 2, 2 + missionIdx);
    h.movePtsMax = heroMovePtsMax(h); h.movePts = h.movePtsMax;
    h.spellPtsMax = heroSpellPtsMax(h); h.spellPts = h.spellPtsMax;
    game.players[1].heroes.push(h);
  }

  placeMapObjects({ monsterMul: m.monsterMul != null ? m.monsterMul : 1 });

  const reachableFromHome = floodFillLand(p0);
  game.objective = null;
  if (m.objectiveType === 'captureCastle') {
    game.objective = { type: 'captureCastle', targetCastleId: aiCastleObjs[0].id };
  } else if (m.objectiveType === 'collectN') {
    const pods = [];
    for (let i = 0; i < m.podCount; i++) {
      const s = findFreeLandTile({ minCastleDist: 2, reachable: reachableFromHome });
      if (!s) continue;
      game.objects.push({ id: genId(), kind: OBJ.POD, x: s.x, y: s.y });
      pods.push(s);
      if (i % 2 === 1) {
        const g = findAdjacentFreeTile(s.x, s.y);
        if (g && !objectAt(g.x, g.y)) game.objects.push({ id: genId(), kind: OBJ.MONSTER, x: g.x, y: g.y, stack: makeCreatureStack(m.aiFaction, 1 + (i % 2), 4 + i) });
      }
    }
    game.objective = { type: 'collectN', progress: 0, target: m.podCount };
  } else if (m.objectiveType === 'surviveN') {
    game.objective = { type: 'surviveN', progress: 0, target: m.surviveTurns, untilDay: 1 + m.surviveTurns, waveInterval: m.waveInterval || 2, mustHoldCastleId: castle0src.id };
  } else if (m.objectiveType === 'defeatAllHeroes') {
    const lairSpot = findFreeLandTile({ minCastleDist: 2, reachable: reachableFromHome }) || aiCastleSpots[0];
    const lairObj = { id: genId(), kind: OBJ.LAIR, x: lairSpot.x, y: lairSpot.y };
    game.objects.push(lairObj);
    game.objective = { type: 'defeatAllHeroes', lairId: lairObj.id, lairActive: true, lairInterval: m.lairInterval || 3, lairTimer: 0, lairSpot };
  } else if (m.objectiveType === 'captureAllCastles') {
    game.objective = { type: 'captureAllCastles' };
  }

  applyStartBonus(hero0, game.players[0], bonusId, m);

  for (let i = 0; i < 2; i++) recomputeFog(i);
  game.screen = 'adventure';
  centerCameraOnCastle(0);
  if (missionIdx === 0) showMessage(t(m.nameKey), t('mission1Tutorial'), [{ label: t('ok') }]);
}

// ============ OBJECTIVE / DEFEAT FRAMEWORK ============
function checkMissionOutcome() {
  if (game.screen === 'victory' || game.screen === 'missionOutro' || game.screen === 'missionDefeat') return true;
  const obj = game.objective;
  if (!obj) return false;
  const human = game.players[0], ai = game.players[1];
  let victory = false;
  switch (obj.type) {
    case 'captureCastle': {
      const target = game.objects.find(o => o.id === obj.targetCastleId);
      victory = !target || target.ownerIdx === 0;
      break;
    }
    case 'collectN': victory = obj.progress >= obj.target; break;
    case 'surviveN': victory = game.turn.day > obj.untilDay; break;
    case 'defeatAllHeroes': victory = ai.heroes.length === 0 && !obj.lairActive; break;
    case 'captureAllCastles': {
      const aiCastles = game.objects.filter(o => o.kind === OBJ.CASTLE && o.ownerIdx === 1);
      victory = aiCastles.length === 0;
      break;
    }
  }
  if (victory) { missionVictory(); return true; }
  let defeat = human.heroes.length === 0 && human.castles.length === 0;
  if (obj.type === 'surviveN' && obj.mustHoldCastleId) {
    const c = game.objects.find(o => o.id === obj.mustHoldCastleId);
    if (!c || c.ownerIdx !== 0) defeat = true;
  }
  if (defeat) { missionDefeat(); return true; }
  return false;
}

function missionVictory() {
  const idx = game.campaignMissionIdx;
  campaignProgress.completed[idx] = true;
  if (idx + 1 < MISSIONS.length) campaignProgress.unlocked[idx + 1] = true;
  const hero = game.players[0].heroes[0];
  if (hero) {
    const completedCount = campaignProgress.completed.filter(Boolean).length;
    campaignProgress.carry = buildCarrySnapshot(hero, completedCount);
  }
  saveCampaignProgress(campaignProgress);
  sfx.victory();
  game.screen = 'missionOutro';
}
function missionDefeat() {
  sfx.defeatSting();
  game.screen = 'missionDefeat';
}

function missionObjectiveHudText() {
  const obj = game.objective;
  if (!obj) return '';
  switch (obj.type) {
    case 'captureCastle': return t('missionObjectiveLabel') + ': ' + t('castleTargetProgress');
    case 'collectN': return t('missionObjectiveLabel') + ': ' + t('collectProgress', { n: obj.progress, total: obj.target });
    case 'surviveN': return t('missionObjectiveLabel') + ': ' + t('surviveProgress', { n: Math.min(obj.target, game.turn.day - 1), total: obj.target });
    case 'defeatAllHeroes': return t('missionObjectiveLabel') + ': ' + t('heroesLeftProgress', { n: game.players[1].heroes.length });
    case 'captureAllCastles': return t('missionObjectiveLabel') + ': ' + t('castlesLeftProgress', { n: game.objects.filter(o => o.kind === OBJ.CASTLE && o.ownerIdx === 1).length });
    default: return '';
  }
}

// runs once per new day (i.e. once per full player-0-then-player-1 round) — spawns Mission 3's
// attacker waves and ticks Mission 4's lair respawn timer
function missionOnTurnStart(nextIdx) {
  const obj = game.objective;
  if (!obj || nextIdx !== 0 || game.turn.day <= 1) return;
  if (obj.type === 'surviveN' && obj.waveInterval && (game.turn.day - 1) % obj.waveInterval === 0) {
    spawnWaveAttacker();
  }
  if (obj.type === 'defeatAllHeroes' && obj.lairActive) {
    obj.lairTimer = (obj.lairTimer || 0) + 1;
    if (obj.lairTimer >= obj.lairInterval && game.players[1].heroes.length < 4) {
      obj.lairTimer = 0;
      spawnWeakAIHero(obj.lairSpot.x, obj.lairSpot.y, MISSIONS[game.campaignMissionIdx].aiFaction);
    }
  }
}

// spawns a fresh, deliberately weak AI hero near (x,y) — used by both Mission 3's wave
// timer (spawning near the human's castle) and Mission 4's lair (spawning at the lair)
function spawnWeakAIHero(x, y, factionId) {
  const spot = findAdjacentFreeTile(x, y) || { x, y };
  const facDef = factionById(factionId);
  const hd = facDef.heroes[Math.floor(Math.random() * facDef.heroes.length)];
  const h = makeHero(factionId, hd, spot.x, spot.y, 1);
  h.army[0] = makeCreatureStack(factionId, 1, 3 + Math.floor(Math.random() * 3));
  h.movePtsMax = heroMovePtsMax(h); h.movePts = h.movePtsMax;
  h.spellPtsMax = heroSpellPtsMax(h); h.spellPts = h.spellPtsMax;

}
function spawnWaveAttacker() {
  const homeCastleId = game.objective.mustHoldCastleId;
  const c = game.objects.find(o => o.id === homeCastleId);

  spawnWeakAIHero(s.x, s.y, MISSIONS[game.campaignMissionIdx].aiFaction);
}

// ============ SIMPLE AI OPPONENT ============
// A modest, readable computer player: each of its heroes picks the single nearest
// worthwhile target (a free pickup, else the human) and marches at it once per turn —
// tryMoveHeroToward() already spends all remaining movement points in one call and
// resolves any combat encountered along the way, so there is no inner loop here that
// could spin forever. Castle upkeep (build one thing, recruit what it can afford) runs
// after all heroes have acted. Every loop below is bounded by a fixed array length, so
// an AI turn always terminates in O(heroes + castles) steps — no unbounded recursion.
function aiHeroTargetableObjects() {
  return [OBJ.MINE, OBJ.RESOURCE, OBJ.CHEST, OBJ.ARTIFACT, OBJ.DWELLING, OBJ.POD];
}
// tiered priority: (1) an enemy hero close enough to threaten/be threatened this turn is
// always attacked first — a sensible AI does not wander off for gold while standing next
// to the human; (2) otherwise grab the nearest free economic pickup; (3) otherwise march
// on the human's nearest hero, or failing that their nearest castle
const AI_ENGAGE_RANGE = 4;
function aiPickHeroTarget(hero) {
  const aiIdx = hero.ownerIdx, humanIdx = aiIdx === 1 ? 0 : 1;
  const human = game.players[humanIdx];
  let nearestHero = null, nearestHeroD = Infinity;
  for (const h of human.heroes) {
    const d = Math.max(Math.abs(hero.x - h.x), Math.abs(hero.y - h.y));
    if (d < nearestHeroD) { nearestHeroD = d; nearestHero = h; }
  }
  if (nearestHero && nearestHeroD <= AI_ENGAGE_RANGE) return nearestHero;

  let best = null, bestD = Infinity;
  const pickupKinds = aiHeroTargetableObjects();
  for (const o of game.objects) {
    if (!pickupKinds.includes(o.kind)) continue;
    if (o.kind === OBJ.MINE && o.owner === aiIdx) continue;
    const d = Math.max(Math.abs(hero.x - o.x), Math.abs(hero.y - o.y));
    if (d < bestD) { bestD = d; best = o; }
  }
  if (best && bestD <= 14) return best;

  if (nearestHero) return nearestHero;
  for (const cid of human.castles) {
    const c = game.objects.find(o => o.id === cid);
    if (!c) continue;
    const d = Math.max(Math.abs(hero.x - c.x), Math.abs(hero.y - c.y));
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}
// returns true if the move triggered a combat that is now waiting on human input
// (i.e. the AI turn must pause here — see aiTakeTurn)
function aiActHero(hero) {
  if (!hero || hero.movePts <= 0) return false;
  const target = aiPickHeroTarget(hero);
  if (!target) return false;
  tryMoveHeroToward(hero, target.x, target.y);
  if (game.screen === 'combat') return true; // waiting on human input — see aiTakeTurn
  if (game.screen === 'combatResult') {
    // combat fully resolved without any human side involved (e.g. AI hero vs a wild
    // monster, or AI vs AI) — nobody is going to click "continue", so do it for them
    game.combat = null; game.screen = 'adventure';
  }
  return false;
}
function aiCastleActions(player) {
  const buildOrder = ['dwelling1', 'dwelling2', 'townHall', 'dwelling3', 'mageGuild', 'dwelling4', 'dwelling5', 'cityWalls'];
  for (const cid of player.castles.slice()) {
    const castle = game.objects.find(o => o.id === cid);
    if (!castle) continue;
    if (!castle.builtThisTurn) {
      for (const bid of buildOrder) {
        const chk = canBuild(castle, bid);
        if (chk.ok) { buildInCastle(castle, bid); break; }
      }
    }
    const holder = heroAtCastle(castle);
    for (let tier = 1; tier <= 5; tier++) {
      const avail = castleAvailableToRecruit(castle, tier);
      if (avail <= 0) continue;
      const fac = factionById(castle.factionId);
      const cost = fac.creatures[tier - 1].cost;
      let n = avail;
      while (n > 0) {
        let afford = true;
        for (const k in cost) if ((player.resources[k] || 0) < cost[k] * n) afford = false;
        if (afford) break;
        n--;
      }
      if (n > 0) {
        if (holder) recruitFromCastle(castle, holder, tier, n);
        else recruitIntoGarrison(castle, tier, n);
      }
    }
  }
}
// drives a full AI turn; bounded by the AI's own (finite) heroes/castles arrays.
// If an AI-initiated attack lands on a human hero, combat pauses for interactive human
// defense (combatSideIsAI leaves the human's side human-controlled) — the AI turn then
// stops early and is concluded from the combatResult "continue" button instead.
function aiTakeTurn(aiIdx) {
  const p = game.players[aiIdx];
  const heroes = p.heroes.slice();
  for (const hero of heroes) {
    if (!findHeroById(hero.id)) continue; // hero died earlier this same turn
    const pausedForHuman = aiActHero(hero);
    if (pausedForHuman) return; // wait for the human to resolve combat; see aiCastleActions note below
    if (checkVictory()) return; // mission ended mid-turn (e.g. AI captured the human's last castle)
  }
  aiCastleActions(p);
  endTurn();
}

    ctx.fillText(heroDef.name, tx, y + cardH * 0.24);
    ctx.font = '600 ' + Math.round(Math.min(12, cardH * 0.14)) + 'px sans-serif';
    ctx.fillStyle = '#ead9b8';
    const statsLine1 = t('attack') + ' ' + heroDef.attack + '  ' + t('defense') + ' ' + heroDef.defense;
    const statsLine2 = t('spellPower') + ' ' + heroDef.spellPower + '  ' + t('knowledge') + ' ' + heroDef.knowledge;
    ctx.fillText(statsLine1, tx, y + cardH * 0.5);
    ctx.fillText(statsLine2, tx, y + cardH * 0.68);
    ctx.fillStyle = '#fde68a';
    const skillLvlName = [t('basic'), t('advanced'), t('expert')][(heroDef.skill.level || 1) - 1];
    ctx.fillText(SKILL_DEFS[heroDef.skill.id].name + ' (' + skillLvlName + ')', tx, y + cardH * 0.86);
    addButton(x, y, cardW, cardH, () => { initAudio(); sfx.click(); pickHeroForPlayer(i); });
  });
  const backY = startY + n * (cardH + gap) + 4;
  drawButton(W / 2 - 80, backY, 160, 42, t('back'), '#94a3b8', '#475569', () => { game.screen = 'factionPick'; });
}
function pickHeroForPlayer(heroIdx) {
  const setup = game.pendingSetup;
  setup.picks[setup.playerIdx].heroIdx = heroIdx;
  if (setup.playerIdx === 0) {
    setup.playerIdx = 1;
    game.screen = 'factionPick';
  } else {
    const factionIds = setup.picks.map(p => p.factionId);
    const heroIdxs = setup.picks.map(p => p.heroIdx);
    startNewDuel(factionIds, heroIdxs);
  }
}

// ============================================================
// SCREEN: ADVENTURE MAP
// ============================================================
let mapTileSize = 32;
// campaign mode reserves a second HUD strip under the resource bar for the mission
// objective + progress readout; duel mode keeps the original 46px-tall bar only.
function resourceBarH() { return (game.mode === 'campaign' && game.objective) ? 68 : 46; }

function computeTileSize() {
  const topBar = chromeMetrics().topBar;
  const usableH = H - topBar - (resourceBarH() + 44); // minus resource bar (+objective strip) + bottom panel
  const usableW = W;
  return Math.max(18, Math.min(44, Math.min(usableW / 9, usableH / 8)));
}

// ---- camera: game.camera.{x,y} is the tile the viewport is centered on ----
function centerCameraOn(x, y) { game.camera = { x, y }; }
function centerCameraOnHero(hero) { if (hero) centerCameraOn(hero.x, hero.y); }
function centerCameraOnCastle(playerIdx) {
  const p = game.players[playerIdx];
  if (!p) return;
  const cid = p.castles[0];
  const c = cid !== undefined ? game.objects.find(o => o.id === cid) : null;
  if (c) centerCameraOn(c.x, c.y);
}
// clamp the camera so the viewport never scrolls past the map edges
function clampCamera() {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize || 1;
  const viewTilesX = W / size;
  const viewTilesY = (H - topBar - resourceBarH() - 44) / size;
  const halfX = viewTilesX / 2, halfY = viewTilesY / 2;
  let minX = halfX, maxX = MAP_SIZE - halfX;
  let minY = halfY, maxY = MAP_SIZE - halfY;
  if (minX > maxX) { minX = maxX = MAP_SIZE / 2; }
  if (minY > maxY) { minY = maxY = MAP_SIZE / 2; }
  game.camera.x = Math.max(minX, Math.min(maxX, game.camera.x));
  game.camera.y = Math.max(minY, Math.min(maxY, game.camera.y));
}

function worldToScreen(tx, ty) {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize;
  const rbH = resourceBarH();
  const originX = W / 2 - game.camera.x * size;
  const originY = topBar + rbH + (H - topBar - rbH - 44) / 2 - game.camera.y * size;
  return { x: originX + tx * size, y: originY + ty * size };
}
function screenToWorld(sx, sy) {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize;
  const rbH = resourceBarH();
  const originX = W / 2 - game.camera.x * size;
  const originY = topBar + rbH + (H - topBar - rbH - 44) / 2 - game.camera.y * size;
  return { x: (sx - originX) / size, y: (sy - originY) / size };
}

function objIcon(obj) {
  switch (obj.kind) {
    case OBJ.MINE: return RESOURCE_ICON[obj.resType] || '⛏️';
    case OBJ.RESOURCE: return RESOURCE_ICON[obj.resType] || '📦';
    case OBJ.CHEST: return '🎁';
    case OBJ.ARTIFACT: return '🏺';
    case OBJ.DWELLING: return '🏠';
    case OBJ.MONSTER: return '⚔️';
    case OBJ.CASTLE: return '🏰';
    case OBJ.POD: return '🧪';
    case OBJ.LAIR: return '🛸';
    default: return '❓';
  }
}

function renderAdventure() {
  mapTileSize = computeTileSize();
  clampCamera();
  const topBar = chromeMetrics().topBar;
  ctx.fillStyle = '#08131f';
  ctx.fillRect(0, 0, W, H);
  const p = currentPlayer();
  const size = mapTileSize;
  const rbH = resourceBarH();
  // visible tile range
  const tl = screenToWorld(0, topBar + rbH);
  const br = screenToWorld(W, H - 44);
  const x0 = Math.max(0, Math.floor(tl.x) - 1), x1 = Math.min(MAP_SIZE - 1, Math.ceil(br.x) + 1);
  const y0 = Math.max(0, Math.floor(tl.y) - 1), y1 = Math.min(MAP_SIZE - 1, Math.ceil(br.y) + 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, topBar + rbH, W, H - topBar - rbH - 44); ctx.clip();
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const fogState = p.fog[y][x];
      if (fogState === 0) continue;
      const terr = TERRAIN[game.terrain[y][x]];
      const s = worldToScreen(x, y);
      ctx.fillStyle = terr.color;
      ctx.fillRect(s.x, s.y, size, size);
      if (fogState === 1) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(s.x, s.y, size, size); }
    }
  }
  // objects: static ones stay drawn on explored (fog 1) tiles, dimmed as "remembered, not
  // currently seen" (HOMM-style). Monster stacks are only shown while in view (fog 2) since
  // they can be beaten or wander off; enemy heroes (below) are also visible-only.
  const canDim = typeof ctx.filter === 'string';
  for (const obj of game.objects) {
    if (obj.x < x0 - 1 || obj.x > x1 + 1 || obj.y < y0 - 1 || obj.y > y1 + 1) continue;
    const fs = p.fog[obj.y][obj.x];
    if (fs === 0) continue;
    if (fs !== 2 && obj.kind === OBJ.MONSTER) continue;
    const remembered = fs === 1;
    const s = worldToScreen(obj.x, obj.y);
    // owner colour: castles use ownerIdx, mines use owner (-1 = neutral)
    const ownerIdx = obj.kind === OBJ.CASTLE ? obj.ownerIdx : (obj.kind === OBJ.MINE ? obj.owner : -1);
    const ownerColor = ownerIdx === 0 ? '#3b82f6' : (ownerIdx === 1 ? '#dc2626' : '#888');
    ctx.save();
    if (remembered) ctx.globalAlpha = 0.72;
    if (obj.kind === OBJ.CASTLE) {
      ctx.fillStyle = ownerColor;
      roundRect(s.x + 2, s.y + 2, size - 4, size - 4, 4); ctx.fill();
    }
    // desaturate only the icon (canvas filter where supported), never the owner colour
    if (remembered && canDim) ctx.filter = 'grayscale(0.85) brightness(0.8)';
    ctx.font = Math.round(size * 0.6) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(objIcon(obj), s.x + size / 2, s.y + size / 2);
    if (remembered && canDim) ctx.filter = 'none';
    if (obj.kind === OBJ.MINE && ownerIdx >= 0) {
      ctx.fillStyle = ownerColor; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x + size - 6, s.y + 6, Math.max(3, size * 0.14), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    if (remembered) { ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(s.x, s.y, size, size); }
  }
  // heroes (both players' heroes only shown to owner OR if in visible fog and not stealthed — simplification: show any hero currently on a visible tile)
  for (const pl of game.players) {
    for (const h of pl.heroes) {
      if (p.fog[h.y][h.x] !== 2) continue;
      const s = worldToScreen(h.x, h.y);
      ctx.fillStyle = h.ownerIdx === 0 ? '#60a5fa' : '#f87171';
      ctx.beginPath(); ctx.arc(s.x + size / 2, s.y + size / 2, size * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      if (game.selectedHeroId === h.id) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x + size / 2, s.y + size / 2, size * 0.48, 0, Math.PI * 2); ctx.stroke(); }
      ctx.font = Math.round(size * 0.45) + 'px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('🧝', s.x + size / 2, s.y + size / 2);
    }
  }
  ctx.restore();

  drawResourceBar(p, topBar);
  if (game.mode === 'campaign' && game.objective) drawObjectiveBar(topBar);
  drawMinimap(p, topBar);
  drawBottomPanel(p, topBar);
  if (game.mode === 'campaign' && Date.now() < game.aiBannerUntil) drawAiTurnBanner();
}

// ---- minimap: whole 36x36 board, top-right of the MAP area (always below the resource bar
// and the campaign objective strip, above the bottom panel). Tapping it jumps the camera. ----
function minimapMetrics(topBar) {
  const rbH = resourceBarH();
  const areaH = H - topBar - rbH - 44;
  let cell = Math.floor(Math.min(W * 0.3, areaH * 0.5) / MAP_SIZE);
  cell = Math.max(2, Math.min(4, cell));
  const size = cell * MAP_SIZE;
  return { cell, size, x: W - size - 6, y: topBar + rbH + 6 };
}
function drawMinimap(p, topBar) {
  const m = minimapMetrics(topBar);
  const cell = m.cell;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(m.x - 2, m.y - 2, m.size + 4, m.size + 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(m.x, m.y, m.size, m.size);
  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const f = p.fog[y][x];
      if (f === 0) continue;
      ctx.fillStyle = TERRAIN[game.terrain[y][x]].color;
      ctx.fillRect(m.x + x * cell, m.y + y * cell, cell, cell);
      if (f === 1) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(m.x + x * cell, m.y + y * cell, cell, cell); }
    }
  }
  const dot = (tx, ty, color, r) => {
    ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x + (tx + 0.5) * cell, m.y + (ty + 0.5) * cell, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  };
  for (const o of game.objects) {
    if (o.kind !== OBJ.CASTLE || p.fog[o.y][o.x] === 0) continue; // own + known enemy/neutral castles
    dot(o.x, o.y, o.ownerIdx === 0 ? '#3b82f6' : (o.ownerIdx === 1 ? '#dc2626' : '#888'), Math.max(2.5, cell * 0.9));
  }
  for (const pl of game.players) {
    for (const hh of pl.heroes) {
      if (p.fog[hh.y][hh.x] !== 2) continue; // own heroes always; enemy heroes only while in view
      dot(hh.x, hh.y, hh.ownerIdx === 0 ? '#93c5fd' : '#fca5a5', Math.max(1.8, cell * 0.6));
    }
  }
  // camera viewport rectangle (clipped to the minimap)
  const size = mapTileSize || 1;
  const vw = W / size, vh = (H - topBar - resourceBarH() - 44) / size;
  const rx0 = Math.max(0, game.camera.x - vw / 2), ry0 = Math.max(0, game.camera.y - vh / 2);
  const rx1 = Math.min(MAP_SIZE, game.camera.x + vw / 2), ry1 = Math.min(MAP_SIZE, game.camera.y + vh / 2);
  ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.5;
  ctx.strokeRect(m.x + rx0 * cell, m.y + ry0 * cell, Math.max(2, (rx1 - rx0) * cell), Math.max(2, (ry1 - ry0) * cell));
  ctx.restore();
  // a tap on the minimap is consumed as a UI button (fires on press, exactly like every other
  // canvas button), so adventurePointerDown never starts a map drag/tap from it and the later
  // mouseup finds no press -> no stray hero move.
  addButton(m.x - 2, m.y - 2, m.size + 4, m.size + 4, () => {
    const tx = (lastPointerX - m.x) / cell, ty = (lastPointerY - m.y) / cell;
    centerCameraOn(Math.max(0, Math.min(MAP_SIZE, tx)), Math.max(0, Math.min(MAP_SIZE, ty)));
    clampCamera();
    sfx.click();
  });
}

// brief, non-blocking "Enemy turn" indicator (BUG 1 fix) — no buttons, no addButton() call,
// purely informational, and clears itself once aiBannerUntil elapses (no dismiss needed)
function drawAiTurnBanner() {
  const w = Math.min(260, W * 0.7), h = 34;
  const x = W / 2 - w / 2, y = 14;
  ctx.save();
  ctx.globalAlpha = 0.92;
  drawPanel(x, y, w, h, { fill: 'rgba(90,20,20,0.9)', stroke: '#f87171' });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('enemyTurnBanner'), x + w / 2, y + h / 2 + 1);
  ctx.restore();
}

function drawObjectiveBar(topBar) {
  const y = topBar + 46;
  drawPanel(0, y, W, 22, { r: 0, fill: 'rgba(60,20,10,0.92)', stroke: 'rgba(255,255,255,0.1)' });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

function drawResourceBar(p, topBar) {

function drawBottomPanel(p, topBar) {

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

    ctx.fillStyle = '#fff'; ctx.font = '800 13px sans-serif';
    ctx.fillText('🧝 ' + hero.name + '  Lv' + hero.level + '  ' + t('movePts') + ': ' + Math.round(hero.movePts) + '/' + hero.movePtsMax, 10, y + 22);
    addButton(0, y, Math.min(220, W * 0.5), 44, () => { game.screen = 'heroScreen'; });

// ---- input for adventure screen ----
const adv = { dragging: false, dragStartX: 0, dragStartY: 0, dragMoved: false, camStartX: 0, camStartY: 0 };

function adventurePointerDown(px, py) {
  if (hitButton(px, py)) return; // handled by click dispatch already
  adv.dragging = true; adv.dragMoved = false;
  adv.dragStartX = px; adv.dragStartY = py;
  adv.camStartX = game.camera.x; adv.camStartY = game.camera.y;
}
function adventurePointerMove(px, py) {
  if (!adv.dragging) return;
  const dx = px - adv.dragStartX, dy = py - adv.dragStartY;
  if (Math.hypot(dx, dy) > 6) adv.dragMoved = true;
  if (adv.dragMoved) {
    game.camera.x = adv.camStartX - dx / mapTileSize;
    game.camera.y = adv.camStartY - dy / mapTileSize;
    clampCamera();
  }
}
function adventurePointerUp(px, py) {
  const wasDrag = adv.dragMoved;
  const hadPress = adv.dragging;
  adv.dragging = false;
  if (wasDrag) return;
  // a tap is only a tap if its PRESS started on the adventure map. mouseup is wired on
  // window, so without this a click on a DOM modal button (artifact "OK", spell-shop
  // "Close") or on a canvas button that switches screens (castle "Back") delivered a
  // stray mouseup here and walked the selected hero toward whatever tile lay under the
  // button — the "hero teleports after picking up an artifact / buying a spellbook" bug.
  if (!hadPress) return;
  const w = screenToWorld(px, py);
  const tx = Math.floor(w.x), ty = Math.floor(w.y);
  if (!inBounds(tx, ty)) return;
  handleAdventureTileTap(tx, ty);
}
function handleAdventureTileTap(tx, ty) {
  // never treat a map tap as a move while a modal is on top of the map
  if (['msgModal', 'listModal', 'passModal', 'victoryModal'].some(id => document.getElementById(id).style.display === 'flex')) return;
  const p = currentPlayer();
  const known = p.fog[ty][tx] !== 0;
  // selecting/opening a hero or castle icon only makes sense for tiles you've actually
  // discovered — but MOVEMENT should still be allowed into unexplored (black) tiles:
  // the terrain itself already exists (fog only hides it from the player), so a hero can
  // be sent walking toward/into the unknown just like real HOMM2's "as far as possible"
  // click-to-move UX, matching how combat stacks already march toward distant targets.
  if (known) {
    const heroHere = heroAt(tx, ty);
    if (heroHere && heroHere.ownerIdx === p.idx) {
      if (game.selectedHeroId === heroHere.id) { game.screen = 'heroScreen'; return; }
      game.selectedHeroId = heroHere.id;
      centerCameraOnHero(heroHere);
      sfx.click();
      return;
    }
    const castleHere = findCastleAt(tx, ty);
    if (castleHere && castleHere.ownerIdx === p.idx) {
      game.selectedCastleId = castleHere.id;
      game.screen = 'castle';
      sfx.click();
      return;
    }
  }
  const hero = findHeroById(game.selectedHeroId);
  if (hero && hero.ownerIdx === p.idx) {
    const moved = tryMoveHeroToward(hero, tx, ty);
    if (moved) { sfx.move(); centerCameraOnHero(hero); saveGame(); checkVictory(); }
    else { sfx.click(); } // audible feedback: that tile is unreachable (e.g. across open water)
  }
}

let heroScreenSelectedSlot = null;
function renderHeroScreen() {
  ctx.fillStyle = '#1a1408'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const hero = findHeroById(game.selectedHeroId);
  if (!hero) { game.screen = 'adventure'; return; }
  const fac = factionById(hero.factionId);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  drawButton(10, topBar + 8, 90, 34, t('back'), '#94a3b8', '#475569', () => { game.screen = 'adventure'; heroScreenSelectedSlot = null; });

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f4c95d'; ctx.font = '900 20px sans-serif';
  ctx.fillText(hero.name + '  (Lv ' + hero.level + ')', W / 2, topBar + 26);

  // narrow (portrait phone): slim stats column, wider army column; compact (landscape phone):
  // army slots flow in two columns so all five stacks + their stats still fit the short screen
  const narrow = W < 600, compact = H < 480;
  const colW = narrow ? Math.floor(W * 0.36) : Math.min(260, W * 0.42);
  const rightW = (narrow || compact) ? W - colW - 42 : colW;
  const leftX = 14, rightX = W - rightW - 14;
  let y = topBar + 56;
  drawPanel(leftX, y, colW, 130, {});
  ctx.textAlign = 'left'; ctx.font = '700 13px sans-serif'; ctx.fillStyle = '#fff';
  const stats = [
    [t('attack'), hero.attack], [t('defense'), hero.defense],
    [t('spellPower'), hero.spellPower], [t('knowledge'), hero.knowledge],
    [t('movePts'), Math.round(hero.movePts) + '/' + hero.movePtsMax],
    [t('spellPts'), Math.round(hero.spellPts) + '/' + hero.spellPtsMax],
  ];
  stats.forEach((s, i) => ctx.fillText(s[0] + ': ' + s[1], leftX + 12, y + 18 + i * 19, colW - 20));

  y += 140;
  drawPanel(leftX, y, colW, 110, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('skills') + ':', leftX + 12, y + 16);
  ctx.font = '600 12px sans-serif'; ctx.fillStyle = '#fff';
  if (hero.skills.length === 0) ctx.fillText('—', leftX + 12, y + 38);
  hero.skills.forEach((s, i) => {
    const lvlName = [t('basic'), t('advanced'), t('expert')][s.level - 1];
    ctx.fillText(SKILL_DEFS[s.id].name + ' (' + lvlName + ')', leftX + 12, y + 38 + i * 18, colW - 20);
  });

  // right column: army — every stack shows its stats and ranged/melee (with ammo)
  const slotH = 64, cols = compact ? 2 : 1, rowsN = Math.ceil(5 / cols);
  const panelH = Math.max(H - topBar - 56 - 60, 34 + rowsN * (slotH + 6) + 34);
  drawPanel(rightX, topBar + 56, rightW, panelH, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('army') + ':', rightX + 12, topBar + 72);
  const slotW = (rightW - 16 - (cols - 1) * 6) / cols;
  for (let i = 0; i < 5; i++) {
    const sx = rightX + 8 + (i % cols) * (slotW + 6);
    const sy = topBar + 90 + Math.floor(i / cols) * (slotH + 6);
    const stack = hero.army[i];
    const selected = heroScreenSelectedSlot === i;
    drawPanel(sx, sy, slotW, slotH, { fill: selected ? 'rgba(253,224,71,0.18)' : 'rgba(255,255,255,0.06)', stroke: selected ? '#fde047' : '#8a7a5c' });
    if (stack) {
      const cd = creatureRef(stack);
      drawCreatureGlyph(cd.shape, sx + 26, sy + 24, 16, creatureColor(stack));
      ctx.textAlign = 'center'; ctx.fillStyle = '#cbd5e1'; ctx.font = '700 11px sans-serif';
      ctx.fillText('x' + stack.count, sx + 26, sy + slotH - 10, 44);
      const tx = sx + 50, tw = slotW - 56;
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '700 12px sans-serif';
      ctx.fillText(creatureDisplayName(stack), tx, sy + 12, tw);
      ctx.font = '600 10px sans-serif'; ctx.fillStyle = '#cbd5e1';
      ctx.fillText(creatureStatLine1(cd), tx, sy + 27, tw);
      ctx.fillText(creatureStatLine2(cd), tx, sy + 40, tw);
      ctx.fillStyle = cd.ranged ? '#fde047' : '#fca5a5'; ctx.font = '700 10px sans-serif';
      ctx.fillText(creatureRangeLabel(cd), tx, sy + 54, tw);
    } else {
      ctx.textAlign = 'center'; ctx.fillStyle = '#888'; ctx.font = '600 12px sans-serif';
      ctx.fillText('—', sx + slotW / 2, sy + slotH / 2);
    }
    addButton(sx, sy, slotW, slotH, () => onHeroArmySlotTap(hero, i));
  }

  // spellbook
  const sbY = topBar + 90 + rowsN * (slotH + 6) + 6;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('spellbook') + ': ' + (hero.spells.length ? hero.spells.map(id => spellDef(id).name).join(', ') : '—'), rightX + 12, sbY + 8, rightW - 24);
}

function onHeroArmySlotTap(hero, i) {
  if (heroScreenSelectedSlot === null) {
    if (hero.army[i]) { heroScreenSelectedSlot = i; sfx.click(); }
    return;
  }
  if (heroScreenSelectedSlot === i) { heroScreenSelectedSlot = null; return; }
  const a = hero.army[heroScreenSelectedSlot], b = hero.army[i];
  if (a && b && a.factionId === b.factionId && a.tier === b.tier && a.upgraded === b.upgraded) {
    b.count += a.count;
    hero.army[heroScreenSelectedSlot] = null;
  } else {
    hero.army[heroScreenSelectedSlot] = b;
    hero.army[i] = a;
  }
  heroScreenSelectedSlot = null;
  saveGame();
}

// ---- castle building list: descriptions, costs, state; scrolls when it doesn't fit ----
let castleScroll = 0, castleScrollFor = null;
const castleDrag = { active: false, startY: 0, startScroll: 0 };
let castleListRect = null, castleContentH = 0;
function castleScrollClamp() {
  const maxS = castleListRect ? Math.max(0, castleContentH - castleListRect.h) : 0;
  castleScroll = Math.max(0, Math.min(maxS, castleScroll));
}
function castleScrollDown(px, py) {
  const r = castleListRect;
  if (r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) {
    castleDrag.active = true; castleDrag.startY = py; castleDrag.startScroll = castleScroll;
  }
}
function castleScrollMove(px, py) {
  if (!castleDrag.active) return;
  castleScroll = castleDrag.startScroll - (py - castleDrag.startY);
  castleScrollClamp();
}
function castleScrollUp() { castleDrag.active = false; }

function wrapLines(text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function buildingLabel(def, fac) {
  if (!def.tier) return def.name;
  const cdef = fac.creatures[def.tier - 1];
  return (def.upgrade ? 'Upgrade: ' : '') + (def.upgrade ? cdef.upgrade : cdef.name) + (def.upgrade ? '' : ' Dwelling');
}
function buildingDescText(def, fac) {
  if (def.tier) {
    const cdef = fac.creatures[def.tier - 1];
    if (def.upgrade) return t('descUpgrade', { up: cdef.upgrade, name: cdef.name });
    return t(cdef.ranged ? 'descDwellingR' : 'descDwellingM', { name: cdef.name, ammo: cdef.ammo, growth: cdef.growth });
  }
  const inc = def.incomePerLevel || [];
  return t(def.descKey, { a: inc[0], b: inc[1], c: inc[2] });
}
// state of one building row: built / ready / blocked (+ the reason) — mirrors canBuild()
function buildingState(castle, def, fac) {
  const curLevel = castle.buildings[def.id] || 0;
  if (curLevel >= def.maxLevel) return { kind: 'built', curLevel };
  const cost = def.cost[curLevel];
  const p = game.players[castle.ownerIdx];
  const missing = RESOURCE_KEYS.filter(k => cost[k] && (p.resources[k] || 0) < cost[k]);
  let reason = null;
  if (def.requires && !castle.buildings[def.requires]) reason = t('needsBuilding', { name: buildingLabel(buildingDef(def.requires), fac) });
  else if (missing.length) reason = t('needMore', { list: missing.map(k => RESOURCE_ICON[k] + ' ' + (cost[k] - (p.resources[k] || 0))).join(' ') });
  else if (castle.builtThisTurn) reason = t('alreadyBuiltThisTurn');
  return { kind: reason ? 'blocked' : 'ready', curLevel, cost, missing, reason };
}

function renderCastle() {
  ctx.fillStyle = '#1a1408'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const castle = game.objects.find(o => o.id === game.selectedCastleId);
  if (!castle) { game.screen = 'adventure'; return; }
  const fac = factionById(castle.factionId);
  const p = game.players[castle.ownerIdx];
  if (castleScrollFor !== castle.id) { castleScrollFor = castle.id; castleScroll = 0; }
  drawButton(10, topBar + 8, 90, 34, t('back'), '#94a3b8', '#475569', () => { game.screen = 'adventure'; });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f4c95d'; ctx.font = '900 20px sans-serif';
  ctx.fillText(castle.name + ' — ' + fac.name, W / 2, topBar + 26, W - 120);

  // wide screens: buildings left, recruit right. narrow (portrait): recruit panel on top
  // (sized to its content), the scrollable buildings list underneath.
  const narrow = W < 600;
  const y = topBar + 56;
  const dwellTiers = [1, 2, 3, 4, 5].filter(tier => castle.buildings['dwelling' + tier]);
  const guildLvl = castle.buildings.mageGuild || 0;
  const recruitNeedH = 40 + dwellTiers.length * 46 + (guildLvl > 0 ? 50 : 0) + 6;
  let L, R;
  if (narrow) {
    R = { x: 14, y, w: W - 28, h: recruitNeedH };
    L = { x: 14, y: y + R.h + 8, w: W - 28, h: H - (y + R.h + 8) - 10 };
  } else {
    const lw = Math.min(W * 0.56, 460), rw = Math.min(280, W - lw - 42);
    L = { x: 14, y, w: lw, h: H - topBar - 56 - 14 };
    R = { x: W - rw - 14, y, w: rw, h: H - topBar - 56 - 14 };
  }

  // ---- buildings panel ----
  drawPanel(L.x, L.y, L.w, L.h, {});
  ctx.textAlign = 'left'; ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('buildings') + (castle.builtThisTurn ? ' — ' + t('alreadyBuiltThisTurn') : ''), L.x + 12, L.y + 18, L.w - 24);
  const view = { x: L.x + 4, y: L.y + 32, w: L.w - 8, h: L.h - 36 };
  castleListRect = view;
  const rowW = view.w - 12, btnW = 62;
  // measure pass
  const rows = [];
  let total = 0;
  for (const def of BUILDING_DEFS) {
    const st = buildingState(castle, def, fac);
    const textW = rowW - 16 - (st.kind === 'built' ? 0 : btnW + 6);
    ctx.font = '600 10.5px sans-serif';
    const descLines = wrapLines(buildingDescText(def, fac), textW);
    // cost entries flow onto as many lines as needed
    ctx.font = '700 11px sans-serif';
    const costLines = [[]]; let cw = 0;
    if (st.kind !== 'built') {
      for (const k of RESOURCE_KEYS) {
        if (!st.cost[k]) continue;
        const txt = RESOURCE_ICON[k] + ' ' + st.cost[k];
        const w = ctx.measureText(txt).width + 12;
        if (cw + w > textW && costLines[costLines.length - 1].length) { costLines.push([]); cw = 0; }
        costLines[costLines.length - 1].push({ k, txt, w, lack: st.missing.indexOf(k) >= 0 });
        cw += w;
      }
    }
    ctx.font = '700 10.5px sans-serif';
    const stateText = st.kind === 'built' ? '✓ ' + t('built') : (st.kind === 'ready' ? '✔ ' + t('bldReady') : '✕ ' + st.reason);
    const stateLines = wrapLines(stateText, textW);
    const nCost = st.kind === 'built' ? 0 : costLines.length;
    const h = 8 + 16 + descLines.length * 13 + nCost * 15 + stateLines.length * 13 + 6;
    rows.push({ def, st, descLines, costLines, stateLines, textW, h, y: total });
    total += h + 6;
  }
  castleContentH = total;
  castleScrollClamp();
  ctx.save();
  ctx.beginPath(); ctx.rect(view.x, view.y, view.w, view.h); ctx.clip();
  for (const r of rows) {
    const ry = view.y + r.y - castleScroll;
    if (ry + r.h < view.y || ry > view.y + view.h) continue;
    const rx = view.x + 2;
    const { def, st } = r;
    const built = st.kind === 'built';
    drawPanel(rx, ry, rowW, r.h, { fill: built ? 'rgba(74,222,128,0.12)' : 'rgba(255,255,255,0.05)', stroke: built ? '#4ade80' : (st.kind === 'ready' ? '#86efac' : '#8a7a5c'), lineWidth: 1.5 });
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = '800 12px sans-serif';
    const lvlTag = def.maxLevel > 1 ? '  ·  ' + t('bldLevel', { n: st.curLevel, max: def.maxLevel }) : '';
    ctx.fillText(buildingLabel(def, fac) + lvlTag, rx + 8, ry + 16, r.textW);
    let ty = ry + 8 + 16;
    ctx.font = '600 10.5px sans-serif'; ctx.fillStyle = '#cbd5e1';
    for (const l of r.descLines) { ctx.fillText(l, rx + 8, ty + 6); ty += 13; }
    ctx.font = '700 11px sans-serif';
    for (const line of r.costLines) {
      let cx = rx + 8;
      for (const e of line) { ctx.fillStyle = e.lack ? '#fca5a5' : '#fde68a'; ctx.fillText(e.txt, cx, ty + 7); cx += e.w; }
      if (line.length) ty += 15;
    }
    ctx.font = '700 10.5px sans-serif';
    ctx.fillStyle = built ? '#4ade80' : (st.kind === 'ready' ? '#86efac' : '#fb923c');
    for (const l of r.stateLines) { ctx.fillText(l, rx + 8, ty + 6); ty += 13; }
    if (!built) {
      const ok = st.kind === 'ready';
      const bx = rx + rowW - btnW - 6, by = ry + 6, bh = 30;
      drawButton(bx, by, btnW, bh, ok ? t('build') : '✕', ok ? '#4ade80' : '#6b6b6b', ok ? '#16a34a' : '#444', null, { disabled: !ok, fontSize: 11 });
      if (ok) {
        // hit rect clipped to the visible list so a half-scrolled-away button can't be pressed
        const cy0 = Math.max(by, view.y), cy1 = Math.min(by + bh, view.y + view.h);
        if (cy1 - cy0 > 8) addButton(bx, cy0, btnW, cy1 - cy0, () => {
          if (buildInCastle(castle, def.id)) showMessage(t('build'), buildingLabel(def, fac), [{ label: t('ok') }]);
        });
      }
    }
  }
  ctx.restore();
  if (castleContentH > view.h) { // scroll thumb
    const th = Math.max(20, view.h * view.h / castleContentH);
    const tyy = view.y + (view.h - th) * (castleScroll / (castleContentH - view.h));
    ctx.fillStyle = 'rgba(253,230,138,0.55)';
    roundRect(view.x + view.w - 4, tyy, 3, th, 1.5); ctx.fill();
  }

  // ---- recruit + garrison panel ----
  drawPanel(R.x, R.y, R.w, R.h, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('recruit') + ':', R.x + 12, R.y + 18);
  let ry = R.y + 40;
  const recruitBtnW = Math.min(88, R.w - 24);
  for (const tier of dwellTiers) {
    const avail = castleAvailableToRecruit(castle, tier);
    const upgraded = !!castle.buildings['dwelling' + tier + 'up'];
    const cdef = fac.creatures[tier - 1];
    const name = upgraded ? cdef.upgrade : cdef.name;
    drawPanel(R.x + 8, ry, R.w - 16, 40, { fill: 'rgba(255,255,255,0.05)', stroke: '#8a7a5c' });
    ctx.fillStyle = '#fff'; ctx.font = '700 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(name + ' (' + avail + ')', R.x + 16, ry + 20, R.w - 16 - recruitBtnW - 16);
    // button sized to fit the full (untruncated) label so its drawn geometry always
    // matches its registered hit rect — a too-narrow button was the earlier symptom here
    const rbx = R.x + R.w - 8 - recruitBtnW, rby = ry + 3, rbh = 34;
    drawButton(rbx, rby, recruitBtnW, rbh, t('recruit'), avail > 0 ? '#4ade80' : '#6b6b6b', avail > 0 ? '#16a34a' : '#444', avail > 0 ? (() => openRecruitModal(castle, tier)) : null, { disabled: avail <= 0, fontSize: 12 });
    ry += 46;
  }
  if (guildLvl > 0) {
    const hero = findHeroById(game.selectedHeroId);
    drawButton(R.x + 8, ry + 8, R.w - 16, 38, '📖 ' + t('spellbook'), '#a78bfa', '#6d28d9', hero ? (() => openLearnSpellsModal(castle, hero, guildLvl)) : null, { disabled: !hero });
  }
}

function openLearnSpellsModal(castle, hero, guildLvl) {
  const maxLvl = Math.min(guildLvl, heroMaxSpellLevel(hero));
  const learnable = SPELL_DEFS.filter(s => s.level <= maxLvl && !hero.spells.includes(s.id));
  showListModal(t('spellbook'), hero.name, learnable.map(s => ({
    label: s.name + ' (Lv' + s.level + ', ' + s.cost + ' SP)',
    onClick: () => { hero.spells.push(s.id); hideListModal(); sfx.spell(); saveGame(); },
  })), [{ label: t('close') }]);
}

function openRecruitModal(castle, tier) {
  // recruit into whichever hero is actually standing in the castle; if none is,
  // troops go into the castle garrison instead of silently failing
  const hero = heroAtCastle(castle);
  const avail = castleAvailableToRecruit(castle, tier);
  const fac = factionById(castle.factionId);
  const cd = fac.creatures[tier - 1];
  const upgraded = !!castle.buildings['dwelling' + tier + 'up'];
  const sub = (hero ? hero.name : t('recruitToGarrison')) + '\n' +
    (upgraded ? cd.upgrade : cd.name) + '\n' +
    creatureStatLine1(cd) + ' · ' + creatureStatLine2(cd) + '\n' +
    creatureRangeLabel(cd) + '\n' +
    t('costEach') + ': ' + costText(cd.cost);
  const doRecruit = (count) => {
    const ok = hero ? recruitFromCastle(castle, hero, tier, count) : recruitIntoGarrison(castle, tier, count);
    hideListModal();
    if (!ok) showMessage(t('recruitFailed'), '', [{ label: t('ok') }]);
  };
  showListModal(t('recruitTitle'), sub, [
    { label: t('max') + ' (' + avail + ')', onClick: () => doRecruit(avail) },
    { label: '1', onClick: () => doRecruit(1) },
    { label: '5', onClick: () => doRecruit(5) },
  ], [{ label: t('close') }]);
}

// SCREEN: COMBAT
// ============================================================
let combatCellSize = 30;
const COMBAT_HEADER_H = 78; // room for round counter + active stack name + turn order row
function combatOrigin() {
  const topBar = chromeMetrics().topBar;
  const gridW = COMBAT_W * combatCellSize, gridH = COMBAT_H * combatCellSize;
  return { x: W / 2 - gridW / 2, y: topBar + COMBAT_HEADER_H + (H - topBar - COMBAT_HEADER_H - 120 - gridH) / 2 };
}
function computeCombatCellSize() {
  const topBar = chromeMetrics().topBar;
  const usableW = W - 20, usableH = H - topBar - COMBAT_HEADER_H - 120;
  return Math.max(14, Math.min(40, Math.min(usableW / COMBAT_W, usableH / COMBAT_H)));
}
function combatCellToScreen(x, y) {
  const o = combatOrigin();
  return { x: o.x + x * combatCellSize, y: o.y + y * combatCellSize };
}
function combatScreenToCell(px, py) {
  const o = combatOrigin();
  return { x: Math.floor((px - o.x) / combatCellSize), y: Math.floor((py - o.y) / combatCellSize) };
}

// ranged marker: a small gold bow-and-arrow on a dark pill in the top-left of the stack's cell,
// with the remaining ammo beside it (grey bow + red 0 once the stack is out of ammo)
function drawRangedBadge(cx, cy, cs, ammo) {
  const r = Math.max(4, cs * 0.17);
  const fontPx = Math.max(9, Math.round(cs * 0.3));
  ctx.save();
  ctx.font = '800 ' + fontPx + 'px sans-serif';
  const label = String(ammo);
  const pillW = r * 2 + 4 + ctx.measureText(label).width + 3, pillH = Math.max(r * 2 + 2, fontPx + 2);
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  roundRect(cx + 1, cy + 1, pillW, pillH, pillH / 2); ctx.fill();
  const bx = cx + 3 + r * 0.7, by = cy + 1 + pillH / 2;
  const out = ammo <= 0;
  ctx.strokeStyle = out ? '#9ca3af' : '#fde047'; ctx.lineWidth = Math.max(1.2, cs * 0.05);
  ctx.beginPath(); ctx.arc(bx - r * 0.2, by, r, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke(); // bow
  ctx.beginPath(); ctx.moveTo(bx - r * 0.2 + r * Math.cos(Math.PI * 0.42), by - r * Math.sin(Math.PI * 0.42));
  ctx.lineTo(bx - r * 0.2 + r * Math.cos(Math.PI * 0.42), by + r * Math.sin(Math.PI * 0.42)); ctx.stroke(); // string
  ctx.beginPath(); ctx.moveTo(bx - r * 0.9, by); ctx.lineTo(bx + r * 1.1, by); ctx.stroke(); // arrow
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = out ? '#f87171' : '#fff';
  ctx.fillText(label, cx + 3 + r * 2 + 2, by + 1);
  ctx.restore();
}

function renderCombat() {
  combatCellSize = computeCombatCellSize();
  ctx.fillStyle = '#0f1a12'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const c = game.combat;
  if (!c) { game.screen = 'adventure'; return; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f4c95d'; ctx.font = '900 15px sans-serif';
  ctx.fillText(t('combatRound') + ' ' + c.round, W / 2, topBar + 15);

  const o = combatOrigin();
  const activeStack = currentActorStack();
  const reach = (activeStack && !combatSideIsAI(activeStack.side)) ? combatReachable(activeStack) : new Map();

  // active stack name — readable status line
  if (activeStack) {
    ctx.font = '700 12px sans-serif';
    ctx.fillStyle = activeStack.side === 'attacker' ? '#93c5fd' : '#fca5a5';
    const acd = creatureRef(activeStack);
    const rangeNote = acd.ranged ? (activeStack.ammo > 0 ? '🏹 ' + t('shotsLabel', { n: activeStack.ammo }) : t('noAmmo')) : '⚔️ ' + t('meleeLabel');
    ctx.fillText(t('stackTurn', { name: creatureDisplayName(activeStack) }) + ' — ' + rangeNote, W / 2, topBar + 33, W - 16);
  }
  // initiative / turn order row
  const aliveOrder = c.order.map(id => c.stacks.find(s => s.id === id)).filter(s => s && s.alive);
  if (aliveOrder.length) {
    const chip = 20, chipGap = 4;
    const rowW = aliveOrder.length * (chip + chipGap) - chipGap;
    let ox = W / 2 - Math.min(rowW, W - 20) / 2;
    const maxChips = Math.max(1, Math.floor((W - 20) / (chip + chipGap)));
    aliveOrder.slice(0, maxChips).forEach((s) => {
      const isCur = activeStack && s.id === activeStack.id;
      ctx.fillStyle = isCur ? 'rgba(253,224,71,0.9)' : 'rgba(255,255,255,0.14)';
      roundRect(ox, topBar + 46, chip, chip, 5); ctx.fill();
      if (isCur) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.5; ctx.stroke(); }
      drawCreatureGlyph(creatureRef(s).shape, ox + chip / 2, topBar + 46 + chip / 2, chip * 0.34, creatureColor(s));
      ox += chip + chipGap;
    });
  }
  for (let y = 0; y < COMBAT_H; y++) {
    for (let x = 0; x < COMBAT_W; x++) {
      const s = combatCellToScreen(x, y);
      const k = x + ',' + y;
      ctx.fillStyle = (x + y) % 2 === 0 ? '#3a6b3f' : '#356338';
      if (reach.has(k)) ctx.fillStyle = '#5b8fd6';
      ctx.fillRect(s.x, s.y, combatCellSize - 1, combatCellSize - 1);
    }
  }
  // stacks
  for (const st of c.stacks) {
    if (!st.alive) continue;
    const s = combatCellToScreen(st.x, st.y);
    const isActive = activeStack && activeStack.id === st.id;
    if (isActive) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.strokeRect(s.x + 1, s.y + 1, combatCellSize - 3, combatCellSize - 3); }
    drawCreatureGlyph(creatureRef(st).shape, s.x + combatCellSize / 2, s.y + combatCellSize / 2 - 2, combatCellSize * 0.36, creatureColor(st));
    ctx.fillStyle = st.side === 'attacker' ? '#60a5fa' : '#f87171';
    ctx.beginPath(); ctx.arc(s.x + combatCellSize - 6, s.y + 6, 3, 0, Math.PI * 2); ctx.fill();
    // creature count — outlined for legibility over any background/colour
    ctx.font = '800 ' + Math.max(10, Math.round(combatCellSize * 0.32)) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const countLabel = String(st.count);
    const countY = s.y + combatCellSize - 9;
    ctx.lineWidth = Math.max(2, combatCellSize * 0.09);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(countLabel, s.x + combatCellSize / 2, countY);
    ctx.fillStyle = '#fff';
    ctx.fillText(countLabel, s.x + combatCellSize / 2, countY);
    // HP bar for the stack
    const hpFrac = Math.max(0, Math.min(1, st.hpMax ? st.hp / st.hpMax : 1));
    const barW = combatCellSize - 6, barH = Math.max(2, combatCellSize * 0.09);
    const barX = s.x + 3, barY = s.y + combatCellSize - barH - 2;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = hpFrac > 0.5 ? '#4ade80' : (hpFrac > 0.25 ? '#fbbf24' : '#f87171');
    ctx.fillRect(barX, barY, Math.max(0, barW * hpFrac), barH);
    if (creatureRanged(st)) drawRangedBadge(s.x, s.y, combatCellSize, st.ammo);
    addButton(s.x, s.y, combatCellSize, combatCellSize, () => { humanActOnTile(st.x, st.y); });
  }
  // empty tile taps
  for (let y = 0; y < COMBAT_H; y++) {
    for (let x = 0; x < COMBAT_W; x++) {
      if (c.stacks.some(st => st.alive && st.x === x && st.y === y)) continue;
      const s = combatCellToScreen(x, y);
      addButton(s.x, s.y, combatCellSize, combatCellSize, () => { humanActOnTile(x, y); });
    }
  }
  // floaters
  for (let i = c.floaters.length - 1; i >= 0; i--) {
    const f = c.floaters[i];
    const s = combatCellToScreen(f.x, f.y);
    ctx.fillStyle = '#fca5a5'; ctx.font = '800 13px sans-serif';
    ctx.fillText(f.text, s.x + combatCellSize / 2, s.y - f.t * 0.6);
    f.t++;
    if (f.t > 40) c.floaters.splice(i, 1);
  }

  // action bar
  const barY = o.y + COMBAT_H * combatCellSize + 14;
  const isHumanTurn = activeStack && !combatSideIsAI(activeStack.side);
  const btnW = Math.min(100, (W - 40) / 5), btnH = 38, gap = 8;
  const totalW = btnW * 5 + gap * 4;
  let bx = W / 2 - totalW / 2;
  const side = activeStack ? activeStack.side : 'attacker';
  const hero = side === 'attacker' ? combatAttackerHero() : combatDefenderHero();
  const canCast = isHumanTurn && hero && hero.spells.length > 0 && !game.combat.sideCast[side];
  drawButton(bx, barY, btnW, btnH, t('castSpell'), '#a78bfa', '#6d28d9', canCast ? (() => openCombatSpellModal(side, hero)) : null, { disabled: !canCast, fontSize: 11 });
  bx += btnW + gap;
  drawButton(bx, barY, btnW, btnH, t('defend'), '#38bdf8', '#0284c7', isHumanTurn ? humanDefend : null, { disabled: !isHumanTurn, fontSize: 11 });
  bx += btnW + gap;
  drawButton(bx, barY, btnW, btnH, t('wait'), '#94a3b8', '#475569', isHumanTurn ? humanWait : null, { disabled: !isHumanTurn, fontSize: 11 });
  bx += btnW + gap;
  const canFlee = isHumanTurn && (side === 'attacker' ? combatAttackerHero() : combatDefenderHero());
  drawButton(bx, barY, btnW, btnH, t('flee'), '#fbbf24', '#b45309', canFlee ? (() => combatFlee(side)) : null, { disabled: !canFlee, fontSize: 11 });
  bx += btnW + gap;
  drawButton(bx, barY, btnW, btnH, t('surrender'), '#f87171', '#b91c1c', canFlee ? (() => combatSurrender(side)) : null, { disabled: !canFlee, fontSize: 11 });

  // log
  ctx.textAlign = 'left'; ctx.font = '600 11px sans-serif'; ctx.fillStyle = '#d1fae5';
  const logLines = c.log.slice(-3);
  logLines.forEach((l, i) => ctx.fillText(l, 10, barY + btnH + 16 + i * 14));
}

function openCombatSpellModal(side, hero) {
  const items = hero.spells.map(id => {
    const def = spellDef(id);
    const canAfford = hero.spellPts >= def.cost;
    return {
      label: def.name + ' (' + def.cost + ' SP)' + (canAfford ? '' : ' ✕'),
      disabled: !canAfford,
      onClick: () => {
        hideListModal();
        if (def.kind === 'buff' || def.kind === 'debuff' || (def.kind === 'damage' && def.aoe)) {
          combatCastSpell(side, id, null);
        } else {
          // pick a target stack: damage single-target or heal — target first valid enemy/ally
          const targets = def.kind === 'heal' ? combatAliveStacks().filter(s => s.side === side) : combatAliveStacks().filter(s => s.side !== side);
          if (targets.length) combatCastSpell(side, id, targets[0].id);
        }
      },
    };
  });
  showListModal(t('castSpell'), hero.name + ' — ' + Math.round(hero.spellPts) + ' SP', items, [{ label: t('close') }]);
}

// ============================================================
// SCREEN: COMBAT RESULT
// ============================================================
function renderCombatResult() {
  ctx.fillStyle = '#0f1a12'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const c = game.combat;
  if (!c) { game.screen = 'adventure'; return; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const win = c.result === 'attackerWin' || c.result === 'defenderFled' || c.result === 'defenderSurrendered';
  ctx.fillStyle = win ? '#4ade80' : '#f87171';
  ctx.font = '900 26px sans-serif';
  let msg = t('combatVictory');
  if (c.result === 'defenderWin') msg = t('combatDefeat');
  else if (c.result === 'attackerFled') msg = t('combatFled');
  else if (c.result === 'attackerSurrendered') msg = t('combatSurrendered');
  ctx.fillText(msg, W / 2, H / 2 - 20);
  drawButton(W / 2 - 90, H / 2 + 20, 180, 46, t('continueBtn'), '#4ade80', '#16a34a', () => {
    game.combat = null; game.screen = 'adventure';
    // a combat that happened mid-AI-turn (the AI attacked a human hero/castle) always ends
    // the AI's turn right there instead of resuming further AI actions — see aiTakeTurn()
    if (game.mode === 'campaign' && game.turn.playerIdx === 1 && !checkVictory()) endTurn();
  });
}

// ============================================================
// MAIN LOOP DISPATCH
// ============================================================
let lastScreenForModals = null;
function render() {
  clearUIButtons();
  syncScreenModals();
  switch (game.screen) {
    case 'modeSelect': renderModeSelect(); break;
    case 'factionPick': renderFactionPick(); break;
    case 'heroPick': renderHeroPick(); break;
    case 'missionSelect': renderMissionSelect(); break;
    case 'missionIntro': renderMissionIntro(); break;
    case 'missionOutro': renderMissionOutro(); break;
    case 'missionDefeat': renderMissionDefeat(); break;
    case 'adventure': renderAdventure(); break;
    case 'castle': renderCastle(); break;
    case 'heroScreen': renderHeroScreen(); break;
    case 'combat': renderCombat(); break;
    case 'combatResult': renderCombatResult(); break;
    case 'passDevice': ctx.fillStyle = '#08131f'; ctx.fillRect(0, 0, W, H); break;
    case 'victory': ctx.fillStyle = '#08131f'; ctx.fillRect(0, 0, W, H); break;
    default: ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  }
  lastScreenForModals = game.screen;
}

function update(dt) {
  // Stage 1 is turn-based; no continuous simulation is required per frame.
  // Reserved for future animation/timer needs.
}

// ============================================================
// INPUT WIRING
// ============================================================
function pointFromEvent(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

let lastPointerX = 0, lastPointerY = 0;
function onDown(px, py) {
  initAudio();
  lastPointerX = px; lastPointerY = py;
  const btn = hitButton(px, py);
  if (btn) { btn.onClick(); return; }
  if (game.screen === 'adventure') adventurePointerDown(px, py);
  else if (game.screen === 'castle') castleScrollDown(px, py);
}
function onMove(px, py) {
  if (game.screen === 'adventure') adventurePointerMove(px, py);
  else if (game.screen === 'castle') castleScrollMove(px, py);
}
function onUp(px, py) {
  if (game.screen === 'adventure') adventurePointerUp(px, py);
  castleScrollUp();
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = pointFromEvent(e); onDown(p.x, p.y); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = pointFromEvent(e); onMove(p.x, p.y); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); const p = pointFromEvent(e); onUp(p.x, p.y); }, { passive: false });
canvas.addEventListener('wheel', e => { if (game.screen === 'castle') { castleScroll += e.deltaY; e.preventDefault(); } }, { passive: false });
canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));

// ============================================================
// BOOT
// ============================================================
let lastFrameTime = 0;
function frame(ts) {
  const dt = lastFrameTime ? Math.min(0.1, (ts - lastFrameTime) / 1000) : 0;
  lastFrameTime = ts;
  // schedule the next frame FIRST and guard the body: one exception inside update()/render()
  // used to skip the requestAnimationFrame call below and freeze the whole game for good
  requestAnimationFrame(frame);
  try { update(dt); render(); } catch (e) { console.error(e); }
}

function init() {
  resize();
  game.screen = 'modeSelect';
  requestAnimationFrame(frame);
}
init();
</script>

// ============================================================
// FINALE — victory / mission complete / defeat presentation
// ============================================================
// One code-drawn celebration shared by the duel victory, the campaign outro and the defeat screen:
// the winning faction's crest on a rising banner, the hero's portrait, a short congratulation,
// final stats and a confetti / sunburst flourish (ash + dusk for a defeat). Everything is a pure
// function of the time since the screen opened, so a tap anywhere just fast-forwards the clock.
const FINALE_KIND = { victory: 'duel', missionOutro: 'mission', missionDefeat: 'defeat' };
const finale = { screen: null, t0: 0 };
function finaleSkip() { finale.t0 = Math.min(finale.t0, Date.now() - 4000); }
function finaleHero(idx) {
  const p = game.players[idx];
  const h = p && p.heroes[0];
  if (h) return { name: h.name, portrait: h.portrait };
  const known = game.heroInfo && game.heroInfo[idx];
  if (known) return known;

}
function rememberHeroes() {

}
function finaleFract(x) { return x - Math.floor(x); }
function finaleEase(x) { x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }

  while (px > 10 && ctx.measureText(text).width > maxW) { px -= 1; ctx.font = weight + ' ' + px + 'px sans-serif'; }
  return px;
}
function drawFinaleConfetti(t, colors, y0) {

    const start = 0.15 + r1 * 0.9;

    const speed = 60 + r2 * 120, size = 5 + r3 * 6, span = H - y0 + 40;
    const x = r1 * W + Math.sin(t * 1.6 + i) * 16;
    const y = y0 - 20 + (((t - start) * speed + r3 * span) % span);
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * (1.5 + r2 * 3) + i);
    ctx.fillStyle = colors[i % colors.length];

}
function drawFinaleAsh(t, y0) {

    const span = H - y0 + 30;

  const nameY = heroCY + heroR + 15;

  ctx.fillStyle = '#fde047';

  ctx.strokeStyle = win ? '#fde047' : '#94a3b8'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(cx, heroCY, heroR + 3, 0, 7); ctx.stroke();

}

// ---- camera: game.camera.{x,y} is the tile the viewport is centered on ----
function centerCameraOn(x, y) { game.camera = { x, y }; }
function centerCameraOnHero(hero) { if (hero) centerCameraOn(hero.x, hero.y); }
function centerCameraOnCastle(playerIdx) {
  const p = game.players[playerIdx];
  if (!p) return;
  const cid = p.castles[0];
  const c = cid !== undefined ? game.objects.find(o => o.id === cid) : null;
  if (c) centerCameraOn(c.x, c.y);
}
// clamp the camera so the viewport never scrolls past the map edges
function clampCamera() {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize || 1;
  const viewTilesX = W / size;
  const viewTilesY = (H - topBar - resourceBarH() - 44) / size;
  const halfX = viewTilesX / 2, halfY = viewTilesY / 2;
  let minX = halfX, maxX = MAP_SIZE - halfX;
  let minY = halfY, maxY = MAP_SIZE - halfY;
  if (minX > maxX) { minX = maxX = MAP_SIZE / 2; }
  if (minY > maxY) { minY = maxY = MAP_SIZE / 2; }
  game.camera.x = Math.max(minX, Math.min(maxX, game.camera.x));
  game.camera.y = Math.max(minY, Math.min(maxY, game.camera.y));
}

function worldToScreen(tx, ty) {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize;
  const rbH = resourceBarH();
  const originX = W / 2 - game.camera.x * size;
  const originY = topBar + rbH + (H - topBar - rbH - 44) / 2 - game.camera.y * size;
  return { x: originX + tx * size, y: originY + ty * size };
}
function screenToWorld(sx, sy) {
  const topBar = chromeMetrics().topBar;
  const size = mapTileSize;
  const rbH = resourceBarH();
  const originX = W / 2 - game.camera.x * size;
  const originY = topBar + rbH + (H - topBar - rbH - 44) / 2 - game.camera.y * size;
  return { x: (sx - originX) / size, y: (sy - originY) / size };
}

function objIcon(obj) {
  switch (obj.kind) {
    case OBJ.MINE: return RESOURCE_ICON[obj.resType] || '⛏️';
    case OBJ.RESOURCE: return RESOURCE_ICON[obj.resType] || '📦';
    case OBJ.CHEST: return '🎁';
    case OBJ.ARTIFACT: return '🏺';
    case OBJ.DWELLING: return '🏠';
    case OBJ.MONSTER: return '⚔️';
    case OBJ.CASTLE: return '🏰';
    case OBJ.POD: return '🧪';
    case OBJ.LAIR: return '🛸';
    default: return '❓';
  }
}

function renderAdventure() {
  mapTileSize = computeTileSize();
  clampCamera();
  const topBar = chromeMetrics().topBar;
  ctx.fillStyle = '#08131f';
  ctx.fillRect(0, 0, W, H);
  const p = currentPlayer();
  const size = mapTileSize;
  const rbH = resourceBarH();
  // visible tile range
  const tl = screenToWorld(0, topBar + rbH);
  const br = screenToWorld(W, H - 44);
  const x0 = Math.max(0, Math.floor(tl.x) - 1), x1 = Math.min(MAP_SIZE - 1, Math.ceil(br.x) + 1);
  const y0 = Math.max(0, Math.floor(tl.y) - 1), y1 = Math.min(MAP_SIZE - 1, Math.ceil(br.y) + 1);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, topBar + rbH, W, H - topBar - rbH - 44); ctx.clip();
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const fogState = p.fog[y][x];
      if (fogState === 0) continue;
      const terr = TERRAIN[game.terrain[y][x]];
      const s = worldToScreen(x, y);
      ctx.fillStyle = terr.color;
      ctx.fillRect(s.x, s.y, size, size);
    }
  }
  // objects on discovered tiles are drawn normally; monster stacks are only shown while
  // currently in view (they can be beaten or wander off); enemy heroes (below) likewise.
  for (const obj of game.objects) {
    if (obj.x < x0 - 1 || obj.x > x1 + 1 || obj.y < y0 - 1 || obj.y > y1 + 1) continue;
    const fs = p.fog[obj.y][obj.x];
    if (fs === 0) continue;
    if (obj.kind === OBJ.MONSTER && !isCurrentlyVisible(obj.x, obj.y, p)) continue;
    const s = worldToScreen(obj.x, obj.y);
    // owner colour: castles use ownerIdx, mines use owner (-1 = neutral)
    const ownerIdx = obj.kind === OBJ.CASTLE ? obj.ownerIdx : (obj.kind === OBJ.MINE ? obj.owner : -1);
    const ownerColor = ownerIdx === 0 ? '#3b82f6' : (ownerIdx === 1 ? '#dc2626' : '#888');
    ctx.save();
    if (obj.kind === OBJ.CASTLE) {
      ctx.fillStyle = ownerColor;
      roundRect(s.x + 2, s.y + 2, size - 4, size - 4, 4); ctx.fill();
    }
    ctx.font = Math.round(size * 0.6) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(objIcon(obj), s.x + size / 2, s.y + size / 2);
    if (obj.kind === OBJ.MINE && ownerIdx >= 0) {
      ctx.fillStyle = ownerColor; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(s.x + size - 6, s.y + 6, Math.max(3, size * 0.14), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  // heroes (both players' heroes only shown to owner OR if in visible fog and not stealthed — simplification: show any hero currently on a visible tile)
  for (const pl of game.players) {
    for (const h of pl.heroes) {
      if (p.fog[h.y][h.x] === 0 || (h.ownerIdx !== p.idx && !isCurrentlyVisible(h.x, h.y, p))) continue;
      const s = worldToScreen(h.x, h.y);
      ctx.fillStyle = h.ownerIdx === 0 ? '#60a5fa' : '#f87171';
      ctx.beginPath(); ctx.arc(s.x + size / 2, s.y + size / 2, size * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      if (game.selectedHeroId === h.id) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(s.x + size / 2, s.y + size / 2, size * 0.48, 0, Math.PI * 2); ctx.stroke(); }
      ctx.font = Math.round(size * 0.45) + 'px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('🧝', s.x + size / 2, s.y + size / 2);
    }
  }
  ctx.restore();

  drawResourceBar(p, topBar);
  if (game.mode === 'campaign' && game.objective) drawObjectiveBar(topBar);
  drawMinimap(p, topBar);
  drawBottomPanel(p, topBar);
  if (game.mode === 'campaign' && Date.now() < game.aiBannerUntil) drawAiTurnBanner();
}

// ---- minimap: whole 36x36 board, top-right of the MAP area (always below the resource bar
// and the campaign objective strip, above the bottom panel). Tapping it jumps the camera. ----
function minimapMetrics(topBar) {
  const rbH = resourceBarH();
  const areaH = H - topBar - rbH - 44;
  let cell = Math.floor(Math.min(W * 0.3, areaH * 0.5) / MAP_SIZE);
  cell = Math.max(2, Math.min(4, cell));
  const size = cell * MAP_SIZE;
  return { cell, size, x: W - size - 6, y: topBar + rbH + 6 };
}
function drawMinimap(p, topBar) {
  const m = minimapMetrics(topBar);
  const cell = m.cell;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(m.x - 2, m.y - 2, m.size + 4, m.size + 4);
  ctx.fillStyle = '#000';
  ctx.fillRect(m.x, m.y, m.size, m.size);
  for (let y = 0; y < MAP_SIZE; y++) {
    for (let x = 0; x < MAP_SIZE; x++) {
      const f = p.fog[y][x];
      if (f === 0) continue;
      ctx.fillStyle = TERRAIN[game.terrain[y][x]].color;
      ctx.fillRect(m.x + x * cell, m.y + y * cell, cell, cell);
    }
  }
  const dot = (tx, ty, color, r) => {
    ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(m.x + (tx + 0.5) * cell, m.y + (ty + 0.5) * cell, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  };
  for (const o of game.objects) {
    if (o.kind !== OBJ.CASTLE || p.fog[o.y][o.x] === 0) continue; // own + known enemy/neutral castles
    dot(o.x, o.y, o.ownerIdx === 0 ? '#3b82f6' : (o.ownerIdx === 1 ? '#dc2626' : '#888'), Math.max(2.5, cell * 0.9));
  }
  for (const pl of game.players) {
    for (const hh of pl.heroes) {
      if (hh.ownerIdx !== p.idx && !isCurrentlyVisible(hh.x, hh.y, p)) continue; // own heroes always; enemy heroes only while in view
      dot(hh.x, hh.y, hh.ownerIdx === 0 ? '#93c5fd' : '#fca5a5', Math.max(1.8, cell * 0.6));
    }
  }
  // camera viewport rectangle (clipped to the minimap)
  const size = mapTileSize || 1;
  const vw = W / size, vh = (H - topBar - resourceBarH() - 44) / size;
  const rx0 = Math.max(0, game.camera.x - vw / 2), ry0 = Math.max(0, game.camera.y - vh / 2);
  const rx1 = Math.min(MAP_SIZE, game.camera.x + vw / 2), ry1 = Math.min(MAP_SIZE, game.camera.y + vh / 2);
  ctx.strokeStyle = '#fde047'; ctx.lineWidth = 1.5;
  ctx.strokeRect(m.x + rx0 * cell, m.y + ry0 * cell, Math.max(2, (rx1 - rx0) * cell), Math.max(2, (ry1 - ry0) * cell));
  ctx.restore();
  // a tap on the minimap is consumed as a UI button (fires on press, exactly like every other
  // canvas button), so adventurePointerDown never starts a map drag/tap from it and the later
  // mouseup finds no press -> no stray hero move.
  addButton(m.x - 2, m.y - 2, m.size + 4, m.size + 4, () => {
    const tx = (lastPointerX - m.x) / cell, ty = (lastPointerY - m.y) / cell;
    centerCameraOn(Math.max(0, Math.min(MAP_SIZE, tx)), Math.max(0, Math.min(MAP_SIZE, ty)));
    clampCamera();
    sfx.click();
  });
}

// brief, non-blocking "Enemy turn" indicator (BUG 1 fix) — no buttons, no addButton() call,
// purely informational, and clears itself once aiBannerUntil elapses (no dismiss needed)
function drawAiTurnBanner() {
  const w = Math.min(260, W * 0.7), h = 34;
  const x = W / 2 - w / 2, y = 14;
  ctx.save();
  ctx.globalAlpha = 0.92;
  drawPanel(x, y, w, h, { fill: 'rgba(90,20,20,0.9)', stroke: '#f87171' });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '800 13px sans-serif';

function drawObjectiveBar(topBar) {
  const y = topBar + 46;
  drawPanel(0, y, W, 22, { r: 0, fill: 'rgba(60,20,10,0.92)', stroke: 'rgba(255,255,255,0.1)' });
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffe9b0'; ctx.font = '700 12px sans-serif';
  ctx.fillText(missionObjectiveHudText(), W / 2, y + 12);
}

function drawResourceBar(p, topBar) {
  drawPanel(0, topBar, W, 46, { r: 0, fill: 'rgba(20,14,6,0.92)', stroke: 'rgba(255,255,255,0.1)' });
  ctx.textBaseline = 'middle';
  // All 5 resources matter more than the long day text. Measure everything first, then pick the
  // first layout that fits every resource: long day @13px, short day @13px, long @11px, short @11px
  // (11px layouts also tighten the gap between resources to 8px).
  // Only if none fits are resources dropped (right to left), using short day text and 11px font.
  const dayFont = '800 13px sans-serif', gutter = 10;
  const texts = RESOURCE_KEYS.map(k => RESOURCE_ICON[k] + ' ' + (p.resources[k] || 0));
  const dayLong = t('day') + ' ' + game.turn.day + ' · ' + t('week') + ' ' + game.turn.week;
  const dayShort = t('dayShort') + game.turn.day + ' · ' + t('weekShort') + game.turn.week;
  ctx.font = dayFont;
  const dwLong = ctx.measureText(dayLong).width, dwShort = ctx.measureText(dayShort).width;
  const layouts = [];
  for (const px of [13, 11]) {
    ctx.font = '700 ' + px + 'px sans-serif';
    const lw = texts.map(l => ctx.measureText(l).width), resGap = px === 13 ? 16 : 8;
    const need = 10 + lw.reduce((a, b) => a + b, 0) + resGap * (lw.length - 1);
    layouts.push({ px, lw, resGap, need, dayText: dayLong, dw: dwLong }, { px, lw, resGap, need, dayText: dayShort, dw: dwShort });
  }
  // order: long13, short13, long11, short11
  const order = [layouts[0], layouts[1], layouts[2], layouts[3]];
  let L = order.find(l => l.need <= W - 10 - l.dw - gutter) || order[3];
  const resourceLimit = W - 10 - L.dw - gutter;
  ctx.font = '700 ' + L.px + 'px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  let x = 10;
  for (let i = 0; i < texts.length; i++) {
    if (x + L.lw[i] > resourceLimit) break;
    ctx.fillText(texts[i], x, topBar + 23);
    x += L.lw[i] + L.resGap;
  }
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f4c95d';
  ctx.font = dayFont;
  ctx.fillText(L.dayText, W - 10, topBar + 23);
}

function cycleHero(p) {
  const hs = p.heroes;
  if (hs.length < 2) return;
  const cur = hs.findIndex(h => h.id === game.selectedHeroId);
  const order = hs.map((_, k) => hs[(cur + 1 + k) % hs.length]); // next heroes first, the current one last
  const next = order.find(h => h.movePts > 0 && h.id !== game.selectedHeroId) || order[0];
  game.selectedHeroId = next.id;
  centerCameraOnHero(next);
  sfx.click();
}
function drawBottomPanel(p, topBar) {
  const y = H - 44;
  drawPanel(0, y, W, 44, { r: 0, fill: 'rgba(20,14,6,0.92)', stroke: 'rgba(255,255,255,0.1)' });
  const hero = findHeroById(game.selectedHeroId);
  const btnW = W < 420 ? 112 : 120;
  const endX = W - btnW - 10;
  const multi = p.heroes.length >= 2;
  const cycW = 44, cycX = endX - cycW - 8;
  const textRight = multi ? cycX - 6 : endX - 6;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (hero) {
    ctx.fillStyle = '#fff'; ctx.font = '800 13px sans-serif';
    ctx.fillText('🧝 ' + hero.name + '  Lv' + hero.level + '  ' + t('movePts') + ': ' + Math.round(hero.movePts) + '/' + hero.movePtsMax, 10, y + 22, textRight - 10);
    addButton(0, y, Math.min(220, W * 0.5, textRight), 44, () => { game.screen = 'heroScreen'; });
  } else {
    ctx.fillStyle = '#ccc'; ctx.font = '600 12px sans-serif';
    ctx.fillText(t('selectHero'), 10, y + 22, textRight - 10);
  }
  if (multi) drawButton(cycX, y + 4, cycW, 36, '⟳', '#fcd34d', '#b45309', () => cycleHero(p), { fontSize: 20 });
  drawButton(endX, y + 4, btnW, 36, t('endTurn'), '#4ade80', '#16a34a', () => { sfx.turnEnd(); endTurn(); });
}

// ---- input for adventure screen ----
const adv = { dragging: false, dragStartX: 0, dragStartY: 0, dragMoved: false, camStartX: 0, camStartY: 0 };

function adventurePointerDown(px, py) {
  if (hitButton(px, py)) return; // handled by click dispatch already
  adv.dragging = true; adv.dragMoved = false;
  adv.dragStartX = px; adv.dragStartY = py;
  adv.camStartX = game.camera.x; adv.camStartY = game.camera.y;
}
function adventurePointerMove(px, py) {
  if (!adv.dragging) return;
  const dx = px - adv.dragStartX, dy = py - adv.dragStartY;
  if (Math.hypot(dx, dy) > 6) adv.dragMoved = true;
  if (adv.dragMoved) {
    game.camera.x = adv.camStartX - dx / mapTileSize;
    game.camera.y = adv.camStartY - dy / mapTileSize;
    clampCamera();
  }
}
function adventurePointerUp(px, py) {
  const wasDrag = adv.dragMoved;
  const hadPress = adv.dragging;
  adv.dragging = false;
  if (wasDrag) return;
  // a tap is only a tap if its PRESS started on the adventure map. mouseup is wired on
  // window, so without this a click on a DOM modal button (artifact "OK", spell-shop
  // "Close") or on a canvas button that switches screens (castle "Back") delivered a
  // stray mouseup here and walked the selected hero toward whatever tile lay under the
  // button — the "hero teleports after picking up an artifact / buying a spellbook" bug.
  if (!hadPress) return;
  const w = screenToWorld(px, py);
  const tx = Math.floor(w.x), ty = Math.floor(w.y);
  if (!inBounds(tx, ty)) return;
  handleAdventureTileTap(tx, ty);
}
function handleAdventureTileTap(tx, ty) {
  // never treat a map tap as a move while a modal is on top of the map
  if (['msgModal', 'listModal', 'passModal', 'victoryModal'].some(id => document.getElementById(id).style.display === 'flex')) return;
  const p = currentPlayer();
  const known = p.fog[ty][tx] !== 0;
  // selecting/opening a hero or castle icon only makes sense for tiles you've actually
  // discovered — but MOVEMENT should still be allowed into unexplored (black) tiles:
  // the terrain itself already exists (fog only hides it from the player), so a hero can
  // be sent walking toward/into the unknown just like real HOMM2's "as far as possible"
  // click-to-move UX, matching how combat stacks already march toward distant targets.
  if (known) {
    const heroHere = heroAt(tx, ty);
    if (heroHere && heroHere.ownerIdx === p.idx) {
      if (game.selectedHeroId === heroHere.id) { game.screen = 'heroScreen'; return; }
      game.selectedHeroId = heroHere.id;
      centerCameraOnHero(heroHere);
      sfx.click();
      return;
    }
    const castleHere = findCastleAt(tx, ty);
    if (castleHere && castleHere.ownerIdx === p.idx) {
      game.selectedCastleId = castleHere.id;
      game.screen = 'castle';
      sfx.click();
      return;
    }
  }
  const hero = findHeroById(game.selectedHeroId);
  if (hero && hero.ownerIdx === p.idx) {
    const moved = tryMoveHeroToward(hero, tx, ty);
    if (moved) { sfx.move(); centerCameraOnHero(hero); saveGame(); checkVictory(); }
    else { sfx.click(); } // audible feedback: that tile is unreachable (e.g. across open water)
  }
}

let heroScreenSelectedSlot = null;
function renderHeroScreen() {
  ctx.fillStyle = '#1a1408'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const hero = findHeroById(game.selectedHeroId);
  if (!hero) { game.screen = 'adventure'; return; }
  const fac = factionById(hero.factionId);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  drawButton(10, topBar + 8, 90, 34, t('back'), '#94a3b8', '#475569', () => { game.screen = 'adventure'; heroScreenSelectedSlot = null; });

  const heroSel = heroScreenSelectedSlot !== null && !!hero.army[heroScreenSelectedSlot]; // Disband shows in the header's right corner
  drawHeaderTitle(topBar, 10 + 90 + 10, (heroSel ? W - 14 - 100 : W) - 10, [hero.name + '  (Lv ' + hero.level + ')', hero.name]);

  // narrow (portrait phone): slim stats column, wider army column; compact (landscape phone):
  // army slots flow in two columns so all five stacks + their stats still fit the short screen
  const narrow = W < 600, compact = H < 480;
  const colW = narrow ? Math.floor(W * 0.36) : Math.min(260, W * 0.42);
  const rightW = (narrow || compact) ? W - colW - 42 : colW;
  const leftX = 14, rightX = W - rightW - 14;
  let y = topBar + 56;
  drawPanel(leftX, y, colW, 130, {});
  ctx.textAlign = 'left'; ctx.font = '700 13px sans-serif'; ctx.fillStyle = '#fff';
  const stats = [
    [t('attack'), hero.attack], [t('defense'), hero.defense],
    [t('spellPower'), hero.spellPower], [t('knowledge'), hero.knowledge],
    [t('movePts'), Math.round(hero.movePts) + '/' + hero.movePtsMax],
    [t('spellPts'), Math.round(hero.spellPts) + '/' + hero.spellPtsMax],
  ];
  stats.forEach((s, i) => ctx.fillText(s[0] + ': ' + s[1], leftX + 12, y + 18 + i * 19, colW - 20));

  y += 140;
  drawPanel(leftX, y, colW, 110, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('skills') + ':', leftX + 12, y + 16);
  ctx.font = '600 12px sans-serif'; ctx.fillStyle = '#fff';
  if (hero.skills.length === 0) ctx.fillText('—', leftX + 12, y + 38);
  hero.skills.forEach((s, i) => {
    const lvlName = [t('basic'), t('advanced'), t('expert')][s.level - 1];
    ctx.fillText(skillName(s.id) + ' (' + lvlName + ')', leftX + 12, y + 38 + i * 18, colW - 20);
  });

  // right column: army — every stack shows its stats and ranged/melee (with ammo)
  // slots shrink (down to 40px) on very short screens so the panel, its slots and the spellbook line all fit
  const cols = compact ? 2 : 1, rowsN = Math.ceil(5 / cols);
  const slotH = Math.max(40, Math.min(64, Math.floor((H - (topBar + 56) - 10 - 34 - 26) / rowsN) - 6));
  const panelH = Math.max(H - topBar - 56 - 60, 34 + rowsN * (slotH + 6) + 26);
  drawPanel(rightX, topBar + 56, rightW, panelH, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('army') + ':', rightX + 12, topBar + 72);
  const slotW = (rightW - 16 - (cols - 1) * 6) / cols;
  for (let i = 0; i < 5; i++) {
    const sx = rightX + 8 + (i % cols) * (slotW + 6);
    const sy = topBar + 90 + Math.floor(i / cols) * (slotH + 6);
    drawArmySlot(hero.army[i], sx, sy, slotW, slotH, heroScreenSelectedSlot === i);
    addButton(sx, sy, slotW, slotH, () => onHeroArmySlotTap(hero, i));
  }
  if (heroScreenSelectedSlot !== null && !hero.army[heroScreenSelectedSlot]) heroScreenSelectedSlot = null;
  if (heroScreenSelectedSlot !== null) drawDisbandControl(hero.army, heroScreenSelectedSlot, true, () => { heroScreenSelectedSlot = null; });

  // spellbook
  // (kept inside the army panel: the panel always reserves a line for it under the slots)
  const sbY = topBar + 90 + rowsN * (slotH + 6) + 6;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('spellbook') + ': ' + (hero.spells.length ? hero.spells.map(id => spellName(id)).join(', ') : '—'), rightX + 12, sbY + 8, rightW - 24);
}

// one army slot (hero screen + garrison screen): glyph, count, name, stats, ranged/melee.
// Short slots (< 58px, phone portrait garrison) fold the stats into one line; < 40px is a 2-line mode.
function drawArmySlot(stack, sx, sy, slotW, slotH, selected) {
  drawPanel(sx, sy, slotW, slotH, { fill: selected ? 'rgba(253,224,71,0.18)' : 'rgba(255,255,255,0.06)', stroke: selected ? '#fde047' : '#8a7a5c' });
  if (!stack) {

// ---- upgrading existing stacks in a castle ----
// DESIGN CHOICE (not derived from data: creatures have no separate upgraded cost): an upgraded
// unit is priced at base cost x 1.5, rounded up per resource; the price of upgrading is the
// difference, ceil(base * 1.5) - base per unit (>= 1 gold), times the unit count.
function upgradeCostFor(stack, count) {
  const cd = factionById(stack.factionId).creatures[stack.tier - 1];
  const n = count == null ? stack.count : count;
  const cost = {};
  for (const k of RESOURCE_KEYS) {
    const base = cd.cost[k] || 0;
    let diff = Math.ceil(base * 1.5) - base;
    if (k === 'gold') diff = Math.max(1, diff);
    if (diff > 0) cost[k] = diff * n;
  }
  return cost;
}
// generic over tier: works for any 'dwelling<tier>up' building that gets added later
function canUpgradeStack(castle, stack) {
  if (!castle || !stack || stack.factionId !== castle.factionId || stack.upgraded) return false;
  if (!castle.buildings['dwelling' + stack.tier + 'up']) return false;
  const cd = factionById(stack.factionId).creatures[stack.tier - 1];
  return !!(cd && cd.upgrade && cd.upDef);
}
function canAffordUpgrade(castle, stack) {
  const p = game.players[castle.ownerIdx], cost = upgradeCostFor(stack);
  for (const k in cost) if ((p.resources[k] || 0) < cost[k]) return false;
  return true;
}
function drawUpgradeControl(castle, stack, rightX) {
  if (!canUpgradeStack(castle, stack)) return;
  const topBar = chromeMetrics().topBar;
  const w = W < 600 ? 88 : 110, x = rightX - w;
  const ok = canAffordUpgrade(castle, stack);
  drawButton(x, topBar + 8, w, 34, t('upgradeUnit'), '#86efac', '#15803d', () => confirmUpgrade(castle, stack), { disabled: !ok, fontSize: 12, textColor: '#052e16' });
  return x;
}
function confirmUpgrade(castle, stack) {
  if (!canUpgradeStack(castle, stack)) { showMessage(t('upgradeUnit'), t('upgradeNotAvailable')); return; }
  const cd = factionById(stack.factionId).creatures[stack.tier - 1];
  const cost = upgradeCostFor(stack);
  const sub = t('upgradeConfirm', { n: stack.count, from: creatureDisplayName(stack), to: cd.upgrade }) +
    '\n' + upgradeDeltaText(cd) + '\n' + t('upgradeCost') + ': ' + costText(cost);
  showMessage(t('upgradeUnit'), sub, [
    { label: t('confirm'), cls: 'btn-gold', onClick: () => {
      // re-check: resources / stack may have changed while the dialog was open
      if (!canUpgradeStack(castle, stack)) return;
      if (!canAffordUpgrade(castle, stack)) { showMessage(t('upgradeUnit'), t('cannotAfford')); return; }
      const p = game.players[castle.ownerIdx], c = upgradeCostFor(stack);
      for (const k in c) p.resources[k] -= c[k];

    { label: t('cancel'), cls: 'btn-gray' },

}
function confirmDisband(army, i, isHero, onDone) {
  const stack = army[i];
  if (!stack) return;
  if (isHero && heroLastStack(army)) { showMessage(t('disband'), t('cantEmptyHero')); return; }
  showMessage(t('disband'), t('disbandConfirm', { n: stack.count, name: creatureDisplayName(stack) }), [
    { label: t('confirm'), cls: 'btn-red', onClick: () => {
      // re-check: the army may have changed while the dialog was open
      if (army[i] !== stack || (isHero && heroLastStack(army))) return;
      army[i] = null; onDone(); sfx.click(); saveGame();
    } },
    { label: t('cancel'), cls: 'btn-gray' },
  ]);
}

function onHeroArmySlotTap(hero, i) {

function drawCastleIllustration(cx, cy, h, ownerColor, factionId) {
  const u = h / 104;

  };
  const merlons = (x0, x1, y) => { for (let x = x0; x + 4 <= x1; x += 8) rect(x, y - 4, 4, 4, stoneDark); };
  const slit = (x, y) => { ctx.fillStyle = '#1f1408'; roundRect(x - 1.5, y, 3, 7, 1.5); ctx.fill(); };
  // central keep (behind the wall) with flag

  cone(-14, 14, -34, -54);
  ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, -54); ctx.lineTo(0, -66); ctx.stroke();
  ctx.lineWidth = 1.2; ctx.fillStyle = ownerColor;
  ctx.beginPath(); ctx.moveTo(0, -66); ctx.lineTo(16, -61); ctx.lineTo(0, -56); ctx.closePath(); ctx.fill(); ctx.stroke();
  slit(-4, -22); slit(4, -22); slit(0, -8);
  // side towers
  for (const sx of [-48, 26]) {
    rect(sx, -14, 22, 52, stone); rect(sx, -14, 7, 52, stoneLit); merlons(sx, sx + 22, -14);
    cone(sx + 1, sx + 21, -18, -38);
    slit(sx + 8, -2); slit(sx + 8, 14);

  rect(-26, 4, 52, 34, stone); rect(-26, 4, 52, 8, stoneLit); merlons(-26, 26, 4);
  ctx.strokeStyle = 'rgba(30,20,8,0.3)'; ctx.lineWidth = 0.8;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-26, 16 + k * 8); ctx.lineTo(-10, 16 + k * 8); ctx.moveTo(10, 16 + k * 8); ctx.lineTo(26, 16 + k * 8); ctx.stroke(); }
  ctx.fillStyle = '#2b1a0a'; ctx.beginPath(); ctx.moveTo(-9, 38); ctx.lineTo(-9, 22); ctx.arc(0, 22, 9, Math.PI, 0); ctx.lineTo(9, 38); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = line; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = '#c9a35c'; ctx.lineWidth = 0.9;
  for (const gx of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(gx, 15); ctx.lineTo(gx, 38); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-9, 26); ctx.lineTo(9, 26); ctx.stroke();
  ctx.restore();
}

function onGarrisonSlotTap(castle, which, i) {

// ============================================================
// SCREEN: CASTLE SCREEN
// ============================================================
// ---- castle building list: descriptions, costs, state; scrolls when it doesn't fit ----
// The castle screen has two scrollable zones: the buildings list ('list') and the recruit panel
// ('recruit'); the latter only scrolls when it doesn't fit (short landscape / small portrait screens).
let castleScroll = 0, castleScrollFor = null;
const castleDrag = { active: false, startY: 0, startScroll: 0, zone: 'list' };
let castleListRect = null, castleContentH = 0;
let recruitScroll = 0, recruitListRect = null, recruitContentH = 0;
function castleScrollClamp() {
  const maxS = castleListRect ? Math.max(0, castleContentH - castleListRect.h) : 0;
  castleScroll = Math.max(0, Math.min(maxS, castleScroll));
  const maxR = recruitListRect ? Math.max(0, recruitContentH - recruitListRect.h) : 0;
  recruitScroll = Math.max(0, Math.min(maxR, recruitScroll));
}
function castleZoneAt(px, py) {
  const inR = r => r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  if (inR(recruitListRect)) return 'recruit';
  if (inR(castleListRect)) return 'list';
  return null;
}
function castleScrollBy(zone, dy) {
  if (zone === 'recruit') recruitScroll += dy; else castleScroll += dy;
  castleScrollClamp();
}
function castleScrollDown(px, py) {
  const zone = castleZoneAt(px, py);
  if (zone) {
    castleDrag.active = true; castleDrag.zone = zone; castleDrag.startY = py;
    castleDrag.startScroll = zone === 'recruit' ? recruitScroll : castleScroll;
  }
}
function castleScrollMove(px, py) {
  if (!castleDrag.active) return;
  const v = castleDrag.startScroll - (py - castleDrag.startY);
  if (castleDrag.zone === 'recruit') recruitScroll = v; else castleScroll = v;
  castleScrollClamp();
}
function castleScrollUp() { castleDrag.active = false; }

function wrapLines(text, maxW) {
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function buildingLabel(def, fac) {
  if (!def.tier) return t('bld' + def.id.charAt(0).toUpperCase() + def.id.slice(1));
  const cdef = fac.creatures[def.tier - 1];
  return def.upgrade ? t('bldUpgrade', { name: cdef.upgrade }) : t('bldDwelling', { name: cdef.name });
}
// "Atk +1, Def +1, Dmg 1-3, HP +2 ..." — only the stats an upgrade actually improves
function upgradeDeltaText(cd) {
  const u = cd.upDef, out = [];
  if (u.atk > cd.atk) out.push(t('statAtk') + ' +' + (u.atk - cd.atk));
  if (u.def > cd.def) out.push(t('statDef') + ' +' + (u.def - cd.def));
  if (u.dmg[0] !== cd.dmg[0] || u.dmg[1] !== cd.dmg[1]) out.push(t('statDmg') + ' ' + u.dmg[0] + '-' + u.dmg[1]);
  if (u.hp > cd.hp) out.push(t('statHp') + ' +' + (u.hp - cd.hp));
  if (u.speed > cd.speed) out.push(t('statSpeed') + ' +' + (u.speed - cd.speed));
  if (cd.ranged && u.ammo > cd.ammo) out.push('🏹 +' + (u.ammo - cd.ammo));
  return out.join(', ');
}
function buildingDescText(def, fac) {
  if (def.tier) {
    const cdef = fac.creatures[def.tier - 1];
    if (def.upgrade) return t('descUpgrade', { up: cdef.upgrade, name: cdef.name }) + ' ' + t('upgradeBonus', { list: upgradeDeltaText(cdef) });
    return t(cdef.ranged ? 'descDwellingR' : 'descDwellingM', { name: cdef.name, ammo: cdef.ammo, growth: cdef.growth });
  }
  const inc = def.incomePerLevel || [];
  return t(def.descKey, { a: inc[0], b: inc[1], c: inc[2] });
}
// state of one building row: built / ready / blocked (+ the reason) — mirrors canBuild()
function buildingState(castle, def, fac) {
  const curLevel = castle.buildings[def.id] || 0;
  if (curLevel >= def.maxLevel) return { kind: 'built', curLevel };
  const cost = def.cost[curLevel];
  const p = game.players[castle.ownerIdx];
  const missing = RESOURCE_KEYS.filter(k => cost[k] && (p.resources[k] || 0) < cost[k]);
  let reason = null;
  if (def.requires && !castle.buildings[def.requires]) reason = t('needsBuilding', { name: buildingLabel(buildingDef(def.requires), fac) });
  else if (missing.length) reason = t('needMore', { list: missing.map(k => RESOURCE_ICON[k] + ' ' + (cost[k] - (p.resources[k] || 0))).join(' ') });
  else if (castle.builtThisTurn) reason = t('alreadyBuiltThisTurn');
  return { kind: reason ? 'blocked' : 'ready', curLevel, cost, missing, reason };
}

function renderCastle() {
  ctx.fillStyle = '#1a1408'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;

  if (!castle) { game.screen = 'adventure'; return; }

  if (castleScrollFor !== castle.id) { castleScrollFor = castle.id; castleScroll = 0; recruitScroll = 0; }
  drawButton(10, topBar + 8, 90, 34, t('back'), '#94a3b8', '#475569', () => { game.screen = 'adventure'; });
  const openGarrison = () => { sfx.click(); game.selectedCastleId = castle.id; garrisonSel = null; game.screen = 'garrison'; };
  const garrisonLabel = '🏰 ' + t('garrison');
  // wide: garrison button sits in the header (right), where it can't collide with the recruit rows;
  // narrow: it goes at the bottom of the recruit panel instead (the header is too tight for it)
  const narrowHdr = W < 600;
  if (!narrowHdr) drawButton(W - 14 - 130, topBar + 8, 130, 34, garrisonLabel, '#fbbf24', '#b45309', openGarrison, { fontSize: 13 });
  // Hire Hero (tavern): wide screens put it in the header next to Back; narrow ones at the bottom of the recruit panel
  const hasTavern = !!castle.buildings.tavern && castle.ownerIdx === game.turn.playerIdx;
  const hireLabel = '🍻 ' + t('hireHero');
  const openHire = () => { sfx.click(); openHireHeroModal(castle); };
  const hireBtnW = 150;
  if (hasTavern && !narrowHdr) drawButton(10 + 90 + 8, topBar + 8, hireBtnW, 34, hireLabel, '#fcd34d', '#b45309', openHire, { fontSize: 13 });
  drawHeaderTitle(topBar, 10 + 90 + (hasTavern && !narrowHdr ? 8 + hireBtnW : 0) + 10, (narrowHdr ? W : W - 14 - 130) - 10, [castle.name + ' — ' + fac.name, castle.name]);

  // wide screens: buildings left, recruit right. narrow (portrait): recruit panel on top
  // (sized to its content), the scrollable buildings list underneath.
  const narrow = W < 600;
  const y = topBar + 56;
  const dwellTiers = [1, 2, 3, 4, 5].filter(tier => castle.buildings['dwelling' + tier]);
  const guildLvl = castle.buildings.mageGuild || 0;
  const recruitNeedH = 40 + dwellTiers.length * 46 + (guildLvl > 0 ? 50 : 0) + 6 + (narrow ? 46 + (hasTavern ? 44 : 0) : 0) + 4;
  let L, R;
  if (narrow) {
    // the recruit panel never takes more than leaves the buildings list ~150px; beyond that it scrolls
    R = { x: 14, y, w: W - 28, h: Math.min(recruitNeedH, Math.max(120, H - 10 - y - 8 - 150)) };
    L = { x: 14, y: y + R.h + 8, w: W - 28, h: H - (y + R.h + 8) - 10 };
  } else {
    const lw = Math.min(W * 0.56, 460), rw = Math.min(280, W - lw - 42);
    L = { x: 14, y, w: lw, h: H - topBar - 56 - 14 };
    R = { x: W - rw - 14, y, w: rw, h: H - topBar - 56 - 14 };
  }

  // ---- buildings panel ----
  drawPanel(L.x, L.y, L.w, L.h, {});
  ctx.textAlign = 'left'; ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif';
  ctx.fillText(t('buildings') + (castle.builtThisTurn ? ' — ' + t('alreadyBuiltThisTurn') : ''), L.x + 12, L.y + 18, L.w - 24);
  const view = { x: L.x + 4, y: L.y + 32, w: L.w - 8, h: L.h - 36 };
  castleListRect = view;
  // Build button grows to fit its label ("Construiește" in Romanian is wider than "Build")
  ctx.font = '800 11px sans-serif';
  const rowW = view.w - 12, btnW = Math.max(62, Math.ceil(ctx.measureText(t('build')).width) + 18);
  // measure pass
  const rows = [];
  let total = 0;
  for (const def of BUILDING_DEFS) {
    const st = buildingState(castle, def, fac);
    const textW = rowW - 16 - (st.kind === 'built' ? 0 : btnW + 6);
    ctx.font = '600 10.5px sans-serif';
    const descLines = wrapLines(buildingDescText(def, fac), textW);
    // cost entries flow onto as many lines as needed
    ctx.font = '700 11px sans-serif';
    const costLines = [[]]; let cw = 0;
    if (st.kind !== 'built') {
      for (const k of RESOURCE_KEYS) {
        if (!st.cost[k]) continue;
        const txt = RESOURCE_ICON[k] + ' ' + st.cost[k];
        const w = ctx.measureText(txt).width + 12;
        if (cw + w > textW && costLines[costLines.length - 1].length) { costLines.push([]); cw = 0; }
        costLines[costLines.length - 1].push({ k, txt, w, lack: st.missing.indexOf(k) >= 0 });
        cw += w;
      }
    }
    ctx.font = '700 10.5px sans-serif';
    const stateText = st.kind === 'built' ? '✓ ' + t('built') : (st.kind === 'ready' ? '✔ ' + t('bldReady') : '✕ ' + st.reason);
    const stateLines = wrapLines(stateText, textW);
    const nCost = st.kind === 'built' ? 0 : costLines.length;
    const h = 8 + 16 + descLines.length * 13 + nCost * 15 + stateLines.length * 13 + 6;
    rows.push({ def, st, descLines, costLines, stateLines, textW, h, y: total });
    total += h + 6;
  }
  castleContentH = total;
  castleScrollClamp();
  ctx.save();
  ctx.beginPath(); ctx.rect(view.x, view.y, view.w, view.h); ctx.clip();
  for (const r of rows) {
    const ry = view.y + r.y - castleScroll;
    if (ry + r.h < view.y || ry > view.y + view.h) continue;
    const rx = view.x + 2;
    const { def, st } = r;
    const built = st.kind === 'built';
    drawPanel(rx, ry, rowW, r.h, { fill: built ? 'rgba(74,222,128,0.12)' : 'rgba(255,255,255,0.05)', stroke: built ? '#4ade80' : (st.kind === 'ready' ? '#86efac' : '#8a7a5c'), lineWidth: 1.5 });
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.font = '800 12px sans-serif';
    const lvlTag = def.maxLevel > 1 ? '  ·  ' + t('bldLevel', { n: st.curLevel, max: def.maxLevel }) : '';
    ctx.fillText(buildingLabel(def, fac) + lvlTag, rx + 8, ry + 16, r.textW);
    let ty = ry + 8 + 16;
    ctx.font = '600 10.5px sans-serif'; ctx.fillStyle = '#cbd5e1';
    for (const l of r.descLines) { ctx.fillText(l, rx + 8, ty + 6); ty += 13; }
    ctx.font = '700 11px sans-serif';
    for (const line of r.costLines) {
      let cx = rx + 8;
      for (const e of line) { ctx.fillStyle = e.lack ? '#fca5a5' : '#fde68a'; ctx.fillText(e.txt, cx, ty + 7); cx += e.w; }
      if (line.length) ty += 15;
    }
    ctx.font = '700 10.5px sans-serif';
    ctx.fillStyle = built ? '#4ade80' : (st.kind === 'ready' ? '#86efac' : '#fb923c');
    for (const l of r.stateLines) { ctx.fillText(l, rx + 8, ty + 6); ty += 13; }
    if (!built) {
      const ok = st.kind === 'ready';
      const bx = rx + rowW - btnW - 6, by = ry + 6, bh = 30;
      drawButton(bx, by, btnW, bh, ok ? t('build') : '✕', ok ? '#4ade80' : '#6b6b6b', ok ? '#16a34a' : '#444', null, { disabled: !ok, fontSize: 11 });
      if (ok) {
        // hit rect clipped to the visible list so a half-scrolled-away button can't be pressed
        const cy0 = Math.max(by, view.y), cy1 = Math.min(by + bh, view.y + view.h);
        if (cy1 - cy0 > 8) addButton(bx, cy0, btnW, cy1 - cy0, () => {
          if (buildInCastle(castle, def.id)) showMessage(t('build'), buildingLabel(def, fac), [{ label: t('ok') }]);
        });
      }
    }
  }
  ctx.restore();
  if (castleContentH > view.h) { // scroll thumb
    const th = Math.max(20, view.h * view.h / castleContentH);
    const tyy = view.y + (view.h - th) * (castleScroll / (castleContentH - view.h));
    ctx.fillStyle = 'rgba(253,230,138,0.55)';
    roundRect(view.x + view.w - 4, tyy, 3, th, 1.5); ctx.fill();
  }

  // ---- recruit + garrison panel ----
  drawPanel(R.x, R.y, R.w, R.h, {});
  ctx.fillStyle = '#fde68a'; ctx.font = '800 13px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('recruit') + ':', R.x + 12, R.y + 18);
  // the rows live in a clipped, scrollable view (same mechanics as the buildings list); when the
  // panel is tall enough for everything the content simply fits and nothing scrolls
  const rview = { x: R.x + 4, y: R.y + 32, w: R.w - 8, h: R.h - 36 };
  recruitListRect = rview; recruitContentH = recruitNeedH - 36;
  castleScrollClamp();
  ctx.save();
  ctx.beginPath(); ctx.rect(rview.x, rview.y, rview.w, rview.h); ctx.clip();
  let ry = rview.y + 8 - recruitScroll;
  const recruitBtnW = Math.min(88, R.w - 24);
  for (const tier of dwellTiers) {
    const avail = castleAvailableToRecruit(castle, tier);
    const upgraded = !!castle.buildings['dwelling' + tier + 'up'];
    const cdef = fac.creatures[tier - 1];
    const name = upgraded ? cdef.upgrade : cdef.name;
    drawPanel(R.x + 8, ry, R.w - 16, 40, { fill: 'rgba(255,255,255,0.05)', stroke: '#8a7a5c' });
    drawCreatureGlyph(cdef.shape, R.x + 30, ry + 21, 17, cdef.color, upgraded);
    ctx.fillStyle = '#fff'; ctx.font = '700 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(name + ' (' + avail + ')', R.x + 52, ry + 20, R.w - 52 - recruitBtnW - 16);
    // button sized to fit the full (untruncated) label so its drawn geometry always
    // matches its registered hit rect — a too-narrow button was the earlier symptom here
    const rbx = R.x + R.w - 8 - recruitBtnW, rby = ry + 3, rbh = 34;
    drawButton(rbx, rby, recruitBtnW, rbh, t('recruit'), avail > 0 ? '#4ade80' : '#6b6b6b', avail > 0 ? '#16a34a' : '#444', null, { disabled: avail <= 0, fontSize: 12 });
    if (avail > 0) addClippedButton(rbx, rby, recruitBtnW, rbh, rview, () => openRecruitModal(castle, tier));
    ry += 46;
  }
  if (guildLvl > 0) {
    const hero = findHeroById(game.selectedHeroId);
    drawButton(R.x + 8, ry + 8, R.w - 16, 38, '📖 ' + t('spellbook'), '#a78bfa', '#6d28d9', null, { disabled: !hero });
    if (hero) addClippedButton(R.x + 8, ry + 8, R.w - 16, 38, rview, () => openLearnSpellsModal(castle, hero, guildLvl));
    ry += 50;
  }
  if (narrow) {
    drawButton(R.x + 8, ry + 2, R.w - 16, 38, garrisonLabel, '#fbbf24', '#b45309', null);
    addClippedButton(R.x + 8, ry + 2, R.w - 16, 38, rview, openGarrison);
    if (hasTavern) {
      drawButton(R.x + 8, ry + 46, R.w - 16, 38, hireLabel, '#fcd34d', '#b45309', null);
      addClippedButton(R.x + 8, ry + 46, R.w - 16, 38, rview, openHire);
    }
  }
  ctx.restore();
  if (recruitContentH > rview.h) { // scroll thumb
    const th = Math.max(20, rview.h * rview.h / recruitContentH);
    const tyy = rview.y + (rview.h - th) * (recruitScroll / (recruitContentH - rview.h));
    ctx.fillStyle = 'rgba(253,230,138,0.55)';
    roundRect(rview.x + rview.w - 3, tyy, 3, th, 1.5); ctx.fill();
  }
}

function openLearnSpellsModal(castle, hero, guildLvl) {
  const maxLvl = Math.min(guildLvl, heroMaxSpellLevel(hero));
  const learnable = SPELL_DEFS.filter(s => s.level <= maxLvl && !hero.spells.includes(s.id));
  showListModal(t('spellbook'), hero.name, learnable.map(s => ({
    label: spellName(s.id) + ' (Lv' + s.level + ', ' + s.cost + ' SP)',
    onClick: () => { hero.spells.push(s.id); hideListModal(); sfx.spell(); saveGame(); },
  })), [{ label: t('close') }]);
}

// dest: 'hero' | 'garrison' | undefined. With a hero present and no dest yet, step 1 asks
// where the troops go (two big buttons — fits a phone better than doubling the count rows);
// step 2 is the usual Max / 1 / 5. With no hero the garrison is the only target (as before).
function openRecruitModal(castle, tier, dest) {
  const hero = heroAtCastle(castle);
  if (!hero) dest = 'garrison';
  const avail = castleAvailableToRecruit(castle, tier);
  const fac = factionById(castle.factionId);
  const cd = fac.creatures[tier - 1];
  const upgraded = !!castle.buildings['dwelling' + tier + 'up'];
  const shown = upgraded ? cd.upDef : cd;
  const where = !hero ? t('recruitToGarrison')
    : dest === 'hero' ? t('toHero') + ': ' + hero.name
    : dest === 'garrison' ? t('toGarrison')
    : t('toHero') + ': ' + hero.name + '  /  ' + t('toGarrison');
  const sub = where + '\n' +
    (upgraded ? cd.upgrade : cd.name) + '\n' +
    creatureStatLine1(shown) + ' · ' + creatureStatLine2(shown) + '\n' +
    creatureRangeLabel(shown) + '\n' +
    t('costEach') + ': ' + costText(cd.cost);
  if (!dest) {
    showListModal(t('recruitTitle'), sub, [
      { label: t('toHero') + ' (' + hero.name + ')', onClick: () => { hideListModal(); openRecruitModal(castle, tier, 'hero'); } },
      { label: t('toGarrison'), onClick: () => { hideListModal(); openRecruitModal(castle, tier, 'garrison'); } },
    ], [{ label: t('close') }]);
    return;
  }
  const doRecruit = (count) => {
    const ok = dest === 'hero' ? recruitFromCastle(castle, hero, tier, count) : recruitIntoGarrison(castle, tier, count);
    hideListModal();
    if (!ok) showMessage(t('recruitFailed'), '', [{ label: t('ok') }]);
  };
  showListModal(t('recruitTitle'), sub, [
    { label: t('max') + ' (' + avail + ')', onClick: () => doRecruit(avail) },
    { label: '1', onClick: () => doRecruit(1) },
    { label: '5', onClick: () => doRecruit(5) },
  ], [{ label: t('close') }]);
}

// ============================================================
// SCREEN: COMBAT
// ============================================================
let combatCellSize = 30;
let combatLay = null; // layout cache, rebuilt every renderCombat() (ignored if the viewport changed since)
function combatLayCur() { return (combatLay && combatLay.sig === W + 'x' + H) ? combatLay : combatLayout(); }
const COMBAT_HEADER_H = 78; // room for round counter + active stack name + turn order row (stacked layout)
// two layouts: a right-hand control panel on short landscape screens (so the grid gets the full
// height and cells stay big enough to read counts / HP / ranged badges), a stacked column otherwise
function combatLayout() {
  const topBar = chromeMetrics().topBar;
  if (W > H && H < 560) {
    const panelW = Math.max(196, Math.min(270, W * 0.3));
    const availH = H - topBar - 10;
    const cell = Math.max(14, Math.min(44, availH / COMBAT_H, (W - panelW - 34) / COMBAT_W));
    const gridW = cell * COMBAT_W, gridH = cell * COMBAT_H;
    const gx = Math.max(8, (W - (gridW + 14 + panelW)) / 2);
    const gy = topBar + 5 + (availH - gridH) / 2;
    return { sig: W + 'x' + H, side: true, cell, gx, gy, panel: { x: gx + gridW + 14, y: topBar + 6, w: panelW, h: H - topBar - 12 } };
  }
  const cols = W < 560 ? 3 : 5;
  const barH = cols === 3 ? 84 : 38;
  const tail = 12 + barH + 8 + 3 * 14 + 6;
  const usableH = H - topBar - COMBAT_HEADER_H - tail - 8;
  const cell = Math.max(14, Math.min(60, (W - 20) / COMBAT_W, usableH / COMBAT_H));
  const gridH = cell * COMBAT_H;
  const top = topBar + Math.max(2, (H - topBar - (COMBAT_HEADER_H + gridH + tail)) / 2);
  return { sig: W + 'x' + H, side: false, cell, cols, barH, headerY: top, gx: W / 2 - cell * COMBAT_W / 2, gy: top + COMBAT_HEADER_H, barY: top + COMBAT_HEADER_H + gridH + 12 };
}
function combatOrigin() { const L = combatLayCur(); return { x: L.gx, y: L.gy }; }
function computeCombatCellSize() { return combatLayCur().cell; }
function combatCellToScreen(x, y) {
  const o = combatOrigin(), cs = computeCombatCellSize();
  return { x: o.x + x * cs, y: o.y + y * cs };
}
function combatScreenToCell(px, py) {
  const o = combatOrigin(), cs = computeCombatCellSize();
  return { x: Math.floor((px - o.x) / cs), y: Math.floor((py - o.y) / cs) };
}

// ranged marker: a small gold bow-and-arrow on a dark pill in the top-left of the stack's cell,
// with the remaining ammo beside it (grey bow + red 0 once the stack is out of ammo). On very small
// cells the pill shrinks to just the bow so it never spills into the neighbouring cell.
function drawRangedBadge(cx, cy, cs, ammo) {
  const out = ammo <= 0;
  const compact = cs < 26;
  const r = compact ? Math.max(3, cs * 0.16) : Math.max(4, cs * 0.17);
  const fontPx = Math.max(9, Math.round(cs * 0.3));
  ctx.save();
  ctx.font = '800 ' + fontPx + 'px sans-serif';
  const label = String(ammo);
  const pillW = compact ? r * 2 + 4 : r * 2 + 4 + ctx.measureText(label).width + 3;
  const pillH = compact ? r * 2 + 3 : Math.max(r * 2 + 2, fontPx + 2);
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  roundRect(cx + 1, cy + 1, pillW, pillH, pillH / 2); ctx.fill();
  const bx = cx + 3 + r * 0.7, by = cy + 1 + pillH / 2;
  ctx.strokeStyle = out ? '#9ca3af' : '#fde047'; ctx.lineWidth = Math.max(1.2, cs * 0.05);
  ctx.beginPath(); ctx.arc(bx - r * 0.2, by, r, -Math.PI * 0.42, Math.PI * 0.42); ctx.stroke(); // bow
  ctx.beginPath(); ctx.moveTo(bx - r * 0.2 + r * Math.cos(Math.PI * 0.42), by - r * Math.sin(Math.PI * 0.42));
  ctx.lineTo(bx - r * 0.2 + r * Math.cos(Math.PI * 0.42), by + r * Math.sin(Math.PI * 0.42)); ctx.stroke(); // string
  ctx.beginPath(); ctx.moveTo(bx - r * 0.9, by); ctx.lineTo(bx + r * 1.1, by); ctx.stroke(); // arrow
  if (!compact) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = out ? '#f87171' : '#fff';
    ctx.fillText(label, cx + 3 + r * 2 + 2, by + 1);
  } else if (out) {
    ctx.strokeStyle = '#f87171'; ctx.beginPath(); ctx.moveTo(cx + 2, cy + pillH); ctx.lineTo(cx + pillW, cy + 2); ctx.stroke();
  }
  ctx.restore();
}

// stone wall down the WALL_X column with towers, and an open dirt gate — see makeSiegeWalls()
function drawSiegeWalls(c, cs) {
  const w = c.walls;
  const defStack = c.stacks.find(s => s.side === 'defender');
  const flag = defStack ? factionById(defStack.factionId).primary : '#c9a35c';
  // dirt road through the gate
  for (const gy of w.gateRows) {
    const s = combatCellToScreen(w.gateX, gy);
    ctx.fillStyle = '#a98a5a'; ctx.fillRect(s.x, s.y, cs - 1, cs - 1);
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(s.x + cs * 0.2, s.y + cs * 0.35, cs * 0.18, cs * 0.1); ctx.fillRect(s.x + cs * 0.6, s.y + cs * 0.65, cs * 0.16, cs * 0.1);
  }
  for (const cell of w.cells) {
    const s = combatCellToScreen(cell.x, cell.y);
    const x0 = s.x + cs * 0.14, ww = cs * 0.72;
    ctx.fillStyle = '#8f7e68'; ctx.fillRect(x0, s.y, ww, cs);             // wall slab (cells join into one wall)
    ctx.fillStyle = '#b3a288'; ctx.fillRect(x0, s.y, ww * 0.34, cs);      // lit face
    ctx.strokeStyle = 'rgba(40,28,14,0.45)'; ctx.lineWidth = 1;
    for (let k = 1; k < 4; k++) { ctx.beginPath(); ctx.moveTo(x0, s.y + cs * k / 4); ctx.lineTo(x0 + ww, s.y + cs * k / 4); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(40,28,14,0.7)'; ctx.strokeRect(x0, s.y, ww, cs);
    if (cell.tower) {                                                     // round tower: merlon ring, dark roof, faction pennant
      const tx = s.x + cs / 2, ty = s.y + cs / 2, tr = cs * 0.47;
      ctx.fillStyle = '#7d6c58'; ctx.beginPath(); ctx.arc(tx, ty, tr, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b3a288';
      for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; ctx.fillRect(tx + Math.cos(a) * tr * 0.82 - cs * 0.06, ty + Math.sin(a) * tr * 0.82 - cs * 0.06, cs * 0.12, cs * 0.12); }
      ctx.fillStyle = '#5b4d3d'; ctx.beginPath(); ctx.arc(tx, ty, tr * 0.6, 0, 7); ctx.fill();
      ctx.strokeStyle = '#2b1d0e'; ctx.lineWidth = Math.max(1, cs * 0.05);
      ctx.beginPath(); ctx.moveTo(tx, ty + tr * 0.3); ctx.lineTo(tx, ty - tr * 0.75); ctx.stroke();
      ctx.fillStyle = flag; ctx.beginPath(); ctx.moveTo(tx, ty - tr * 0.75); ctx.lineTo(tx + tr * 0.7, ty - tr * 0.5); ctx.lineTo(tx, ty - tr * 0.25); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {                                                              // battlement teeth on both faces
      ctx.fillStyle = '#6f5f4b';
      for (let k = 0; k < 2; k++) { ctx.fillRect(x0 - cs * 0.06, s.y + cs * (0.12 + k * 0.5), cs * 0.1, cs * 0.26); ctx.fillRect(x0 + ww - cs * 0.04, s.y + cs * (0.12 + k * 0.5), cs * 0.1, cs * 0.26); }
    }
  }
  // gate: two open wooden door leaves + a lintel beam so the opening reads as a gate
  const g0 = combatCellToScreen(w.gateX, w.gateRows[0]), g1 = combatCellToScreen(w.gateX, w.gateRows[w.gateRows.length - 1]);
  ctx.fillStyle = '#6b4423'; ctx.strokeStyle = 'rgba(30,15,0,0.8)'; ctx.lineWidth = 1;
  ctx.fillRect(g0.x + cs * 0.1, g0.y - cs * 0.02, cs * 0.8, cs * 0.14); ctx.strokeRect(g0.x + cs * 0.1, g0.y - cs * 0.02, cs * 0.8, cs * 0.14);
  ctx.fillRect(g1.x + cs * 0.1, g1.y + cs - cs * 0.14, cs * 0.8, cs * 0.14); ctx.strokeRect(g1.x + cs * 0.1, g1.y + cs - cs * 0.14, cs * 0.8, cs * 0.14);
  ctx.fillStyle = '#e5c07b';
  for (const yy of [g0.y + cs * 0.03, g1.y + cs - cs * 0.11]) for (const xx of [0.24, 0.5, 0.76]) ctx.fillRect(g0.x + cs * xx - 1, yy, 2, 2);
}

function drawCombatButtonRows(list, x, y, w, cols, btnH, gap, fontSize) {
  const rows = [];
  for (let i = 0; i < list.length; i += cols) rows.push(list.slice(i, i + cols));
  const bw = (w - gap * (cols - 1)) / cols;
  rows.forEach((row, ri) => {
    const rw = row.length * bw + (row.length - 1) * gap;
    let bx = x + (w - rw) / 2;
    const by = y + ri * (btnH + gap);
    for (const b of row) {
      drawButton(bx, by, bw, btnH, b.label, b.top, b.bot, b.onClick, { disabled: b.disabled, fontSize });
      bx += bw + gap;
    }
  });
  return rows.length * (btnH + gap) - gap;
}

function renderCombat() {
  combatLay = combatLayout();
  const L = combatLay;
  combatCellSize = L.cell;
  const cs = combatCellSize;
  ctx.fillStyle = '#0f1a12'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const c = game.combat;
  if (!c) { game.screen = 'adventure'; return; }
  const o = combatOrigin();
  const activeStack = currentActorStack();
  const isHumanTurn = !!(activeStack && !combatSideIsAI(activeStack.side));
  const reach = (isHumanTurn && !c.targeting) ? combatReachable(activeStack) : new Map();
  const tg = c.targeting;
  if (tg && (!isHumanTurn || c.result)) c.targeting = null;

  // ---- status text: round, active stack (or the targeting hint), turn-order chips
  const statusText = () => {
    if (c.targeting) return { text: t('spellPickTarget', { spell: spellName(c.targeting.spellId) }), color: '#fde047' };
    if (!activeStack) return null;
    const acd = creatureRef(activeStack);
    const rangeNote = acd.ranged ? (activeStack.ammo > 0 ? '🏹 ' + t('shotsLabel', { n: activeStack.ammo }) : t('noAmmo')) : '⚔️ ' + t('meleeLabel');
    return { text: t('stackTurn', { name: creatureDisplayName(activeStack) }) + ' — ' + rangeNote, color: activeStack.side === 'attacker' ? '#93c5fd' : '#fca5a5' };
  };
  const aliveOrder = c.order.map(id => c.stacks.find(s => s.id === id)).filter(s => s && s.alive);
  const drawChips = (x0, y0, maxW, center) => {
    const chip = 20, gap = 4, per = Math.max(1, Math.floor((maxW + gap) / (chip + gap)));
    let rowsUsed = 0;
    for (let i = 0; i < aliveOrder.length; i += per) {
      const row = aliveOrder.slice(i, i + per);
      const rowW = row.length * (chip + gap) - gap;
      let ox = center ? x0 + (maxW - rowW) / 2 : x0;
      const oy = y0 + rowsUsed * (chip + gap);
      row.forEach(s => {
        const isCur = activeStack && s.id === activeStack.id;
        ctx.fillStyle = isCur ? 'rgba(253,224,71,0.9)' : 'rgba(255,255,255,0.14)';
        roundRect(ox, oy, chip, chip, 5); ctx.fill();
        ctx.strokeStyle = isCur ? '#fde047' : (s.side === 'attacker' ? '#60a5fa' : '#f87171'); ctx.lineWidth = isCur ? 1.5 : 1; ctx.stroke();
        drawCreatureGlyph(creatureRef(s).shape, ox + chip / 2, oy + chip / 2, chip * 0.5, creatureColor(s), s.upgraded);
        ox += chip + gap;
      });
      rowsUsed++;
    }
    return rowsUsed * (chip + gap) - gap;
  };
  const actorSide = activeStack ? activeStack.side : 'attacker';
  const actorHero = actorSide === 'attacker' ? combatAttackerHero() : combatDefenderHero();
  const canCast = isHumanTurn && actorHero && actorHero.spells.some(id => spellDef(id).school === 'combat') && !c.sideCast[actorSide] && !c.targeting;
  const canFlee = isHumanTurn && actorHero && !c.targeting;
  const buttons = [
    c.targeting
      ? { label: t('spellCancel'), top: '#f87171', bot: '#b91c1c', onClick: combatCancelTargeting }
      : { label: t('castSpell'), top: '#a78bfa', bot: '#6d28d9', onClick: canCast ? (() => openCombatSpellModal(actorSide, actorHero)) : null, disabled: !canCast },
    { label: t('defend'), top: '#38bdf8', bot: '#0284c7', onClick: isHumanTurn && !c.targeting ? humanDefend : null, disabled: !isHumanTurn || !!c.targeting },
    { label: t('wait'), top: '#94a3b8', bot: '#475569', onClick: isHumanTurn && !c.targeting ? humanWait : null, disabled: !isHumanTurn || !!c.targeting },
    { label: t('flee'), top: '#fbbf24', bot: '#b45309', onClick: canFlee ? (() => combatFlee(actorSide)) : null, disabled: !canFlee },
    { label: t('surrender'), top: '#f87171', bot: '#b91c1c', onClick: canFlee ? (() => combatSurrender(actorSide)) : null, disabled: !canFlee },
  ];
  const logLines = c.log.slice(-3);

  if (L.side) {
    const P = L.panel;
    drawPanel(P.x, P.y, P.w, P.h, { fill: 'rgba(0,0,0,0.35)', stroke: 'rgba(201,163,92,0.5)', lineWidth: 1.5 });
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4c95d'; ctx.font = '900 14px sans-serif';
    ctx.fillText(t('combatRound') + ' ' + c.round, P.x + P.w / 2, P.y + 14);
    let py = P.y + 34;
    const st = statusText();
    if (st) {
      ctx.font = '700 11px sans-serif'; ctx.fillStyle = st.color;
      const lines = wrapLines(st.text, P.w - 14).slice(0, 3);
      lines.forEach((l, i) => ctx.fillText(l, P.x + P.w / 2, py + i * 13));
      py += lines.length * 13 + 2;
    }
    py += drawChips(P.x + 8, py, P.w - 16, true) + 8;
    py += drawCombatButtonRows(buttons, P.x + 8, py, P.w - 16, 2, 30, 5, 10) + 8;
    ctx.textAlign = 'left'; ctx.font = '600 10.5px sans-serif'; ctx.fillStyle = '#d1fae5';
    logLines.forEach((l, i) => { if (py + 12 + i * 13 < P.y + P.h) ctx.fillText(l, P.x + 8, py + 6 + i * 13, P.w - 14); });
  } else {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f4c95d'; ctx.font = '900 15px sans-serif';
    ctx.fillText(t('combatRound') + ' ' + c.round, W / 2, L.headerY + 15);
    const st = statusText();
    if (st) { ctx.font = '700 12px sans-serif'; ctx.fillStyle = st.color; ctx.fillText(st.text, W / 2, L.headerY + 33, W - 16); }
    drawChips(10, L.headerY + 46, W - 20, true);
  }

  // ---- grid
  for (let y = 0; y < COMBAT_H; y++) {
    for (let x = 0; x < COMBAT_W; x++) {
      const s = combatCellToScreen(x, y);
      ctx.fillStyle = (x + y) % 2 === 0 ? '#3a6b3f' : '#356338';
      ctx.fillRect(s.x, s.y, cs - 1, cs - 1);
      if (reach.has(x + ',' + y)) { ctx.fillStyle = 'rgba(96,152,232,0.62)'; ctx.fillRect(s.x, s.y, cs - 1, cs - 1); }
    }
  }
  if (c.walls) drawSiegeWalls(c, cs);

  // ---- stacks
  const tgIds = c.targeting ? c.targeting.valid : null;
  const pulse = 0.55 + 0.45 * Math.sin(Date.now() / 170);
  for (const st of c.stacks) {
    if (!st.alive) continue;
    const s = combatCellToScreen(st.x, st.y);
    const isActive = activeStack && activeStack.id === st.id;
    if (isActive && !c.targeting) { ctx.fillStyle = 'rgba(253,224,71,0.22)'; ctx.fillRect(s.x, s.y, cs - 1, cs - 1); ctx.strokeStyle = '#fde047'; ctx.lineWidth = Math.max(2, cs * 0.07); ctx.strokeRect(s.x + 1, s.y + 1, cs - 3, cs - 3); }
    drawCreatureGlyph(creatureRef(st).shape, s.x + cs / 2, s.y + cs * 0.47, cs * 0.5, creatureColor(st), st.upgraded);
    // side pip
    ctx.fillStyle = st.side === 'attacker' ? '#60a5fa' : '#f87171';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x + cs - Math.max(4, cs * 0.14), s.y + Math.max(4, cs * 0.14), Math.max(2.5, cs * 0.09), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // HP bar along the bottom
    const hpFrac = Math.max(0, Math.min(1, st.hpMax ? st.hp / st.hpMax : 1));
    const barH = Math.max(3, cs * 0.1), barW = cs - 4;
    const barX = s.x + 2, barY = s.y + cs - barH - 2;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
    ctx.fillStyle = hpFrac > 0.5 ? '#4ade80' : (hpFrac > 0.25 ? '#fbbf24' : '#f87171');
    ctx.fillRect(barX, barY, Math.max(0, barW * hpFrac), barH);
    // creature count in a dark pill (bottom-right, just above the bar) — legible on any colour
    const fontPx = Math.max(9, Math.min(14, Math.round(cs * 0.3)));
    ctx.font = '800 ' + fontPx + 'px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const label = String(st.count), tw = ctx.measureText(label).width;
    const pillH = fontPx + 2, pillW = tw + 6, px = s.x + cs - 2 - pillW, py = barY - 1 - pillH;
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; roundRect(px, py, pillW, pillH, pillH / 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(label, px + pillW - 3, py + pillH / 2 + 0.5);
    if (creatureRanged(st)) drawRangedBadge(s.x, s.y, cs, st.ammo);
    // spell targeting: pulse the valid stacks, dim everything else
    if (tgIds) {
      if (tgIds.includes(st.id)) {
        const heal = spellDef(c.targeting.spellId).kind === 'heal';
        ctx.fillStyle = heal ? 'rgba(74,222,128,0.28)' : 'rgba(248,113,113,0.28)'; ctx.fillRect(s.x, s.y, cs - 1, cs - 1);
        ctx.strokeStyle = (heal ? 'rgba(134,239,172,' : 'rgba(253,224,71,') + pulse + ')'; ctx.lineWidth = Math.max(2.5, cs * 0.1);
        ctx.strokeRect(s.x + 1.5, s.y + 1.5, cs - 4, cs - 4);
      } else { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(s.x, s.y, cs - 1, cs - 1); }
    }
    addButton(s.x, s.y, cs, cs, () => { if (c.targeting) combatTapSpellTarget(st); else humanActOnTile(st.x, st.y); });
  }
  // empty tile taps (wall cells swallow the tap; no movement onto them)
  for (let y = 0; y < COMBAT_H; y++) {
    for (let x = 0; x < COMBAT_W; x++) {
      if (c.stacks.some(st => st.alive && st.x === x && st.y === y)) continue;
      const s = combatCellToScreen(x, y);
      if (c.walls && combatIsWall(x, y)) { addButton(s.x, s.y, cs, cs, () => {}); continue; }
      addButton(s.x, s.y, cs, cs, () => { if (!c.targeting) humanActOnTile(x, y); });
    }
  }
  // floaters
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = c.floaters.length - 1; i >= 0; i--) {
    const f = c.floaters[i];
    const s = combatCellToScreen(f.x, f.y);
    ctx.font = '800 ' + Math.max(12, Math.round(cs * 0.4)) + 'px sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
    ctx.strokeText(f.text, s.x + cs / 2, s.y - f.t * 0.6);
    ctx.fillStyle = f.text.charAt(0) === '+' ? '#86efac' : '#fca5a5';
    ctx.fillText(f.text, s.x + cs / 2, s.y - f.t * 0.6);
    f.t++;
    if (f.t > 40) c.floaters.splice(i, 1);
  }
  // transient notice (e.g. "No wounded allies to heal")
  if (c.notice && Date.now() < c.notice.until) {
    ctx.font = '800 13px sans-serif';
    const nw = Math.min(W - 20, ctx.measureText(c.notice.text).width + 28);
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; roundRect(o.x + cs * COMBAT_W / 2 - nw / 2, o.y + cs * COMBAT_H / 2 - 16, nw, 32, 10); ctx.fill();
    ctx.fillStyle = '#fde68a'; ctx.textAlign = 'center'; ctx.fillText(c.notice.text, o.x + cs * COMBAT_W / 2, o.y + cs * COMBAT_H / 2, nw - 12);
  }

  if (!L.side) {
    // action bar + log below the grid
    const bh = L.cols === 3 ? 38 : 38;
    drawCombatButtonRows(buttons, 10, L.barY, W - 20, L.cols, bh, 6, 11);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '600 11px sans-serif'; ctx.fillStyle = '#d1fae5';
    logLines.forEach((l, i) => ctx.fillText(l, 10, L.barY + L.barH + 12 + i * 14, W - 20));
  }
}

function openCombatSpellModal(side, hero) {
  // only battle spells show here (Town Portal is an adventure-map spell)
  const items = hero.spells.filter(id => spellDef(id).school === 'combat').map(id => {
    const def = spellDef(id);
    const canAfford = hero.spellPts >= def.cost;
    return {
      label: spellName(id) + ' (' + def.cost + ' SP)' + (canAfford ? '' : ' ✕'),
      disabled: !canAfford,
      onClick: () => { hideListModal(); combatBeginSpell(side, id); },
    };
  });
  showListModal(t('castSpell'), hero.name + ' — ' + Math.round(hero.spellPts) + ' SP', items, [{ label: t('close') }]);
}

// ============================================================
// SCREEN: COMBAT RESULT
// ============================================================
function renderCombatResult() {
  ctx.fillStyle = '#0f1a12'; ctx.fillRect(0, 0, W, H);
  const topBar = chromeMetrics().topBar;
  const c = game.combat;
  if (!c) { game.screen = 'adventure'; return; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const win = c.result === 'attackerWin' || c.result === 'defenderFled' || c.result === 'defenderSurrendered';
  ctx.fillStyle = win ? '#4ade80' : '#f87171';
  ctx.font = '900 26px sans-serif';
  let msg = t('combatVictory');
  if (c.result === 'defenderWin') msg = t('combatDefeat');
  else if (c.result === 'attackerFled') msg = t('combatFled');
  else if (c.result === 'attackerSurrendered') msg = t('combatSurrendered');
  ctx.fillText(msg, W / 2, H / 2 - 20);
  drawButton(W / 2 - 90, H / 2 + 20, 180, 46, t('continueBtn'), '#4ade80', '#16a34a', () => {
    game.combat = null; game.screen = 'adventure';
    // a combat that happened mid-AI-turn (the AI attacked a human hero/castle) always ends
    // the AI's turn right there instead of resuming further AI actions — see aiTakeTurn()
    if (game.mode === 'campaign' && game.turn.playerIdx === 1 && !checkVictory()) endTurn();
  });
}

// ============================================================
// MAIN LOOP DISPATCH
// ============================================================
let lastScreenForModals = null;
function render() {
  clearUIButtons();
  syncScreenModals();
  switch (game.screen) {
    case 'modeSelect': renderModeSelect(); break;
    case 'factionPick': renderFactionPick(); break;
    case 'heroPick': renderHeroPick(); break;
    case 'missionSelect': renderMissionSelect(); break;
    case 'missionIntro': renderMissionIntro(); break;
    case 'missionOutro': case 'missionDefeat': case 'victory': renderFinale(); break;
    case 'adventure': renderAdventure(); break;
    case 'castle': renderCastle(); break;
    case 'heroScreen': renderHeroScreen(); break;
    case 'garrison': renderGarrison(); break;
    case 'combat': renderCombat(); break;
    case 'combatResult': renderCombatResult(); break;
    case 'passDevice': ctx.fillStyle = '#08131f'; ctx.fillRect(0, 0, W, H); break;
    default: ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  }
  lastScreenForModals = game.screen;
}

function update(dt) {
  // Stage 1 is turn-based; no continuous simulation is required per frame.
  // Reserved for future animation/timer needs.
}

// ============================================================
// INPUT WIRING
// ============================================================
function pointFromEvent(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

let lastPointerX = 0, lastPointerY = 0;
function onDown(px, py) {
  initAudio();
  lastPointerX = px; lastPointerY = py;
  const btn = hitButton(px, py);
  if (btn) { btn.onClick(); return; }
  if (FINALE_KIND[game.screen]) { finaleSkip(); return; }
  if (game.screen === 'adventure') adventurePointerDown(px, py);
  else if (game.screen === 'castle') castleScrollDown(px, py);
}
function onMove(px, py) {
  if (game.screen === 'adventure') adventurePointerMove(px, py);
  else if (game.screen === 'castle') castleScrollMove(px, py);
}
function onUp(px, py) {
  if (game.screen === 'adventure') adventurePointerUp(px, py);
  castleScrollUp();
}

canvas.addEventListener('touchstart', e => { e.preventDefault(); const p = pointFromEvent(e); onDown(p.x, p.y); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = pointFromEvent(e); onMove(p.x, p.y); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); const p = pointFromEvent(e); onUp(p.x, p.y); }, { passive: false });
canvas.addEventListener('wheel', e => { if (game.screen === 'castle') { castleScrollBy(castleZoneAt(e.clientX, e.clientY) || 'list', e.deltaY); e.preventDefault(); } }, { passive: false });
canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));

// ============================================================
// BOOT
// ============================================================
let lastFrameTime = 0;
function frame(ts) {
  const dt = lastFrameTime ? Math.min(0.1, (ts - lastFrameTime) / 1000) : 0;
  lastFrameTime = ts;
  // schedule the next frame FIRST and guard the body: one exception inside update()/render()
  // used to skip the requestAnimationFrame call below and freeze the whole game for good
  requestAnimationFrame(frame);
  try { update(dt); render(); } catch (e) { console.error(e); }
}

function init() {
  resize();
  game.screen = 'modeSelect';
  requestAnimationFrame(frame);
}
init();
</script>

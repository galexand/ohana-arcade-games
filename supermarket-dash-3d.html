<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Supermarket Dash 3D - Lidl & Kaufland Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b1426; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Dynamic-viewport-height fallback: 100% first for browsers that don't
     support dvh, then 100dvh overrides it where supported. This keeps
     fixed-position overlays (touch controls, paper list) anchored to the
     actual VISIBLE viewport instead of the taller layout viewport iOS Safari
     reports while its address/tab bars are shown — which is what pushed the
     ▲ button and the bottom of the cart off-screen in landscape. */
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* Top Control Header Bar */
  .top-control-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 25;
    background: rgba(9, 18, 34, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    backdrop-filter: blur(8px);
  }
  #homeLink {
    color: #fff; text-decoration: none; font-weight: 800; font-size: 14px;
    background: rgba(255, 255, 255, 0.12); padding: 7px 14px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2); transition: transform 0.1s ease;
  }
  #homeLink:active { transform: scale(0.95); }

  .langToggle {
    display: flex; background: rgba(0, 0, 0, 0.5); border-radius: 999px; padding: 3px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .langToggle button {
    border: none; background: transparent; color: #a9c7eb; font-weight: 800; font-size: 13px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: background 0.15s ease;
  }
  .langToggle button.active { background: #2ecc71; color: #fff; }

  /* Persistent Real Paper Shopping List Notepad (Top Left Overlay).
     Collapsible: tapping/clicking .paper-header toggles the "collapsed"
     class on #paperShoppingList, which hides #paperItems (the checklist
     rows) via CSS below — the panel shrinks to just the header pill so it
     stops covering the left-wall products behind it. */
  #paperShoppingList {
    position: fixed; top: 102px; left: 12px; z-index: 20;
    width: 196px; max-height: calc(100dvh - 170px); overflow-y: auto;
    background: #fff9e6; color: #1e293b;
    border: 2px solid #d4a359; border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 40px rgba(245, 222, 179, 0.5);
    font-family: -apple-system, sans-serif; display: none; flex-direction: column; gap: 6px;
  }
  .paper-header {
    font-size: 14px; font-weight: 900; color: #9a3412; text-transform: uppercase;
    border-bottom: 2px dashed #cbd5e1; padding-bottom: 6px; margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    cursor: pointer;
  }
  .paper-header:active { opacity: 0.75; }
  #paperChevron { font-size: 12px; color: #9a3412; transition: transform 0.15s ease; }
  /* Collapsed: only the header pill (title + progress + chevron) remains
     visible — the checklist rows are fully removed from layout, not just
     visually hidden, so the panel's box actually shrinks. */
  #paperShoppingList.collapsed { max-height: none; }
  #paperShoppingList.collapsed .paper-header { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  #paperShoppingList.collapsed #paperItems { display: none; }
  .paper-item {
    font-size: 13px; font-weight: 700; color: #334155;
    display: flex; align-items: center; justify-content: space-between;
    padding: 3px 0; border-bottom: 1px solid #f1f5f9;
  }
  .paper-item.checked { color: #16a34a; text-decoration: line-through; }
  .check-box { font-size: 14px; font-weight: 900; margin-right: 6px; }

  /* Touch Controls Overlay */
  .touch-zone {
    position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 15;
  }
  /* #touchDPad uses CSS Grid (not flex) so it can be freely re-laid-out by
     the landscape/short-height media query below without touching the DOM.
     Portrait (default): "up" spans both columns on top, ◀/▶ side by side in
     the middle row, "down" spans both columns on the bottom — reproducing
     the original stacked d-pad look. Turn buttons (◀/▶) stay noticeably
     bigger than ▲/▼ so they read as the distinct "turn onto another aisle"
     control, not just a lateral d-pad key. */
  #touchDPad {
    left: max(16px, env(safe-area-inset-left));
    display: grid;
    grid-template-areas: "up up" "left right" "down down";
    grid-template-columns: auto auto;
    gap: 10px 14px;
    justify-items: center; align-items: center;
  }
  #btnUp { grid-area: up; }
  #btnDown { grid-area: down; }
  #btnLeft { grid-area: left; }
  #btnRight { grid-area: right; }
  #touchAction { right: max(16px, env(safe-area-inset-right)); flex-direction: column; align-items: flex-end; }
  .tbtn {
    width: 58px; height: 58px; border-radius: 50%;
    background: rgba(17, 26, 46, 0.88); border: 2px solid rgba(255, 255, 255, 0.25);
    color: #fff; font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5); backdrop-filter: blur(6px);
  }
  .tbtn:active, .tbtn.active { transform: scale(0.92); background: rgba(46, 204, 113, 0.85); border-color: #58d68d; }
  .tbtn.turn-btn { width: 82px; height: 82px; font-size: 34px; }
  .tbtn.available { border-color: #4ade80; box-shadow: 0 0 4px 2px rgba(74, 222, 128, 0.5), 0 6px 16px rgba(0,0,0,0.5); animation: turnGlow 1s ease-in-out infinite; }
  .tbtn.turn-btn.available { animation: turnGlowBig 1s ease-in-out infinite; }
  @keyframes turnGlow { 0%, 100% { box-shadow: 0 0 4px 2px rgba(74, 222, 128, 0.5); } 50% { box-shadow: 0 0 16px 6px rgba(74, 222, 128, 0.9); } }
  @keyframes turnGlowBig { 0%, 100% { box-shadow: 0 0 6px 3px rgba(74, 222, 128, 0.55); } 50% { box-shadow: 0 0 24px 9px rgba(74, 222, 128, 0.95); } }
  .tbtn.grab-btn { width: auto; height: 52px; border-radius: 26px; padding: 0 20px; font-size: 16px; background: linear-gradient(180deg, #f39c12, #d35400); border-color: #f1c40f; }

  /* Landscape / short-height reflow (e.g. iPhone landscape ~740-900 x 350-420).
     Compacts the top chrome and swaps the d-pad to a compact HORIZONTAL
     layout — ◀ and ▶ as tall flanking columns with ▲ stacked directly above
     ▼ in between — so the whole control cluster's total height drops from
     ~218px to ~100-120px and everything (especially ▲, previously the
     tallest/topmost element) stays on screen. Matched on the JS side by
     chromeMetrics() (see script), which shrinks the canvas-drawn HUD bar and
     the cart/grandpa sprite's minimum scale for the same breakpoint. */
  @media (orientation: landscape) and (max-height: 500px) {
    .top-control-bar { height: 38px; padding: 0 10px; }
    #homeLink { font-size: 12px; padding: 5px 10px; }
    .langToggle button { font-size: 11px; padding: 4px 9px; }

    #paperShoppingList { top: 44px; width: 148px; max-height: calc(100dvh - 60px); padding: 7px 9px; }
    .paper-header { font-size: 11px; }
    .paper-item { font-size: 10.5px; }

    .touch-zone { bottom: max(8px, env(safe-area-inset-bottom)); }
    #touchDPad {
      grid-template-areas: "left up right" "left down right";
      grid-template-columns: auto auto auto;
      grid-template-rows: auto auto;
      gap: 6px 10px;
    }
    #touchDPad .tbtn { width: 44px; height: 44px; font-size: 18px; }
    #touchDPad .tbtn.turn-btn { width: 62px; height: 62px; font-size: 25px; }
  }

  /* Overlay Panel Modals */
  .overlay-panel {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
  }
  .panel-card {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border: 2px solid #38bdf8; border-radius: 20px; padding: 22px;
    width: min(94vw, 500px); color: #fff;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .panel-title { font-size: 26px; font-weight: 900; color: #4ade80; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  .panel-sub { font-size: 14px; color: #cbd5e1; }
  .panel-btn {
    font-size: 16px; font-weight: 800; padding: 12px 20px; border-radius: 12px; border: none;
    cursor: pointer; transition: transform 0.1s ease; outline: none;
  }
  .panel-btn:active { transform: scale(0.96); }
  .btn-green { background: linear-gradient(180deg, #22c55e, #16a34a); color: #fff; }
  .btn-blue { background: linear-gradient(180deg, #0284c7, #0369a1); color: #fff; }
  .btn-gold { background: linear-gradient(180deg, #f59e0b, #d97706); color: #fff; }

  /* Shelf Inspection Items Grid */
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; max-height: 280px; overflow-y: auto; }
  .item-card {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(56, 189, 248, 0.4);
    border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .item-icon { font-size: 34px; }
  .item-name { font-size: 13px; font-weight: 800; color: #fbbf24; }
  .item-price { font-size: 12px; color: #4ade80; font-weight: 700; }
  .item-action-btn {
    font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 8px; border: none;
    cursor: pointer; background: #22c55e; color: #fff; width: 100%; margin-top: 4px;
  }
  .item-action-btn.put-back { background: #ef4444; }

  /* Leaderboard List */
  .leaderboard-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
  .lb-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 700;
  }
  .lb-rank { width: 28px; font-size: 15px; color: #fbbf24; text-align: left; }
  .lb-name { flex: 1; text-align: left; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .lb-score { color: #4ade80; font-weight: 900; font-size: 15px; }

  .name-inputs { display: flex; flex-direction: column; gap: 12px; }
  .input-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .input-group label { font-size: 13px; font-weight: 800; color: #cbd5e1; }
  .input-group input {
    background: #0f172a; border: 2px solid #38bdf8; border-radius: 10px;
    color: #fff; font-size: 17px; font-weight: 700; padding: 10px 14px; outline: none;
  }
  .input-group input:focus { border-color: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
</style>
</head>
<body>
<!-- Top Control Header Bar -->
<div class="top-control-bar">
  <a id="homeLink" href="index.html">← Games</a>
  <div class="langToggle" id="langToggle">
    <button type="button" data-lang="en">🇬🇧 EN</button>
    <button type="button" data-lang="ro">🇷🇴 RO</button>
  </div>
</div>

<!-- Persistent Real Paper Shopping List Notepad — tap/click the header to
     collapse it down to just this pill (see togglePaperList() in the script)
     so it can be gotten out of the way of the left-wall products. -->
<div id="paperShoppingList">
  <div class="paper-header" id="paperHeader">
    <span>📋 LISTĂ / LIST</span>
    <span style="display:flex; align-items:center; gap:6px;">
      <span id="paperProgress">0/0</span>
      <span id="paperChevron">▾</span>
    </span>
  </div>
  <div id="paperItems"></div>
</div>

<canvas id="game"></canvas>

<!-- Mobile Touch Controls — plain siblings (no wrapper row div) so the
     landscape media query can freely reflow ◀/▶ vs ▲/▼ via CSS Grid areas
     without any DOM/JS changes (see #touchDPad in <style>). -->
<div class="touch-zone" id="touchDPad" style="display:none;">
  <div class="tbtn" id="btnUp">▲</div>
  <div class="tbtn turn-btn" id="btnLeft">◀</div>
  <div class="tbtn turn-btn" id="btnRight">▶</div>
  <div class="tbtn" id="btnDown">▼</div>
</div>
<!-- Leaderboard Modal -->
<div class="overlay-panel" id="leaderboardModal">
  <div class="panel-card">
    <div class="panel-title" id="lbTitle">🏆 TOP SHOPPERS</div>
    <div class="leaderboard-list" id="lbList"></div>
    <button type="button" class="panel-btn btn-green" id="lbCloseBtn">CLOSE</button>
  </div>
</div>

<!-- Name Prompt Modal -->
<div class="overlay-panel" id="namePromptModal">
  <div class="panel-card">
    <div class="panel-title" id="nameTitle">🎉 SHOPPING CHAMPION!</div>
    <div class="panel-sub" id="nameSub">ENTER YOUR NAME FOR THE LEADERBOARD:</div>
    <div class="name-inputs">
      <div class="input-group">
        <label for="p1NameInput" id="p1NameLabel">YOUR NAME:</label>
        <input type="text" id="p1NameInput" maxlength="12" placeholder="Lilo" autocomplete="off">
      </div>
    </div>
    <button type="button" class="panel-btn btn-green" id="saveScoreBtn">SAVE SCORE 🏆</button>
  </div>
</div>

<script>
'use strict';

// ============ I18N SETUP ============
let LANG = 'en';
try { LANG = localStorage.getItem('ohanaLang') === 'ro' ? 'ro' : 'en'; } catch (e) {}

const TEXT = {
  en: {
    title: 'SUPERMARKET DASH',
    sub: 'Lidl & Kaufland Shopping Quest (10 Levels)',
    start: 'START SHOPPING 🛒',
    topScores: '🏆 TOP SCORES',
    level: 'LEVEL',
    list: '📋 LIST',
    cart: '🛒 CART',
    checkout: '💳 CHECKOUT',
    time: '⏱ TIME',
    score: 'SCORE',
    grabHint: 'Press SPACE or tap 🛒 to inspect shelf',
    notOnList: '⚠️ NOT ON LIST! (-50 PTS)',
    itemAdded: '✓ ADDED TO CART (+150 PTS)',
    paused: 'GAME PAUSED ⏸',
    pausedHint: 'Press P, ESC, tap ⏸ or click Resume to continue',
    resume: 'RESUME',
    restart: 'RESTART',
    menu: 'MAIN MENU',
    levelClear: 'LEVEL CLEAR! ⭐',
    nextLevel: 'NEXT LEVEL ➡',
    gameOver: 'TIME EXPIRED! ⌛',
    tryAgain: 'TRY AGAIN',
    victory: '🏆 GRAND HYPERMARKET MASTER! 🏆',
    close: 'CLOSE',
    noScoresYet: 'No high scores yet — be the first!',
    putInCart: '+ IN CART',
    putBack: '- RETURN',
  },
  ro: {
    title: 'SUPERMARKET DASH',
    sub: 'Misiune la Cumpărături Lidl & Kaufland (10 Nivele)',
    start: 'ÎNCEPE CUMPĂRĂTURILE 🛒',
    topScores: '🏆 CELE MAI BUNE SCORURI',
    level: 'NIVELUL',
    list: '📋 LISTĂ',
    cart: '🛒 COȘ',
    checkout: '💳 CASĂ DE MARCAT',
    time: '⏱ TIMP',
    score: 'SCOR',
    grabHint: 'Apasă SPACE sau atinge 🛒 pentru raft',
    notOnList: '⚠️ NU ESTE PE LISTĂ! (-50 PCT)',
    itemAdded: '✓ ADĂUGAT ÎN COȘ (+150 PCT)',
    paused: 'JOC PAUZAT ⏸',
    pausedHint: 'Apasă P, Esc, atinge ⏸ sau apăsă Continuă',
    resume: 'CONTINUĂ',
    restart: 'RESTART',
    menu: 'MENIU PRINCIPAL',
    levelClear: 'NIVEL COMPLETAT! ⭐',
    nextLevel: 'NIVELUL URMĂTOR ➡',
    gameOver: 'TIMPUL A EXPIRAT! ⌛',
    tryAgain: 'ÎNCEARCĂ DIN NOU',
    victory: '🏆 MAESTRU AL HIPERMARKETULUI! 🏆',
    close: 'ÎNCHIDE',
    noScoresYet: 'Niciun scor încă — fii primul!',
    putInCart: '+ ÎN COȘ',
    putBack: '- ÎNAPOI',
  }
};
const t = key => (TEXT[LANG] && TEXT[LANG][key]) ? TEXT[LANG][key] : TEXT['en'][key];

function updateLangToggleUI() {
  document.querySelectorAll('#langToggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === LANG);
  });
}
document.getElementById('langToggle').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  LANG = btn.dataset.lang;
  try { localStorage.setItem('ohanaLang', LANG); } catch (err) {}
  updateLangToggleUI();
  updatePaperShoppingListUI();
});
updateLangToggleUI();

// Collapsible paper shopping list: tapping/clicking the header toggles the
// "collapsed" class (see #paperShoppingList.collapsed in <style>), which
// hides the checklist rows so the panel shrinks down to just the header
// pill — freeing up the left-wall products it would otherwise cover. A
// single 'click' listener covers both mouse and touch (touch taps synthesize
// a click event, same pattern already used for the canvas tap-to-grab).
let paperListCollapsed = false;
function togglePaperList() {
  paperListCollapsed = !paperListCollapsed;
  const panel = document.getElementById('paperShoppingList');
  const chevron = document.getElementById('paperChevron');
  if (panel) panel.classList.toggle('collapsed', paperListCollapsed);
  if (chevron) chevron.textContent = paperListCollapsed ? '▸' : '▾';
}
const paperHeaderEl = document.getElementById('paperHeader');
if (paperHeaderEl) paperHeaderEl.addEventListener('click', togglePaperList);

// ============ WEBAUDIO SOUND ENGINE ============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSfx(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'pop') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'wrong') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.linearRampToValueAtTime(100, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'beep') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1760, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'fanfare') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        const startTime = now + idx * 0.09;
        g.gain.setValueAtTime(0.12, startTime);
        g.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
        o.start(startTime); o.stop(startTime + 0.25);
      });
    }
  } catch (e) {}
}

// ============ CANVAS SETUP ============
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 1024);
function updateTouchVisibility() {
  const showTouch = isTouchDevice && gameState === 'PLAY';
  // #touchDPad is a CSS Grid (see <style>) — 'grid' here, NOT 'flex', or this
  // inline style would win over the stylesheet's `display: grid` and silently
  // break the whole portrait/landscape reflow.
  document.getElementById('touchDPad').style.display = showTouch ? 'grid' : 'none';
}

// chromeMetrics(): the fixed top-bar/HUD-bar heights used by both the CSS
// (.top-control-bar height, in the landscape media query) and the
// canvas-drawn HUD bar (renderSupermarket) — kept in sync via the same
// H < 480 breakpoint so the DOM chrome and the canvas-drawn chrome always
// end up the same height instead of drifting apart on short viewports.
function chromeMetrics() {
  const compact = H < 480;
  return { topBar: compact ? 38 : 50, hudH: compact ? 32 : 42 };
}

// ============ BEHIND-THE-CART PSEUDO-3D CAMERA ============
// A minimal pseudo-3D pinhole camera, same technique as super-rings.html's
// projWorld/project: the camera sits behind and above the cart, always looking
// straight down the +Z aisle axis (no yaw/roll). World coords: x = lateral
// (negative = left wall, positive = right wall), y = height (0 = floor, up =
// positive), z = depth down the aisle (larger z = farther from the start).
let FOCAL = 300;
const HORIZON_FRAC = 0.42;

function project(ox, oy, d) {
  const scale = FOCAL / Math.max(1, d);
  return {
    x: W / 2 + ox * scale,
    y: H * HORIZON_FRAC + oy * scale,
    scale,
  };
}
// projWorld: project a world-space point relative to the current camera.
function projWorld(wx, wy, wz) {
  const d = wz - camera.z;
  const ox = wx - camera.x;
  const oy = camera.y - wy; // camera is above the floor, so ground offsets are positive (down-screen)
  return project(ox, oy, d);
}

// ---- Aisle world layout ----
// NOTE: the store is now a GRAPH of corridors (see CORRIDOR-GRAPH NAVIGATION
// below) — each corridor has its own length/checkout/products, but every
// corridor shares this same cross-section geometry (wall positions, tier
// heights, shelf spacing), so those stay as shared constants.
const WALL_X = 170;          // lateral position of each shelf wall (left = -WALL_X, right = +WALL_X)
const FLOOR_HALF = WALL_X + 25;
const WALL_TOP_Y = 260;      // top of the shelf unit (world height units)
const TIER_Y = [34, 96, 158, 220]; // 4 stacked shelf tiers (world height of each tier's product row)
const PRODUCT_INSET = 24;    // products sit this far in front of the wall plane, toward the aisle
const SHELF_START_Z = 220;   // depth of the first row of stocked products (a short walk from the entrance)
const SHELF_SPACING_Z = 130; // depth spacing between consecutive product slots within the same tier —
                              // the wall's item list repeats/cycles at this spacing so both walls read
                              // as fully stocked shelving along their whole length, not sparse bays
// Grab reach is a FORWARD band ahead of the cart, not a symmetric band around it.
// A product exactly beside the cart (entry.z ~= player.z) sits at the camera's
// minimum distance (d ~= CAM_BACK), which maximizes its projected scale and
// pushes its lateral (wall) offset toward/off the screen edge — making it
// effectively untappable. Requiring products to be AHEAD of the cart by at
// least NEAR_MARGIN keeps d (and therefore the on-screen lateral offset) safely
// bounded, so every grabbable product's screen position stays comfortably
// inside the viewport instead of jammed against the bezel.
const NEAR_MARGIN = 20;   // products closer than this (beside/behind the cart) are never grabbable
const GRAB_AHEAD = 300;   // products up to this far ahead of the cart are grabbable —
                           // wide enough that the very first shelf row (z=SHELF_START_Z=220) is
                           // already in reach at player.z=0, so nothing needs walking-in-blind

const CAM_HEIGHT = 130;      // camera eye height above the floor
const CAM_BACK = 170;        // camera trails this far behind the cart in Z
const CAM_EASE = 0.16;
// Minimum world-Z distance any floor/wall geometry is allowed to be drawn from the camera.
// Without this, a strip/quad whose near edge is at or behind the camera projects with a huge
// (or even negative-clamped) scale and fills the whole screen with a single flat, washed-out
// color as the player walks — this is the fix for that "white blowout" artifact.
const NEAR_CLIP = 60;

const camera = { x: 0, y: CAM_HEIGHT, z: -CAM_BACK };

// ---- Corridor-graph navigation (90° snap-turns) ----
const ENTRY_Z = 40;        // where the player is placed when entering a corridor via a turn
const TURN_WINDOW = 110;   // how close (in z) the player must be to a junction for its turn to be active
const TURN_TRANSITION_DUR = 0.4; // seconds — the whip-rotate transition when turning
let turnTransition = null; // { dir: 'L'|'R', t } while a turn's visual transition is playing

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  // Prefer visualViewport when available — on iOS Safari, window.innerWidth/
  // innerHeight report the LAYOUT viewport, which stays the (taller) size
  // even while the address bar / bottom toolbar are visibly covering part of
  // the screen; visualViewport tracks the actually-visible area, so using it
  // keeps the canvas (and every W/H-driven layout decision below, e.g.
  // chromeMetrics() and the cart/grandpa scale) matching what's really on
  // screen instead of drawing UI into a region the toolbars are covering.
  const vv = window.visualViewport;
  W = vv ? Math.round(vv.width) : window.innerWidth;
  H = vv ? Math.round(vv.height) : window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Narrower devices get a slightly tighter FOCAL so the two shelf walls still
  // both fit in view without the aisle looking absurdly wide.
  FOCAL = Math.max(220, Math.min(340, W * 0.62));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
// visualViewport fires its own 'resize' (and 'scroll') as iOS Safari's
// address/tab bars animate in/out — window's 'resize' alone doesn't always
// catch that, which is what let fixed-position controls end up positioned
// against a stale, too-tall viewport height.
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
resize();

// per-frame — at speed 120 a ~1200-unit corridor takes ~10s to walk end-to-end,

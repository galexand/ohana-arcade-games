// ============ CORRIDOR-GRAPH LEVEL LAYOUTS ============
// The store is a small graph of straight corridors connected at junctions.
// The renderer always draws exactly ONE corridor straight down +Z (no free
// camera yaw) — turning is a discrete corridor swap plus a short whip-rotate
// visual transition (see attemptTurn()/TURN_TRANSITION below), not true yaw.
//
// Each corridor: { id, length, hasCheckout, checkoutZ, farZ, leftLabel,
//   rightLabel, junctions: [{z, dir:'L'|'R', to, landingZ?}], products }
// A junction on corridor X at world-z `z` with dir 'L'/'R' means: while the
// player is within TURN_WINDOW of that z on corridor X, turning that
// direction swaps player.corridorId to `to`, landing at z=landingZ (or
// ENTRY_Z if unset).
//
// Levels 1-3: a single straight corridor (no turns) — identical to the prior
// single-aisle behavior. Levels 4-10: a "spine" corridor with branch
// corridors reachable via turns; the target items' categories are partitioned
// one-category-set-per-branch (see buildBranchingLevel), so every required
// item is reachable via exactly one specific branch — the player MUST turn
// to complete the list — and the final branch on the path always ends in the
// checkout, so every level is guaranteed fully completable.
const LEFT_WALL_CATS = ['bakery', 'produce', 'dairy'];
const RIGHT_WALL_CATS = ['meat', 'snacks', 'household'];
const LEFT_WALL_LABEL = '🥖 BAKERY  ·  🍎 PRODUCE  ·  🥛 DAIRY';
const RIGHT_WALL_LABEL = '🥩 BUTCHERY  ·  🍿 SNACKS  ·  🧼 HOUSEHOLD';
const CATEGORY_LABELS = {
  bakery: '🥖 BAKERY', produce: '🍎 PRODUCE', dairy: '🥛 DAIRY',
  meat: '🥩 BUTCHERY', snacks: '🍿 SNACKS', household: '🧼 HOUSEHOLD'
};
function categoryLabel(cat) { return CATEGORY_LABELS[cat] || String(cat).toUpperCase(); }
function idsForCats(cats) { return PRODUCTS.filter(p => cats.includes(p.category)).map(p => p.id); }

// Every tier cycles through the wall's item list at a fixed depth spacing for
// the whole startZ..endZ run, repeating items as needed so the shelf is
// visibly full its entire length (no sparse islands of product). Each tier
// starts at a different offset into the item list so the 4 stacked slots at
// any given depth aren't all showing the same product. `gaps` (optional) is a
// list of [z0, z1] ranges — matching the visual wall opening drawn at a
// junction (see WALL_GAP_HALF/drawShelfWall) — that get no product slots, so
// nothing appears to float in the open doorway.
function placeWallProducts(ids, side, startZ, endZ, gaps) {
  if (!ids.length) return [];
  const x = side === 'L' ? -(WALL_X - PRODUCT_INSET) : (WALL_X - PRODUCT_INSET);
  const slots = Math.max(1, Math.floor((endZ - startZ) / SHELF_SPACING_Z) + 1);
  const tierOffset = Math.ceil(ids.length / TIER_Y.length);
  const arr = [];
  TIER_Y.forEach((ty, tier) => {
    for (let i = 0; i < slots; i++) {
      const z = startZ + i * SHELF_SPACING_Z;
      if (gaps && gaps.some(g => z > g[0] && z < g[1])) continue;
      const idx = (i + tier * tierOffset) % ids.length;
      arr.push({ id: ids[idx], side, x, y: ty, z, tier });
    }
  });
  return arr;
}

// WALL_GAP_HALF: how far (in z) on either side of a junction the shelf wall
// opens up into a visible gap/opening — deliberately the SAME window as
// TURN_WINDOW (see getActiveJunction) so the gap the player SEES always
// exactly agrees with when the turn control actually lights up/works.
const WALL_GAP_HALF = TURN_WINDOW;

function buildCorridor(id, opts) {
  const length = opts.length;
  const hasCheckout = !!opts.hasCheckout;
  const shelfEndZ = Math.max(SHELF_START_Z + 10, length - (hasCheckout ? 180 : 60));
  const junctions = opts.junctions || [];
  // A gap only opens on the side the junction actually turns toward — e.g. a
  // 'L' junction opens a gap in the LEFT wall (the aisle you turn into), the
  // right wall there stays solid shelving.
  const gaps = {
    L: junctions.filter(j => j.dir === 'L').map(j => [j.z - WALL_GAP_HALF, j.z + WALL_GAP_HALF]),
    R: junctions.filter(j => j.dir === 'R').map(j => [j.z - WALL_GAP_HALF, j.z + WALL_GAP_HALF]),
  };
  const products = placeWallProducts(opts.leftIds || [], 'L', SHELF_START_Z, shelfEndZ, gaps.L)
    .concat(placeWallProducts(opts.rightIds || [], 'R', SHELF_START_Z, shelfEndZ, gaps.R));
  return {
    id, length, hasCheckout,
    checkoutZ: hasCheckout ? length - 60 : null,
    farZ: length + 220,
    leftLabel: opts.leftLabel || '', rightLabel: opts.rightLabel || '',
    junctions,
    gaps,
    products,
  };
}

// computeMapLayout: BFS the graph from its start corridor, assigning each
// corridor a 2D map-space origin + unit direction vector. A junction's L/R
// turn direction rotates the branch's direction -90°/+90° from its parent's,
// exactly mirroring the in-game whip-turn — so the minimap is a genuinely
// consistent (if schematic) top-down layout of the corridors as walked.
function computeMapLayout(graph) {
  const layout = {};
  function rotate(v, deg) {
    const rad = deg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    return { x: v.x * cos - v.y * sin, y: v.x * sin + v.y * cos };
  }
  function visit(id, origin, dir) {
    if (layout[id]) return;
    layout[id] = { origin, dir };
    const cor = graph.corridors[id];
    if (!cor) return;
    cor.junctions.forEach(j => {
      if (layout[j.to]) return;
      const branchOrigin = { x: origin.x + dir.x * j.z, y: origin.y + dir.y * j.z };
      const branchDir = rotate(dir, j.dir === 'L' ? -90 : 90);
      visit(j.to, branchOrigin, branchDir);
    });
  }
  visit(graph.start, { x: 0, y: 0 }, { x: 0, y: 1 });
  return layout;
}

// ---- Levels 1-3: a single straight corridor, no turns (unchanged behavior) ----
function buildSingleCorridorLevel() {
  const A = buildCorridor('A', {
    length: 1200, hasCheckout: true,
    leftIds: idsForCats(LEFT_WALL_CATS), rightIds: idsForCats(RIGHT_WALL_CATS),
    leftLabel: LEFT_WALL_LABEL, rightLabel: RIGHT_WALL_LABEL,
    junctions: [],
  });
  const graph = { start: 'A', corridors: { A } };
  graph.mapLayout = computeMapLayout(graph);
  return graph;
}

// ---- Levels 4-10: a spine corridor with branch corridors off it ----
// Partitions the level's required categories into up to `maxBranches` groups
// (merging overlow categories into the last branch so the branch count never
// exceeds maxBranches), builds one branch corridor per group — stocking ONLY
// that group's categories, so every required item lives on exactly one
// branch — alternates L/R turns off the spine for variety, and makes the
// LAST branch the checkout corridor (so the path is always completable: walk
// the spine, turn into each branch to collect its items, the final branch
// ends at checkout). The spine itself is stocked with generic filler
// (explicitly EXCLUDING every target item id, regardless of category) so a
// required item can never accidentally be reachable without turning.
function chunkCategories(cats, maxBranches) {
  if (cats.length <= maxBranches) return cats.map(c => [c]);
  const groups = cats.slice(0, maxBranches - 1).map(c => [c]);
  groups.push(cats.slice(maxBranches - 1));
  return groups;
}
const SPINE_START_Z = 260;
const SPINE_JUNCTION_GAP = 320;
function buildBranchingLevel(targetItems, maxBranches) {
  const cats = [];
  PRODUCTS.forEach(p => { if (targetItems.includes(p.id) && !cats.includes(p.category)) cats.push(p.category); });
  const groups = chunkCategories(cats, Math.max(1, maxBranches));

  const corridors = {};
  const spineJunctions = [];
  let z = SPINE_START_Z;

  groups.forEach((group, i) => {
    const branchId = 'B' + i;
    const dir = i % 2 === 0 ? 'L' : 'R';
    const isLast = i === groups.length - 1;
    spineJunctions.push({ z, dir, to: branchId });

    let leftIds, rightIds;
    if (group.length >= 2) {
      const half = Math.ceil(group.length / 2);
      leftIds = idsForCats(group.slice(0, half));
      rightIds = idsForCats(group.slice(half));
    } else {
      // A single-category branch still splits its ids across both walls so
      // both sides read as stocked shelving, not one bare wall.
      const all = idsForCats(group);
      leftIds = all.filter((_, idx) => idx % 2 === 0);
      rightIds = all.filter((_, idx) => idx % 2 === 1);
      if (!rightIds.length) rightIds = leftIds;
      if (!leftIds.length) leftIds = rightIds;
    }

    // Reciprocal return junction: turning the opposite direction near the
    // branch's own entrance sends the player back to the exact spine z they
    // turned off from, so they resume forward progress rather than
    // restarting the spine from its entrance. EVERY branch gets this,
    // including the final/checkout one — a player who reaches checkout
    // missing an item must always be able to turn back onto the spine to go
    // collect it (previously only non-final branches had a way back, which
    // stranded the player once they'd walked onto the checkout corridor).
    const branchJunctions = [
      { z: 260, dir: dir === 'L' ? 'R' : 'L', to: 'S', landingZ: z }
    ];

    corridors[branchId] = buildCorridor(branchId, {
      length: isLast ? 780 : 620,
      hasCheckout: isLast,
      leftIds, rightIds,
      leftLabel: group.map(categoryLabel).join(' · '),
      rightLabel: group.map(categoryLabel).join(' · '),
      junctions: branchJunctions,
    });
    z += SPINE_JUNCTION_GAP;
  });

  const lastJunctionZ = SPINE_START_Z + (groups.length - 1) * SPINE_JUNCTION_GAP;
  const fillerIds = PRODUCTS.filter(p => !targetItems.includes(p.id)).map(p => p.id);
  corridors['S'] = buildCorridor('S', {
    length: lastJunctionZ + 300,
    hasCheckout: false,
    leftIds: fillerIds.filter((_, idx) => idx % 2 === 0),
    rightIds: fillerIds.filter((_, idx) => idx % 2 === 1),
    leftLabel: '🗂️ MIXED AISLE', rightLabel: '🗂️ MIXED AISLE',
    junctions: spineJunctions,
  });

  const graph = { start: 'S', corridors };
  graph.mapLayout = computeMapLayout(graph);
  return graph;
}

// How many branches each level's spine forks into: 0 = single corridor
// (levels 1-3, no turns), otherwise levels 4-10 escalate from a simple
// L-shape (1 branch = 2 corridors total) up to a small 5-6 corridor maze.
const LEVEL_MAX_BRANCHES = [0, 0, 0, 2, 2, 2, 4, 4, 5, 5];
function buildLevelGraph(lvlIdx) {
  const lvl = LEVELS[lvlIdx];
  const maxBranches = LEVEL_MAX_BRANCHES[lvlIdx] || 0;
  if (!maxBranches) return buildSingleCorridorLevel();
  return buildBranchingLevel(lvl.targetItems, maxBranches);
}
const LEVEL_GRAPHS = LEVELS.map((lvl, idx) => buildLevelGraph(idx));

let CORRIDOR_GRAPH = LEVEL_GRAPHS[0];
function currentCorridor() {
  return CORRIDOR_GRAPH.corridors[player.corridorId];
}

function getActiveJunction(dir) {
  const cor = currentCorridor();
  if (!cor) return null;
  let best = null, bestDist = Infinity;
  cor.junctions.forEach(j => {
    if (j.dir !== dir) return;
    const dist = Math.abs(player.z - j.z);
    if (dist < TURN_WINDOW && dist < bestDist) { best = j; bestDist = dist; }
  });
  return best;
}

// attemptTurn: the ONLY way corridorId changes. Swaps immediately (so game
// logic/hit-testing is instantly consistent with the new corridor) and kicks
// off a short whip-rotate visual transition (see render()) to sell the turn
// as a discrete ~90° snap rather than a jarring cut.
function attemptTurn(dir) {
  if (gameState !== 'PLAY' || turnTransition) return null;
  const junction = getActiveJunction(dir);
  if (!junction) return null;
  const targetCor = CORRIDOR_GRAPH.corridors[junction.to];
  if (!targetCor) return null;

  player.corridorId = junction.to;
  player.z = junction.landingZ != null ? junction.landingZ : ENTRY_Z;
  player.x = 0;
  camera.x = 0;
  camera.z = player.z - CAM_BACK;
  camera.y = CAM_HEIGHT;
  turnTransition = { dir, t: 0 };
  playSfx('beep');
  return junction;
}

function initSupermarketLevel(lvlIdx) {
  const lvl = LEVELS[lvlIdx];
  levelTimer = lvl.timer;
  CORRIDOR_GRAPH = LEVEL_GRAPHS[lvlIdx];
  player.corridorId = CORRIDOR_GRAPH.start;
  player.x = 0;
  player.z = 0;
  player.facing = 1;
  player.cart = [];
  flyingItems = [];
  turnTransition = null;
  camera.x = 0;
  camera.z = -CAM_BACK;
  camera.y = CAM_HEIGHT;

  updatePaperShoppingListUI();
  document.getElementById('paperShoppingList').style.display = 'flex';
}

function updatePaperShoppingListUI() {
  const lvl = LEVELS[currentLevelIdx];
  const container = document.getElementById('paperItems');
  const progressEl = document.getElementById('paperProgress');

  if (!lvl || !container) return;

  let collectedCount = 0;
  let html = '';

  lvl.targetItems.forEach(itemId => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const isCollected = player.cart.includes(itemId);
    if (isCollected) collectedCount++;

    const nameStr = LANG === 'ro' ? prod.nameRo : prod.name;
    html += `
      <div class="paper-item ${isCollected ? 'checked' : ''}">
        <span><span class="check-box">${isCollected ? '☑' : '☐'}</span> ${prod.icon} ${nameStr}</span>
      </div>
    `;
  });

  container.innerHTML = html;
  progressEl.innerText = `${collectedCount}/${lvl.targetItems.length}`;
}

function showFeedback(msg, isWarning = false) {
  feedbackMsg = msg;
  feedbackTimer = 2.2;
}

function setGameState(newState) {
  pendingState = newState;
  stateCooldown = 0.35;
  if (newState !== 'PLAY') {
    document.getElementById('paperShoppingList').style.display = 'none';
  } else {
    document.getElementById('paperShoppingList').style.display = 'flex';
  }
}

// ============ GAME LOGIC & CONTROLS ============
// keys[] drives CONTINUOUS movement (forward/back) via the polled update()
// loop below. Turning and grabbing are discrete, edge-triggered actions
// (attemptTurn()/attemptGrab()) fired directly from input handlers — not
// polled — so a single press/tap performs exactly one turn or one grab.
const keys = {};
window.addEventListener('keydown', e => {
  const wasDown = keys[e.code];
  keys[e.code] = true;
  initAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (gameState === 'PLAY') setGameState('PAUSED');
    else if (gameState === 'PAUSED') setGameState('PLAY');
  } else if (!wasDown && gameState === 'PLAY') {
    // Edge-triggered (only on the initial keydown, not OS key-repeat) so
    // holding a key doesn't spam turns/grabs.
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') attemptTurn('L');
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') attemptTurn('R');
    else if (e.code === 'Space' || e.code === 'KeyE') attemptGrab();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch Control Binds — ▲/▼ are continuous hold-to-walk; ◀/▶ are discrete
// turn presses (see attemptTurn), matching the keyboard's edge-triggered
// turn behavior so tapping the button performs exactly one turn.
function bindTouchBtn(id, keyName) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = e => { e.preventDefault(); initAudio(); keys[keyName] = true; };
  const off = e => { e.preventDefault(); keys[keyName] = false; };
  el.addEventListener('touchstart', on); el.addEventListener('touchend', off);
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off);
}
function bindTurnBtn(id, dir) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = e => { e.preventDefault(); initAudio(); attemptTurn(dir); };
  el.addEventListener('touchstart', on);
  el.addEventListener('mousedown', on);
}
bindTouchBtn('btnUp', 'ArrowUp');
bindTouchBtn('btnDown', 'ArrowDown');
bindTurnBtn('btnLeft', 'L');
bindTurnBtn('btnRight', 'R');

// Turn buttons glow/enable only when a turn is actually available, so touch
// users always know when ◀/▶ will do something (full touch parity with the
// on-screen "glowing arrow" cue drawn in the 3D view — see drawTurnCues()).
function updateTurnButtonsUI() {
  const canL = gameState === 'PLAY' && !!getActiveJunction('L');
  const canR = gameState === 'PLAY' && !!getActiveJunction('R');
  const bl = document.getElementById('btnLeft'), br = document.getElementById('btnRight');
  if (bl) bl.classList.toggle('available', canL);
  if (br) br.classList.toggle('available', canR);
}

// Touch drag-to-walk on the canvas itself: dragging up walks forward (deeper
// into the corridor), dragging down walks back. A short drag threshold keeps
// a simple tap free to fall through to the tap-to-grab hit-test below (see
// the canvas 'click' handler further down, which drives both menu buttons
// and product grabs).
let dragState = null;
canvas.addEventListener('touchstart', e => {
  if (gameState !== 'PLAY' || !e.touches || !e.touches.length) return;
  dragState = { startY: e.touches[0].clientY, dragging: false };
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!dragState || gameState !== 'PLAY' || !e.touches || !e.touches.length) return;
  const dy = dragState.startY - e.touches[0].clientY;
  if (Math.abs(dy) > 12) {
    dragState.dragging = true;
    e.preventDefault();
    keys['ArrowUp'] = dy > 0;
    keys['ArrowDown'] = dy < 0;
  }
}, { passive: false });
function endDrag() {
  if (dragState && dragState.dragging) { keys['ArrowUp'] = false; keys['ArrowDown'] = false; }
  dragState = null;
}
canvas.addEventListener('touchend', endDrag);
canvas.addEventListener('touchcancel', endDrag);

function update(dt) {
  updateTurnButtonsUI();
  if (gameState !== 'PLAY') return;

  // Timer countdown
  if (levelTimer > 0) {
    levelTimer -= dt;
    if (levelTimer <= 0) {
      setGameState('GAME_OVER');
      return;
    }
  }

  // Turn whip-transition timing (purely visual; the corridor swap itself
  // already happened instantly in attemptTurn()).
  if (turnTransition) {
    turnTransition.t += dt;
    if (turnTransition.t >= TURN_TRANSITION_DUR) turnTransition = null;
  }

  const cor = currentCorridor();

  // Player/cart movement — Up/W walks forward (+z, deeper into the current
  // corridor), Down/S walks back (-z). Left/right no longer lean laterally;
  // they perform corridor turns (attemptTurn(), triggered directly from the
  // input handlers above, not polled here).
  let dz = 0;
  if (keys['ArrowUp'] || keys['KeyW']) dz += 1;
  if (keys['ArrowDown'] || keys['KeyS']) dz -= 1;

  player.z = Math.max(0, Math.min(cor.length, player.z + dz * player.speed * dt));

  // Camera eases toward trailing the cart (behind + above), matching the
  // super-rings.html camera-follow technique.
  camera.x += (player.x - camera.x) * CAM_EASE;
  camera.z += ((player.z - CAM_BACK) - camera.z) * CAM_EASE;
  camera.y = CAM_HEIGHT;

  // Flying "grabbed item" particles ease from the shelf toward the cart.
  for (let i = flyingItems.length - 1; i >= 0; i--) {
    const f = flyingItems[i];
    f.t += dt;
    if (f.t >= f.dur) flyingItems.splice(i, 1);
  }

  // Walk into the checkout zone at the far end of the checkout corridor to scan out.
  if (cor.hasCheckout && Math.abs(player.z - cor.checkoutZ) < 70) {
    checkOutCart();
  }
}

function checkOutCart() {
  const lvl = LEVELS[currentLevelIdx];
  const req = lvl.targetItems.slice().sort();
  const got = player.cart.slice().sort();

  // Check if all list items are matched
  const isMatch = req.length === got.length && req.every((val, idx) => val === got[idx]);

  if (isMatch) {
    playSfx('beep');
    playSfx('fanfare');
    score += 500 + (levelTimer > 0 ? Math.floor(levelTimer * 10) : 0);

    if (currentLevelIdx + 1 < LEVELS.length) {
      setGameState('LEVEL_CLEAR');
    } else {
      setGameState('VICTORY');
    }
  } else {
    showFeedback('⚠️ SCAN INCOMPLETE: COLLECT ALL LIST ITEMS FIRST!', true);
  }
}

// ============ RENDER ENGINE ============
let menuClick = null;
canvas.addEventListener('click', e => {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  menuClick = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});

function render() {
  ctx.clearRect(0, 0, W, H);
  updateTouchVisibility();

  if (gameState === 'TITLE') {
    renderTitle();
  } else if (gameState === 'PLAY' || gameState === 'PAUSED' || gameState === 'LEVEL_CLEAR' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
    renderSupermarket();

    if (gameState === 'PAUSED') {
      drawModalCard(t('paused'), t('pausedHint'), [
        { label: t('resume'), action: () => setGameState('PLAY') },
        { label: t('restart'), action: () => initSupermarketLevel(currentLevelIdx) },
        { label: t('menu'), action: () => setGameState('TITLE') }
      ]);
    } else if (gameState === 'LEVEL_CLEAR') {
      drawModalCard(t('levelClear'), `Score: ${score}`, [
        { label: t('nextLevel'), action: () => {
          currentLevelIdx++;
          initSupermarketLevel(currentLevelIdx);
          setGameState('PLAY');
        }}
      ]);
    } else if (gameState === 'GAME_OVER') {
      drawModalCard(t('gameOver'), 'Item list incomplete!', [
        { label: t('tryAgain'), action: () => {
          initSupermarketLevel(currentLevelIdx);
          setGameState('PLAY');
        }}
      ]);
    } else if (gameState === 'VICTORY') {
      drawModalCard(t('victory'), `Final Score: ${score}`, [
        { label: 'SAVE SCORE 🏆', action: () => openNamePromptModal() }
      ]);
    }
  }

  // Feedback Notification Floater — anchored just below the (possibly
  // compacted, see chromeMetrics()) top bar + HUD strip, so it stays right
  // under the chrome instead of drifting into the aisle view on short
  // viewports where the chrome itself is shorter.
  if (feedbackTimer > 0 && feedbackMsg) {
    const { topBar, hudH } = chromeMetrics();
    const toastTop = topBar + hudH + 12;
    ctx.save();
    ctx.font = 'bold 15px -apple-system, sans-serif';
    const mw = ctx.measureText(feedbackMsg).width;
    ctx.fillStyle = feedbackMsg.includes('⚠️') ? 'rgba(239, 68, 68, 0.95)' : 'rgba(34, 197, 94, 0.95)';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(W / 2 - mw / 2 - 16, toastTop, mw + 32, 34, 17);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(feedbackMsg, W / 2, toastTop + 17);
    ctx.restore();
  }
}

function renderTitle() {
  ctx.fillStyle = '#091222';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 36px -apple-system, sans-serif';
  ctx.fillText(t('title'), W / 2, 110);

  ctx.fillStyle = '#a9c7eb';
  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.fillText(t('sub'), W / 2, 150);

  drawMenuBtn(W / 2, 230, 260, 52, t('start'), () => {
    currentLevelIdx = 0;
    score = 0;
    initSupermarketLevel(0);
    setGameState('PLAY');
  });

  drawMenuBtn(W / 2, 300, 260, 48, t('topScores'), () => {
    openLeaderboardModal();
  });

  ctx.restore();
}

// ============ AISLE SCENE DRAWING (pseudo-3D, behind-the-cart) ============

// Ground-plane floor, drawn as depth strips (painter's algorithm, far to near)
// spanning the walkable width between the two shelf walls. Each strip's near
// edge is clamped to camera.z + NEAR_CLIP (never behind/right on the camera),
// which is what keeps this from ever blowing up into a giant flat-color fan —
// letting a strip's near edge get closer than that to the camera is exactly
// what produced the washed-out white flash while walking.
const FLOOR_TILE_Z = 100;
function drawAisleFloor(cor) {
  ctx.save();
  const clipZ = camera.z + NEAR_CLIP;
  const farZ = cor.farZ;
  const topZ = Math.ceil(farZ / FLOOR_TILE_Z) * FLOOR_TILE_Z;
  for (let z = topZ; z >= 0; z -= FLOOR_TILE_Z) {
    let zNear = z, zFar = z + FLOOR_TILE_Z;
    if (zFar <= clipZ) continue;        // whole strip is behind the near-clip plane
    if (zNear < clipZ) zNear = clipZ;   // clip the near edge into visible range instead of skipping the strip
    const pNL = projWorld(-FLOOR_HALF, 0, zNear);
    const pNR = projWorld(FLOOR_HALF, 0, zNear);
    const pFL = projWorld(-FLOOR_HALF, 0, zFar);
    const pFR = projWorld(FLOOR_HALF, 0, zFar);
    // Readable mid-tone marble checker — deliberately never near-white so it
    // can't blow out regardless of how big a near strip projects on screen.
    const checker = Math.round(z / FLOOR_TILE_Z) % 2 === 0;
    ctx.fillStyle = checker ? '#8b96a8' : '#6b7688';
    ctx.beginPath();
    ctx.moveTo(pNL.x, pNL.y); ctx.lineTo(pNR.x, pNR.y); ctx.lineTo(pFR.x, pFR.y); ctx.lineTo(pFL.x, pFL.y);
    ctx.closePath(); ctx.fill();
  }
  // Center aisle stripe for a bit of visual guidance down the corridor.
  const stripeNear = projWorld(0, 1, Math.max(0, clipZ));
  const stripeFar = projWorld(0, 1, farZ);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = Math.max(1, 3 * stripeNear.scale);
  ctx.setLineDash([14 * stripeNear.scale, 14 * stripeNear.scale]);
  ctx.beginPath(); ctx.moveTo(stripeNear.x, stripeNear.y); ctx.lineTo(stripeFar.x, stripeFar.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// Back wall closing off the vanishing point beyond the checkout.
function drawBackWall(cor) {
  const z = cor.farZ;
  const bl = projWorld(-FLOOR_HALF, 0, z);
  const br = projWorld(FLOOR_HALF, 0, z);
  const tl = projWorld(-FLOOR_HALF, WALL_TOP_Y + 120, z);
  const tr = projWorld(FLOOR_HALF, WALL_TOP_Y + 120, z);
  ctx.fillStyle = '#1e293b';
  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(tl.x, tl.y);
  ctx.closePath(); ctx.fill();
}

// Splits [nearZ, farZ] into the drawable wall segments once the given gap
// ranges (a junction's opening — see WALL_GAP_HALF) are cut out of it, plus
// the (clipped-to-view) gap ranges themselves for drawWallGapOpening().
function wallSegments(nearZ, farZ, gaps) {
  const clipped = (gaps || [])
    .map(g => [Math.max(nearZ, g[0]), Math.min(farZ, g[1])])
    .filter(g => g[1] > g[0])
    .sort((a, b) => a[0] - b[0]);
  const segs = [];
  let cursor = nearZ;
  clipped.forEach(g => {
    if (g[0] > cursor) segs.push([cursor, g[0]]);
    cursor = Math.max(cursor, g[1]);
  });
  if (cursor < farZ) segs.push([cursor, farZ]);
  return { segs, gaps: clipped };
}

// Nudges a world-z forward past any gap it falls inside, so fixed set-dressing
// (the category sign) never ends up floating in an open doorway.
function nudgePastGaps(z, gaps) {
  let moved = true;
  while (moved) {
    moved = false;
    for (const g of (gaps || [])) {
      if (z > g[0] && z < g[1]) { z = g[1] + 40; moved = true; }
    }
  }
  return z;
}

// A junction's opening in the wall: a dark "doorway" backdrop (hinting empty
// space/another aisle beyond, instead of a flat solid wall) plus a sliver of
// the side-corridor's floor peeking through at floor level, so the opening
// reads as "you can turn here" even before the glowing ◀/▶ cue draws.
const GAP_PEEK_X = 130; // how far beyond the wall the floor-sliver hint extends
function drawWallGapOpening(sideSign, x, gapZ0, gapZ1) {
  const outerX = x + sideSign * GAP_PEEK_X;
  const b0 = projWorld(x, 0, gapZ0), b1 = projWorld(x, 0, gapZ1);
  const t0 = projWorld(x, WALL_TOP_Y, gapZ0), t1 = projWorld(x, WALL_TOP_Y, gapZ1);
  ctx.fillStyle = 'rgba(4, 8, 16, 0.88)';
  ctx.beginPath();
  ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(t1.x, t1.y); ctx.lineTo(t0.x, t0.y);
  ctx.closePath(); ctx.fill();

  const o0 = projWorld(outerX, 0, gapZ0), o1 = projWorld(outerX, 0, gapZ1);
  ctx.fillStyle = '#4b5568';
  ctx.beginPath();
  ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.lineTo(o1.x, o1.y); ctx.lineTo(o0.x, o0.y);
  ctx.closePath(); ctx.fill();
}

// One shelf wall (left or right), drawn as a back panel plus 4 solid tier
// ledges (boards with real thickness, not just a stroked line) so it clearly
// reads as stocked shelving rather than a flat colored wall. sideSign is -1
// (left) or +1 (right). nearZ is clamped to camera.z + NEAR_CLIP — same fix
// as the floor — so the wall quad's near edge is never at/behind the camera
// (which is what caused the near-white/blown-out screen fill while walking).
// Wherever this corridor has a junction opening toward this side (cor.gaps),
// the panel/struts/tiers are skipped and drawWallGapOpening() draws a real
// gap instead — see buildCorridor's WALL_GAP_HALF (kept equal to
// TURN_WINDOW so the visible opening always agrees with when the turn
// control actually activates).
const TIER_PLANK_THICK = 12;
const SHELF_STRUT_SPACING_Z = 220;
function drawShelfWall(sideSign, label, cor) {
  const x = sideSign * WALL_X;
  const nearZ = Math.max(0, camera.z + NEAR_CLIP);
  const farZ = cor.farZ;
  if (farZ - nearZ < 1) return;

  const sideGaps = (cor.gaps && (sideSign === -1 ? cor.gaps.L : cor.gaps.R)) || [];
  const { segs, gaps: visibleGaps } = wallSegments(nearZ, farZ, sideGaps);

  segs.forEach(([segNear, segFar]) => {
    const bBot = projWorld(x, 0, segNear);
    const fBot = projWorld(x, 0, segFar);
    const fTop = projWorld(x, WALL_TOP_Y, segFar);
    const bTop = projWorld(x, WALL_TOP_Y, segNear);

    // Back panel — a consistent medium steel tone regardless of depth (the
    // gradient stops are fixed dark/darker colors, not distance-scaled).
    const grad = ctx.createLinearGradient(bBot.x, bBot.y, bTop.x, bTop.y);
    grad.addColorStop(0, '#3d4c63');
    grad.addColorStop(1, '#232f42');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#1a2332'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(bBot.x, bBot.y); ctx.lineTo(fBot.x, fBot.y); ctx.lineTo(fTop.x, fTop.y); ctx.lineTo(bTop.x, bTop.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Vertical support struts at regular intervals, purely decorative structure.
    for (let sz = Math.ceil(segNear / SHELF_STRUT_SPACING_Z) * SHELF_STRUT_SPACING_Z; sz <= segFar; sz += SHELF_STRUT_SPACING_Z) {
      const pb = projWorld(x, 0, sz);
      const pt = projWorld(x, WALL_TOP_Y, sz);
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
      ctx.lineWidth = Math.max(1, 3 * pb.scale);
      ctx.beginPath(); ctx.moveTo(pb.x, pb.y); ctx.lineTo(pt.x, pt.y); ctx.stroke();
    }

    // 4 stocked-shelf ledges — each drawn as a proper board with thickness
    // (top surface + a slightly darker front edge face), not a single line, so
    // the wall unmistakably reads as 4-tier shelving full-length down the aisle.
    TIER_Y.forEach(ty => {
      const surfN = projWorld(x, ty, segNear);
      const surfF = projWorld(x, ty, segFar);
      const edgeN = projWorld(x, ty - TIER_PLANK_THICK, segNear);
      const edgeF = projWorld(x, ty - TIER_PLANK_THICK, segFar);

      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(surfN.x, surfN.y); ctx.lineTo(surfF.x, surfF.y); ctx.lineTo(edgeF.x, edgeF.y); ctx.lineTo(edgeN.x, edgeN.y);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
      ctx.lineWidth = Math.max(1, 1.5 * surfN.scale);
      ctx.stroke();

      // Bright top edge highlight so the plank reads as a lit horizontal surface.
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.8)';
      ctx.lineWidth = Math.max(1, 2 * surfN.scale);
      ctx.beginPath(); ctx.moveTo(surfN.x, surfN.y); ctx.lineTo(surfF.x, surfF.y); ctx.stroke();
    });
  });

  visibleGaps.forEach(([g0, g1]) => drawWallGapOpening(sideSign, x, g0, g1));

  // Hanging aisle category sign — fixed in the world near the aisle entrance
  // (like a real overhead department sign), not re-anchored to the camera —
  // nudged past a gap if a junction happens to open right where it'd sit.
  const signZ = nudgePastGaps(SHELF_START_Z, sideGaps);
  const signP = projWorld(x, WALL_TOP_Y + 46, signZ);
  if (signP.scale > 0.04) {
    const signFont = Math.max(8, Math.min(20, 34 * signP.scale));
    ctx.font = `bold ${signFont}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width;
    const padX = signFont * 0.6, padY = signFont * 0.85;
    ctx.fillStyle = 'rgba(2, 132, 199, 0.92)';
    ctx.beginPath();
    ctx.roundRect(signP.x - tw / 2 - padX, signP.y - padY, tw + padX * 2, padY * 2, 6);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, signP.x, signP.y);
  }
}

// A single product billboard standing on its shelf tier. Always drawn (never
// culled by distance) — dims with depth fog down to a floor so far shelves
// stay readably "full of product" instead of disappearing. Only products in
// the forward grab band (see NEAR_MARGIN/GRAB_AHEAD above) get the green
// highlight ring and are tappable; everything else is just shelf dressing.
const PRODUCT_NEAR_CLIP = 40;
const FOG_FLOOR = 0.55; // raised from the original 0.4 so shelves read crisply at every depth
// fogRange is recomputed each render() call from the CURRENT corridor's farZ
// (corridors have different lengths), so distant products fog out consistently
// regardless of which corridor is active.
let fogRange = 1000;
function drawProductBillboard(entry) {
  const d = entry.z - camera.z;
  if (d < PRODUCT_NEAR_CLIP) return null; // would be beside/behind the camera — not visible
  const p = projWorld(entry.x, entry.y, entry.z);
  if (p.scale < 0.015) return null;

  const prod = PRODUCTS.find(pr => pr.id === entry.id);
  if (!prod) return null;

  // Forward grab band (see NEAR_MARGIN/GRAB_AHEAD comment): only products
  // ahead of the cart are grabbable/highlighted, which also keeps every
  // highlighted product's screen x comfortably centered instead of edge-jammed.
  const aheadZ = entry.z - player.z;
  const reachable = aheadZ > NEAR_MARGIN && aheadZ < GRAB_AHEAD;

  const fontSize = Math.max(9, 34 * p.scale);

  // Depth fog: fades smoothly with distance from the camera but never drops
  // below FOG_FLOOR. Reachable/highlighted products are always drawn at full
  // brightness (crisp, easy to spot) regardless of fog.
  const fogAlpha = Math.max(FOG_FLOOR, 1 - d / fogRange);
  const alpha = reachable ? 1 : fogAlpha;

  ctx.save();
  // Shadow on the shelf plank
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + fontSize * 0.42, fontSize * 0.42, fontSize * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = alpha;
  // Pale "shelf slot" backing tile behind the icon so products pop against the
  // dark shelving at every depth, instead of relying on the emoji glyph alone.
  const tileR = fontSize * 0.62;
  ctx.fillStyle = 'rgba(241, 245, 249, 0.85)';
  ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
  ctx.lineWidth = Math.max(1, 1.2 * p.scale);
  ctx.beginPath();
  ctx.roundRect(p.x - tileR, p.y - tileR, tileR * 2, tileR * 2, tileR * 0.3);
  ctx.fill(); ctx.stroke();

  ctx.font = `${fontSize}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(prod.icon, p.x, p.y);
  ctx.globalAlpha = 1;
  if (reachable) {
    // Green highlight ring so it's obvious which products are grabbable right now.
    ctx.strokeStyle = 'rgba(74, 222, 128, 0.95)';
    ctx.lineWidth = Math.max(1.5, 2.4 * p.scale);
    ctx.beginPath();
    ctx.arc(p.x, p.y, fontSize * 0.85, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // Generous tap radius — comfortably bigger than the visual highlight ring
  // so a real fingertip tap lands reliably on grabbable products.
  const hitR = Math.max(26, fontSize * 0.95);
  return { entry, prod, x: p.x, y: p.y, r: hitR, reachable };
}

// Checkout / POS counter at the far end of the aisle.
const CHECKOUT_W = 130, CHECKOUT_H = 70, CHECKOUT_TOP = 55;
function drawCheckoutStructure(cor) {
  const checkoutZ = cor.checkoutZ;
  const z0 = checkoutZ - CHECKOUT_H / 2, z1 = checkoutZ + CHECKOUT_H / 2;
  const xL = -CHECKOUT_W / 2, xR = CHECKOUT_W / 2;

  const nb = projWorld(xL, 0, z0), fb = projWorld(xL, 0, z1);
  const nt = projWorld(xL, CHECKOUT_TOP, z0), ft = projWorld(xL, CHECKOUT_TOP, z1);
  const nbR = projWorld(xR, 0, z0), ntR = projWorld(xR, CHECKOUT_TOP, z0);
  const ftR = projWorld(xR, CHECKOUT_TOP, z1);

  // Front face
  ctx.fillStyle = '#134e2f';
  ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(nb.x, nb.y); ctx.lineTo(nbR.x, nbR.y); ctx.lineTo(ntR.x, ntR.y); ctx.lineTo(nt.x, nt.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Top face
  ctx.fillStyle = '#166534';
  ctx.beginPath();
  ctx.moveTo(nt.x, nt.y); ctx.lineTo(ntR.x, ntR.y); ctx.lineTo(ftR.x, ftR.y); ctx.lineTo(ft.x, ft.y);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Scanner laser glow across the top
  const laserA = projWorld(xL + 12, CHECKOUT_TOP + 1, checkoutZ);
  const laserB = projWorld(xR - 12, CHECKOUT_TOP + 1, checkoutZ);
  ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
  ctx.lineWidth = Math.max(1, 4 * laserA.scale);
  ctx.beginPath(); ctx.moveTo(laserA.x, laserA.y); ctx.lineTo(laserB.x, laserB.y); ctx.stroke();

  // Label sign
  const labelP = projWorld(0, CHECKOUT_TOP + 55, checkoutZ);
  if (labelP.scale > 0.03) {
    const labelFont = Math.max(8, Math.min(20, 34 * labelP.scale));
    ctx.font = `bold ${labelFont}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const label = t('checkout');
    const tw = ctx.measureText(label).width;
    const padX = labelFont * 0.6, padY = labelFont * 0.85;
    ctx.fillStyle = 'rgba(34, 197, 94, 0.92)';
    ctx.beginPath();
    ctx.roundRect(labelP.x - tw / 2 - padX, labelP.y - padY, tw + padX * 2, padY * 2, 6);
    ctx.fill();
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillText(label, labelP.x, labelP.y);
  }
}

// Fixed on-screen anchor where the cart basket sits (foreground, bottom
// center) — used both for drawing the cart/pusher sprite and as the landing
// point for flying-grabbed-item particles.
function cartScreenAnchor() {
  return { x: W / 2, y: H - Math.max(70, H * 0.1) };
}

// Bunicul (a friendly white-haired grandpa) seen from behind, pushing the
// shopping cart. Drawn directly in screen space as a fixed foreground sprite,
// always on top of the aisle.
function drawCartAndPusher() {
  const anchor = cartScreenAnchor();
  // Height-driven so it scales sensibly on both desktop and a narrow ~375px
  // mobile portrait screen, and capped so it never swallows the view of the
  // shelves/products ahead. The floor was previously a flat 1.05, which
  // meant ANY viewport shorter than ~609px (e.g. a ~390px landscape phone)
  // got stuck at the same near-full size and the cart/grandpa clipped off
  // the bottom of the screen. The floor now drops much lower (0.65) so short
  // landscape viewports actually shrink the sprite to fit — portrait phones
  // are never short enough in H to hit that floor (verified in the harness),
  // so portrait sizing is unchanged.
  const scale = Math.max(0.65, Math.min(2.2, H / 580));

  ctx.save();
  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(anchor.x, anchor.y + 66 * scale, 92 * scale, 20 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(anchor.x, anchor.y);
  ctx.scale(scale, scale);

  // Caster wheels
  ctx.fillStyle = '#1e293b';
  [-46, 26].forEach(wx => { [30, 58].forEach(wy => { ctx.beginPath(); ctx.arc(wx + 10, wy, 9, 0, Math.PI * 2); ctx.fill(); }); });

  // Metallic wireframe basket
  const cartGrad = ctx.createLinearGradient(-58, -20, 58, 60);
  cartGrad.addColorStop(0, '#cbd5e1');
  cartGrad.addColorStop(0.5, '#f8fafc');
  cartGrad.addColorStop(1, '#94a3b8');
  ctx.fillStyle = cartGrad;
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(-58, -18, 116, 66, 10);
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = 'rgba(71, 85, 105, 0.4)';
  ctx.lineWidth = 1.5;
  for (let gx = -40; gx <= 40; gx += 24) { ctx.beginPath(); ctx.moveTo(gx, -18); ctx.lineTo(gx, 48); ctx.stroke(); }
  for (let gy = -4; gy <= 40; gy += 18) { ctx.beginPath(); ctx.moveTo(-58, gy); ctx.lineTo(58, gy); ctx.stroke(); }

  // Collected items piled up inside the basket
  player.cart.forEach((itemId, idx) => {
    const prod = PRODUCTS.find(p => p.id === itemId);
    if (!prod) return;
    const ix = -42 + (idx % 5) * 21;
    const iy = 10 - Math.floor(idx / 5) * 16;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
    ctx.beginPath(); ctx.ellipse(ix, iy + 8, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(prod.icon, ix, iy);
  });

  // Red handle bar — moved to the BACK-TOP of the basket (just above its
  // rim at y=-18) instead of below the basket. Grandpa stands behind the
  // cart, so he (and the handle he grips) belongs above the basket's back
  // rim in screen space, not hanging off the bottom/front of it — that
  // inverted placement was why only his head used to peek over the cart.
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.roundRect(-50, -34, 100, 12, 6);
  ctx.fill();

  // Bunicul, standing behind the cart pushing the handle — seen from behind.
  // Drawn entirely ABOVE the handle/basket (increasingly negative y) so a
  // full little upper-body figure — hands, arms, a good chunk of his
  // cardigan torso, and a clearly bigger head — shows above the cart's back
  // rim, not just a bald spot peeking up.
  ctx.save();

  // Hands gripping the handle
  ctx.fillStyle = '#e7b892';
  ctx.beginPath(); ctx.arc(-40, -30, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(40, -30, 7, 0, Math.PI * 2); ctx.fill();
  // Defined outline on the hands so they read clearly on the handle bar.
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(-40, -30, 7, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(40, -30, 7, 0, Math.PI * 2); ctx.stroke();

  // Arms reaching down from the shoulders to the hands on the handle
  ctx.strokeStyle = '#e7b892';
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-20, -88); ctx.lineTo(-40, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -88); ctx.lineTo(40, -30); ctx.stroke();

  // Cozy cardigan torso (seen from behind) — a soft vertical gradient plus a
  // darker, higher-contrast outline so it reads clearly against the aisle.
  // Its bottom edge sits well above the basket's rim (y=-18), so a good
  // chunk of the torso is always visibly clear of the cart.
  const cardiganGrad = ctx.createLinearGradient(0, -94, 0, -36);
  cardiganGrad.addColorStop(0, '#8291a8');
  cardiganGrad.addColorStop(1, '#5b6b82');
  ctx.fillStyle = cardiganGrad;
  ctx.beginPath();
  ctx.moveTo(-34, -36); ctx.quadraticCurveTo(-38, -70, -22, -94);
  ctx.lineTo(22, -94); ctx.quadraticCurveTo(38, -70, 34, -36);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2.5; ctx.stroke();
  // Knit / ribbing texture accents
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1.5;
  [-16, -2, 12].forEach(lx => {
    ctx.beginPath(); ctx.moveTo(lx, -88); ctx.lineTo(lx * 1.1, -40); ctx.stroke();
  });

  // Skin (neck/shoulders visible from behind)
  ctx.fillStyle = '#e7b892';
  ctx.beginPath(); ctx.ellipse(0, -90, 22, 12, 0, 0, Math.PI * 2); ctx.fill();

  // Head with crisp white/grey hair from behind, neat with a small bald spot
  // on top — a light-to-white gradient plus a clean outline stroke so the
  // hair reads clearly rather than blending into the background. Sized up
  // (19-19.5px radius, was 16-16.5) so it's clearly bigger/easier to see.
  ctx.fillStyle = '#e7b892';
  ctx.beginPath(); ctx.arc(0, -116, 19, 0, Math.PI * 2); ctx.fill();
  const hairGrad = ctx.createLinearGradient(0, -137, 0, -100);
  hairGrad.addColorStop(0, '#f8fafc');
  hairGrad.addColorStop(1, '#cbd5e1');
  ctx.fillStyle = hairGrad;
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(0, -118, 19.5, Math.PI * 0.85, Math.PI * 2.15); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-18, -118); ctx.quadraticCurveTo(-23, -99, -13, -85); ctx.quadraticCurveTo(-19, -102, -18, -118); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18, -118); ctx.quadraticCurveTo(23, -99, 13, -85); ctx.quadraticCurveTo(19, -102, 18, -118); ctx.fill(); ctx.stroke();
  // Small bald spot at the crown
  ctx.fillStyle = '#e7b892';
  ctx.beginPath(); ctx.ellipse(0, -127, 7, 4.5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
  ctx.restore();
}

// Flying "grabbed item" particles: eased screen-space icons from the shelf tap
// point to the cart anchor.
function drawFlyingItems() {
  const anchor = cartScreenAnchor();
  flyingItems.forEach(f => {
    const p = Math.min(1, f.t / f.dur);
    const ease = 1 - Math.pow(1 - p, 2);
    const x = f.sx + (anchor.x - f.sx) * ease;
    const y = f.sy + (anchor.y - 40 - f.sy) * ease - Math.sin(p * Math.PI) * 60;
    ctx.save();
    ctx.globalAlpha = 1 - p * 0.2;
    ctx.font = `${Math.max(10, f.size * (1 - p * 0.4))}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.icon, x, y);
    ctx.restore();
  });
}

// ---- Tap-to-grab hit-testing ----
// billboardHits is rebuilt every frame during renderSupermarket() so the click
// handler can hit-test against this frame's actual projected positions.
let billboardHits = [];

function findTappedProduct(px, py) {
  let best = null, bestDist = Infinity;
  billboardHits.forEach(hit => {
    const dx = px - hit.x, dy = py - hit.y;
    const dist = Math.hypot(dx, dy);
    if (dist < hit.r && dist < bestDist) { best = hit; bestDist = dist; }
  });
  return best;
}

function grabProduct(hit) {
  const lvl = LEVELS[currentLevelIdx];
  const isRequired = lvl.targetItems.includes(hit.entry.id);

  flyingItems.push({ icon: hit.prod.icon, sx: hit.x, sy: hit.y, t: 0, dur: 0.45, size: 26 });

  if (isRequired) {
    player.cart.push(hit.entry.id);
    score += 150;
    playSfx('pop');
    showFeedback(t('itemAdded'));
  } else {
    playSfx('wrong');
    score = Math.max(0, score - 50);
    showFeedback(t('notOnList'), true);
  }
  updatePaperShoppingListUI();
}

// Keyboard/gamepad-style grab (Space or E): grabs whichever currently-reachable
// (forward-band, green-ringed) product is closest to horizontal screen center —
// i.e. the one the player is most obviously "looking at" — same scoring/
// fly-to-cart path as a tap.
function attemptGrab() {
  if (gameState !== 'PLAY') return null;
  const reachable = billboardHits.filter(h => h.reachable);
  if (!reachable.length) return null;
  let best = reachable[0], bestDist = Math.abs(best.x - W / 2);
  reachable.forEach(h => {
    const dist = Math.abs(h.x - W / 2);
    if (dist < bestDist) { bestDist = dist; best = h; }
  });
  grabProduct(best);
  return best;
}

// Glowing ↰/↱ cues in the 3D view itself (in addition to the on-screen ◀/▶
// buttons lighting up) so a turn's availability is obvious regardless of
// input method.
function drawTurnCues(horizonY) {
  const canL = !!getActiveJunction('L');
  const canR = !!getActiveJunction('R');
  if (!canL && !canR) return;
  const pulse = 0.65 + 0.35 * Math.sin(performance.now() / 220);
  ctx.save();
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#4ade80';
  ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 14;
  if (canL) ctx.fillText('↰', W * 0.12, horizonY);
  if (canR) ctx.fillText('↱', W * 0.88, horizonY);
  ctx.restore();
}

// ---- Mini-map (top-right, under the HUD) ----
// A compact schematic of the level's corridor graph, laid out with
// computeMapLayout() (see CORRIDOR-GRAPH LEVEL LAYOUTS) so it's a genuinely
// consistent top-down projection of the same L/R turns the player takes —
// not just a decorative sketch. Shows the player's position+facing, the
// checkout, and which corridors still hold uncollected list items.
function drawMiniMap() {
  const graph = CORRIDOR_GRAPH;
  if (!graph || !graph.mapLayout) return;
  const lvl = LEVELS[currentLevelIdx];
  const { topBar, hudH } = chromeMetrics();
  const boxW = 152, boxH = 128;
  const boxX = W - boxW - 14, boxY = topBar + hudH + 6;

  ctx.save();
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 10);
  ctx.fill(); ctx.stroke();

  const ids = Object.keys(graph.corridors);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  ids.forEach(id => {
    const c = graph.corridors[id], L = graph.mapLayout[id];
    if (!L) return;
    const ex = L.origin.x + L.dir.x * c.length, ey = L.origin.y + L.dir.y * c.length;
    [L.origin.x, ex].forEach(v => { if (v < minX) minX = v; if (v > maxX) maxX = v; });
    [L.origin.y, ey].forEach(v => { if (v < minY) minY = v; if (v > maxY) maxY = v; });
  });
  const spanX = Math.max(1, maxX - minX), spanY = Math.max(1, maxY - minY);
  const pad = 16;
  const mapScale = Math.min((boxW - pad * 2) / spanX, (boxH - pad * 2) / spanY);
  const toPx = (x, y) => ({ x: boxX + pad + (x - minX) * mapScale, y: boxY + pad + (y - minY) * mapScale });

  ids.forEach(id => {
    const c = graph.corridors[id], L = graph.mapLayout[id];
    if (!L) return;
    const p0 = toPx(L.origin.x, L.origin.y);
    const p1 = toPx(L.origin.x + L.dir.x * c.length, L.origin.y + L.dir.y * c.length);
    const hasRemaining = c.products.some(pr => lvl.targetItems.includes(pr.id) && !player.cart.includes(pr.id));
    ctx.strokeStyle = hasRemaining ? '#fbbf24' : 'rgba(148, 163, 184, 0.6)';
    ctx.lineWidth = id === player.corridorId ? 4 : 2.5;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    if (c.hasCheckout) {
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.arc(p1.x, p1.y, 4, 0, Math.PI * 2); ctx.fill();
    }
  });

  const L = graph.mapLayout[player.corridorId];
  const cor = graph.corridors[player.corridorId];
  if (L && cor) {
    const pp = toPx(L.origin.x + L.dir.x * player.z, L.origin.y + L.dir.y * player.z);
    const ang = Math.atan2(L.dir.y, L.dir.x);
    ctx.save();
    ctx.translate(pp.x, pp.y);
    ctx.rotate(ang);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(7, 0); ctx.lineTo(-4, 4.5); ctx.lineTo(-4, -4.5); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = '#93c5fd';
  ctx.font = 'bold 9px -apple-system, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('🗺 MAP', boxX + 6, boxY + 4);
  ctx.restore();
}

// Draws the current corridor's 3D scene (floor/walls/products/checkout/cart).
// Wrapped in a temporary rotate transform during a turn's whip transition
// (see render()) so the discrete corridor swap reads as a quick ~90° pan.
function drawCorridorScene(cor, horizonY) {
  drawAisleFloor(cor);
  drawBackWall(cor);
  drawShelfWall(-1, cor.leftLabel, cor);
  drawShelfWall(1, cor.rightLabel, cor);
  if (cor.hasCheckout) drawCheckoutStructure(cor);

  // Products, painter's algorithm far-to-near so nearer billboards draw on top.
  billboardHits = [];
  cor.products
    .slice()
    .sort((a, b) => b.z - a.z)
    .forEach(entry => {
      const hit = drawProductBillboard(entry);
      if (hit) billboardHits.push(hit);
    });

  drawFlyingItems();
  drawTurnCues(horizonY);

  // Foreground cart + grandpa pusher, always drawn last (on top of everything else).
  drawCartAndPusher();
}

function renderSupermarket() {
  const lvl = LEVELS[currentLevelIdx];
  const cor = currentCorridor();
  fogRange = cor.farZ - SHELF_START_Z;
  const { topBar, hudH } = chromeMetrics();
  const chromeBottom = topBar + hudH;

  // Sky/backdrop gradient toward the vanishing point.
  const horizonY = H * HORIZON_FRAC;
  const bgGrad = ctx.createLinearGradient(0, chromeBottom, 0, horizonY);
  bgGrad.addColorStop(0, '#0b1426');
  bgGrad.addColorStop(1, '#243350');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, chromeBottom, W, Math.max(0, horizonY - chromeBottom));
  ctx.fillStyle = '#0b1426';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Whip-rotate transition: briefly rotate the corridor scene toward 0° from
  // a starting ±90° while a turn is in flight, plus a quick white flash at
  // its midpoint, so the discrete corridor swap (already applied to game
  // state in attemptTurn()) reads as a snappy ~90° pan instead of a hard cut.
  let flashAlpha = 0;
  if (turnTransition) {
    const p = Math.min(1, turnTransition.t / TURN_TRANSITION_DUR);
    const eased = 1 - Math.pow(1 - p, 3);
    const startAngle = (turnTransition.dir === 'L' ? -1 : 1) * (Math.PI / 2);
    const angle = startAngle * (1 - eased);
    flashAlpha = Math.sin(p * Math.PI) * 0.6;
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(angle);
    ctx.translate(-W / 2, -H / 2);
    drawCorridorScene(cor, horizonY);
    ctx.restore();
  } else {
    drawCorridorScene(cor, horizonY);
  }
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Checkout proximity prompt
  if (cor.hasCheckout && Math.abs(player.z - cor.checkoutZ) < 160) {
    ctx.fillStyle = '#16a34a';
    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('checkout'), W / 2, horizonY - 10);
  }

  // Tap-to-grab: consume a pending click only while actually playing (not
  // paused/modals) and not mid-turn-transition, so the same click doesn't
  // leak into a menu button or grab through a whip-pan.
  if (gameState === 'PLAY' && !turnTransition && menuClick && stateCooldown <= 0) {
    const hit = findTappedProduct(menuClick.x, menuClick.y);
    menuClick = null;
    if (hit && hit.reachable) grabProduct(hit);
  }

  // Resource HUD Bar — height/position tracks chromeMetrics() so it shrinks
  // to match the compacted .top-control-bar on short/landscape viewports
  // instead of always reserving a fixed 92px of vertical chrome.
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, topBar, W, hudH);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.strokeRect(0, topBar, W, hudH);

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 14px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const cartCount = player.cart.length;
  const reqCount = lvl.targetItems.length;
  const timeText = levelTimer > 0 ? `  ·  ⏱ ${Math.ceil(levelTimer)}s` : '';

  ctx.fillText(`🛒 LEVEL ${currentLevelIdx + 1}: ${lvl.name}  ·  📋 CART: ${cartCount}/${reqCount}${timeText}  ·  ⭐ SCORE: ${score}`, W / 2 + 100, topBar + hudH / 2);

  drawMiniMap();
}


function drawMenuBtn(x, y, w, h, text, onClick) {
  ctx.save();
  ctx.fillStyle = '#22c55e';
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 12);
  ctx.fill(); ctx.stroke();

  ctx.font = 'bold 15px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
  ctx.restore();

  if (menuClick && stateCooldown <= 0) {
    if (menuClick.x >= x - w/2 && menuClick.x <= x + w/2 && menuClick.y >= y - h/2 && menuClick.y <= y + h/2) {
      playSfx('pop');
      menuClick = null;
      stateCooldown = 0.35;
      onClick();
    }
  }
}

function drawModalCard(title, sub, buttons) {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
  ctx.fillRect(0, 0, W, H);

  const cardW = Math.min(W * 0.9, 420);
  const cardH = 260;
  const cardX = (W - cardW) / 2;
  const cardY = (H - cardH) / 2;

  ctx.fillStyle = '#0f172a';
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 3;
  ctx.roundRect(cardX, cardY, cardW, cardH, 20);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#4ade80';
  ctx.font = 'bold 26px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, cardY + 45);

  ctx.fillStyle = '#cbd5e1';
  ctx.font = '14px sans-serif';
  ctx.fillText(sub, W / 2, cardY + 85);

  buttons.forEach((btn, idx) => {
    drawMenuBtn(W / 2, cardY + 140 + idx * 52, 240, 44, btn.label, btn.action);
  });

  ctx.restore();
}

// ============ LEADERBOARD ENGINE ============
function loadLeaderboard() {
  try {
    const saved = localStorage.getItem('supermarket3dLeaderboard');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return [];
}

function saveLeaderboard(board) {
  try {
    localStorage.setItem('supermarket3dLeaderboard', JSON.stringify(board));
  } catch (e) {}
}

function openLeaderboardModal() {
  const board = loadLeaderboard();
  const listEl = document.getElementById('lbList');
  document.getElementById('lbTitle').innerText = t('topScores');

  if (!board.length) {
    listEl.innerHTML = `<div style="text-align:center; padding:20px; color:#cbd5e1;">${t('noScoresYet')}</div>`;
  } else {
    let html = '';
    board.slice(0, 10).forEach((entry, idx) => {
      const rankBadge = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `#${idx + 1}`));
      html += `
        <div class="lb-row">
          <span class="lb-rank">${rankBadge}</span>
          <span class="lb-name">${entry.name}</span>
          <span class="lb-score">${entry.score}</span>
        </div>
      `;
    });
    listEl.innerHTML = html;
  }
  document.getElementById('leaderboardModal').style.display = 'flex';
}

document.getElementById('lbCloseBtn').addEventListener('click', () => {
  document.getElementById('leaderboardModal').style.display = 'none';
});

function openNamePromptModal() {
  document.getElementById('namePromptModal').style.display = 'flex';
}

document.getElementById('saveScoreBtn').addEventListener('click', () => {
  const name = (document.getElementById('p1NameInput').value.trim() || 'Lilo').slice(0, 12);
  const board = loadLeaderboard();
  board.push({ name, score });
  board.sort((a, b) => b.score - a.score);
  saveLeaderboard(board.slice(0, 10));

  document.getElementById('namePromptModal').style.display = 'none';
  openLeaderboardModal();
});

// ============ MAIN GAME LOOP ============
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (pendingState !== null) {
    gameState = pendingState;
    pendingState = null;
  }

  if (stateCooldown > 0) stateCooldown -= dt;
  if (feedbackTimer > 0) feedbackTimer -= dt;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

</script>
